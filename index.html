<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gym-Logbuch</title>
<meta name="description" content="Trainings-Logbuch: Übungen, Geräte-Einstellungen, Sätze, Wiederholungen und Gewicht.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#eef1f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1219" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gym-Log">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow phone column, sticky title bar on top, tab bar fixed at the bottom; screens stack above the tabs. */
:root{
  --bg:#eef1f5; --surface:#ffffff; --sunk:#e3e8ef; --ink:#121823; --muted:#566274; --line:#d2d8e1;
  --accent:#1f46c2; --accent-ink:#ffffff; --accent-soft:#dfe6fb;
  --pr:#c62f28; --pr-soft:#fbe2df; --ok:#1d7a4b;
  --cal1:#c9d6f7; --cal2:#7d9bec; --cal3:#1f46c2; --cal-ink3:#ffffff;
  --body-base:#c5cbd4; --heat-lo:#f5b97a; --heat-hi:#c62f28; --body-dark:0; --stage:#e4e9f0; --body-hair:#3b3f47;
  --anat-skin:#c3c8cf; --anat-skin-dark:#9aa1ab; --anat-muscle:#f4f5f7; --anat-muscle-dark:#cfd3d9; --anat-line:#6c737d;
  --t-push:#2a78d6; --t-push-ink:#fff; --t-pull:#eb6834; --t-pull-ink:#fff; --t-beine:#1baf7a; --t-beine-ink:#0b1a14; --t-oben:#eda100; --t-oben-ink:#1f1600; --t-unten:#e87ba4; --t-unten-ink:#2a0d18; --t-ganz:#008300; --t-ganz-ink:#fff; --t-cardio:#6250d6; --t-cardio-ink:#fff; --t-sonst:#e34948; --t-sonst-ink:#fff;
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1219; --surface:#161d28; --sunk:#1e2734; --ink:#e6ebf2; --muted:#93a0b2; --line:#2a3546;
    --accent:#7196ff; --accent-ink:#0a1124; --accent-soft:#1c2a4f;
    --pr:#ff7568; --pr-soft:#3d1e1b; --ok:#52c78d; --cal1:#24345e; --cal2:#3d5bb5; --cal3:#7196ff; --cal-ink3:#0a1124; --body-base:#566176; --heat-lo:#f2a25c; --heat-hi:#ff5848; --body-dark:1; --stage:#111824; --body-hair:#1c2028; --anat-skin:#4a5262; --anat-skin-dark:#363d4a; --anat-muscle:#9aa3b2; --anat-muscle-dark:#687182; --anat-line:#1d222b; --t-push:#3987e5; --t-push-ink:#fff; --t-pull:#d95926; --t-pull-ink:#fff; --t-beine:#199e70; --t-beine-ink:#fff; --t-oben:#c98500; --t-oben-ink:#1f1600; --t-unten:#d55181; --t-unten-ink:#fff; --t-ganz:#008300; --t-ganz-ink:#fff; --t-cardio:#9085e9; --t-cardio-ink:#120d33; --t-sonst:#e66767; --t-sonst-ink:#fff; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1219; --surface:#161d28; --sunk:#1e2734; --ink:#e6ebf2; --muted:#93a0b2; --line:#2a3546;
  --accent:#7196ff; --accent-ink:#0a1124; --accent-soft:#1c2a4f;
  --pr:#ff7568; --pr-soft:#3d1e1b; --ok:#52c78d; --cal1:#24345e; --cal2:#3d5bb5; --cal3:#7196ff; --cal-ink3:#0a1124; --body-base:#566176; --heat-lo:#f2a25c; --heat-hi:#ff5848; --body-dark:1; --stage:#111824; --body-hair:#1c2028; --anat-skin:#4a5262; --anat-skin-dark:#363d4a; --anat-muscle:#9aa3b2; --anat-muscle-dark:#687182; --anat-line:#1d222b; --t-push:#3987e5; --t-push-ink:#fff; --t-pull:#d95926; --t-pull-ink:#fff; --t-beine:#199e70; --t-beine-ink:#fff; --t-oben:#c98500; --t-oben-ink:#1f1600; --t-unten:#d55181; --t-unten-ink:#fff; --t-ganz:#008300; --t-ganz-ink:#fff; --t-cardio:#9085e9; --t-cardio-ink:#120d33; --t-sonst:#e66767; --t-sonst-ink:#fff; color-scheme:dark;
}
*{box-sizing:border-box}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
img{max-width:100%}
html,body{background:var(--bg)}
body{margin:0;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;line-height:1.05;text-wrap:balance;margin:0}
.num{font-variant-numeric:tabular-nums}

/* Title bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid transparent}
.bar.scrolled{border-bottom-color:var(--line)}
.bar .wrap{display:flex;align-items:center;gap:10px;min-height:58px;padding-block:8px}
.bar h1{font-size:1.75rem;text-transform:uppercase;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar.sub h1{font-size:1.4rem}
.back{border:0;background:var(--sunk);border-radius:999px;padding:6px 14px 6px 10px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.back svg{width:18px;height:18px}
.sync{font-size:.78rem;color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync[data-s="local"]::before{background:var(--ok)}
.sync[data-s="saving"]::before{background:var(--accent)}
.sync[data-s="memory"]::before{background:#d39b1f}
.sync[data-s="error"]::before{background:var(--pr)}

main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
main .wrap{display:flex;flex-direction:column;gap:20px;padding-block:8px 24px}

/* Tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 10px;font-size:.78rem;font-weight:600;color:var(--muted)}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent)}

/* Generic pieces */
.eyebrow{font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{width:100%;min-height:54px;font-size:1.05rem}
.btn.ghost{background:none;border-color:transparent;color:var(--accent);padding-inline:8px}
.btn.danger{color:var(--pr);border-color:var(--pr)}
.btn.danger.armed{background:var(--pr);color:var(--surface)}
.btn svg{width:20px;height:20px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row .btn{flex:1 1 140px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:500;font-size:.92rem}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pr{display:inline-flex;align-items:center;gap:4px;background:var(--pr-soft);color:var(--pr);font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:2px 8px;white-space:nowrap}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:.85rem;font-weight:600;color:var(--muted)}
.input,textarea.input,select.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px;min-height:46px}
textarea.input{min-height:76px;resize:vertical}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.search .input{padding-left:38px}

/* Today */
.date-head h2{font-size:2.3rem;text-transform:uppercase}
.log-card{display:flex;flex-direction:column;gap:6px;padding:14px 16px;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius)}
.log-card .top{display:flex;align-items:baseline;gap:8px;justify-content:space-between}
.log-card h3{font-size:1.35rem}
.sets-line{display:flex;flex-wrap:wrap;gap:4px 12px;font-family:var(--f-display);font-size:1.15rem;font-weight:600;font-variant-numeric:tabular-nums}
.sets-line .x{color:var(--muted);font-weight:500}
.meta{font-size:.85rem;color:var(--muted)}

.empty{padding:22px 18px;display:flex;flex-direction:column;gap:14px}
.empty h3{font-size:1.5rem}
.empty p{margin:0}

/* Lists */
.group h3{font-size:.8rem;font-family:var(--f-body);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px 2px}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:13px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0}
.item .name{font-weight:600;font-size:1.05rem}
.item .sub{font-size:.85rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .chev{width:18px;height:18px;color:var(--muted);flex:none}
.item .plus{width:22px;height:22px;color:var(--accent);flex:none}

/* Logger */
.ex-head{display:flex;flex-direction:column;gap:8px}
.ex-head h2{font-size:2.4rem;text-transform:uppercase}
.settings{display:flex;flex-wrap:wrap;gap:8px;margin:0}
.settings div{background:var(--sunk);border-radius:8px;padding:6px 10px;display:flex;gap:6px;align-items:baseline}
.settings dt{font-size:.8rem;color:var(--muted)}
.settings dd{margin:0;font-weight:600}
.lastline{padding:10px 14px;background:var(--accent-soft);border-radius:10px;font-size:.92rem}
.lastline b{font-family:var(--f-display);font-size:1.05rem;font-variant-numeric:tabular-nums}
.sets{display:flex;flex-direction:column;gap:8px}
.set-head,.set-row{display:grid;grid-template-columns:var(--cols,2.2rem 1fr 1fr 3.1rem);gap:8px;align-items:center}
.set-head{font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 2px}
.set-head span{text-align:center}
.set-row .fake{height:46px;border:1px solid var(--line);background:var(--surface);border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:1.4rem;font-weight:600;font-variant-numeric:tabular-nums}
.set-row .chk.fake-chk{height:46px}
.lay-item{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 6px;border-top:1px solid var(--line);background:var(--surface)}
.lay-item:first-child{border-top:0}
.lay-item b{flex:1;font-weight:600}
.lay-item .meta{white-space:nowrap}
.lay-preview{background:var(--bg);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.set-row .n{font-family:var(--f-display);font-size:1.4rem;font-weight:700;color:var(--muted);text-align:center}
.set-row input{width:100%;min-width:0;height:54px;border:1px solid var(--line);background:var(--surface);border-radius:10px;text-align:center;font-family:var(--f-display);font-size:1.6rem;font-weight:600;font-variant-numeric:tabular-nums}
.set-row input::placeholder{color:var(--muted);opacity:.55}
.sets.dense .set-row input{font-size:1.3rem;height:50px}
.sets.dense2 .set-row input{font-size:1.1rem;height:48px;border-radius:8px}
.sets.dense2,.sets.dense2 .set-row,.sets.dense2 .set-head{gap:5px}
.sets.dense2 .set-head span,.sets.dense .set-head span{font-size:.66rem;letter-spacing:.02em;line-height:1.1;overflow:hidden;hyphens:auto;-webkit-hyphens:auto}
.set-head{align-items:end}
.set-row input.txt{font-family:var(--f-body);font-size:1rem!important;font-weight:600}
.sets-line .xt,.sub .xt{font-family:var(--f-body);font-size:.8rem;font-weight:500;color:var(--muted)}
.chk{height:54px;border-radius:10px;border:1px dashed var(--line);background:none;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.chk svg{width:24px;height:24px}
.set-row.filled .chk{border-style:solid;border-color:var(--ok);background:var(--ok);color:var(--surface)}
.set-row.filled .n{color:var(--ink)}
.hint{font-size:.85rem;color:var(--muted);margin:0}

/* Exercise detail */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-size:1.7rem;font-variant-numeric:tabular-nums;line-height:1}
.stat span{font-size:.75rem;color:var(--muted);font-weight:600}
.chart{padding:14px 14px 8px}
.chart svg{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .area{fill:var(--accent);opacity:.12}
.chart .line{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .end{fill:var(--accent)}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--f-body);font-variant-numeric:tabular-nums}
.chart text.endlabel{fill:var(--ink);font-weight:600;font-size:11px}
.hist{display:flex;flex-direction:column}
.cal{padding:14px 12px 12px}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.cal-head h3{font-size:1.45rem;text-transform:uppercase;flex:1;text-align:center}
.cal-nav{width:44px;height:40px;border:1px solid var(--line);background:var(--surface);border-radius:10px;display:flex;align-items:center;justify-content:center}
.cal-nav svg{width:20px;height:20px}
.cal-nav:disabled{opacity:.35}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-grid .wd{font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center;padding-bottom:4px}
.cal-day{aspect-ratio:1;max-width:100%;border:0;border-radius:10px;background:none;font-family:var(--f-display);font-size:1.15rem;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink);display:flex;align-items:center;justify-content:center;position:relative}
.cal-day.out{visibility:hidden}
.cal-day.future{color:var(--muted)}
.cal-day.plan{outline:2px dashed var(--muted);outline-offset:-2px;color:var(--ink)}
.cal-day.ty.plan{background:color-mix(in srgb,var(--tc) 28%,var(--surface));color:var(--ink);outline-color:var(--tc)}
.legend i.plan{background:none;outline:1.5px dashed var(--muted);outline-offset:-1.5px}
details.plan-edit{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:12px 14px}
details.plan-edit summary{font-weight:600;cursor:pointer}
details.plan-edit[open] summary{margin-bottom:12px}
.plan-next{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;border:1px dashed var(--line);border-radius:var(--radius);background:var(--surface)}
.sortable>[data-sort-id]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.sortable.stack>[data-sort-id]{position:relative}
.drag-handle{width:34px;height:38px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--muted);touch-action:none;cursor:grab;margin-right:-6px}
.drag-handle svg{width:20px;height:20px}
.sort-anim{transition:transform .16s ease}
.dragging{position:relative;z-index:15;box-shadow:0 10px 28px rgba(0,0,0,.22);background:var(--surface)!important;border-radius:var(--radius);transition:none!important}
.sorting{touch-action:none}
.sort-hint{font-size:.78rem;color:var(--muted);margin:-4px 0 0 2px}
.finish-hero{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding-top:6px}
.finish-badge{width:64px;height:64px;border-radius:50%;background:var(--ok);color:#fff;display:flex;align-items:center;justify-content:center;animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
.finish-badge svg{width:34px;height:34px}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.finish-hero h2{font-size:2.1rem;text-transform:uppercase}
.finish-hero p{margin:0;font-size:1.05rem}
.big-total{display:flex;flex-direction:column;gap:2px;padding:16px}
.big-total b{font-family:var(--f-display);font-size:3.2rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.big-total span{color:var(--muted);font-weight:600;font-size:.85rem}
.mini-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mini-stats .stat b{font-size:1.4rem}
@media (max-width:380px){.mini-stats{grid-template-columns:repeat(2,1fr)}}
.stage{position:relative;background:radial-gradient(ellipse at 50% 35%,var(--surface),var(--stage));border-radius:var(--radius);border:1px solid var(--line);overflow:hidden}
.stage canvas{display:block;width:100%;height:400px;touch-action:none;cursor:grab}
.anat-pair{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:14px 8px 26px}
.anat-pair{min-height:240px}
.anat-pair canvas{width:100%;height:auto;display:block}
.stage.paper{background:#ffffff;border-color:var(--line)}
.stage.paper .lbl3d{color:#6b7280}
.stage .views{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:6px;justify-content:flex-end}
.stage .views button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:.82rem}
.stage .hint3d{position:absolute;left:12px;bottom:10px;font-size:.75rem;color:var(--muted)}
.heat-legend{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted);flex-wrap:wrap}
.heat-legend i{display:inline-block;width:90px;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--heat-lo),var(--heat-hi))}
.heat-legend i.none{width:14px;background:var(--body-base)}
.part-bars{display:flex;flex-direction:column;gap:12px;padding:14px 16px}
.part-bar .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.part-bar .top b{font-weight:600}
.part-bar .top span{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem;white-space:nowrap}
.part-bar .track{height:10px;border-radius:5px;background:var(--sunk);margin-top:6px;overflow:hidden}
.part-bar .track i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--heat-lo),var(--heat-hi))}
.three-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.three-stats .card{padding:12px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.three-stats span{font-size:.78rem;color:var(--muted);font-weight:600}
.three-stats b{font-family:var(--f-display);font-size:1.7rem;line-height:1.05;font-variant-numeric:tabular-nums}
.three-stats small{font-size:.75rem;color:var(--muted)}
.week-pill{align-self:stretch;text-align:center;padding:12px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line);font-family:var(--f-display);font-size:1.35rem;font-weight:700;text-transform:uppercase}

.wheel{position:relative;height:220px;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;-webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent)}
.wheel .pad{height:88px}
.wheel button{display:block;width:100%;height:44px;border:0;background:none;scroll-snap-align:center;font-family:var(--f-display);font-size:1.5rem;font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted)}
.wheel button[aria-pressed="true"]{color:var(--ink);font-size:1.75rem}
.wheel-wrap{position:relative}
.wheel-wrap::before{content:"";position:absolute;left:12px;right:12px;top:88px;height:44px;border-radius:10px;background:var(--sunk);pointer-events:none}
.sheet-foot{display:flex;flex-direction:column;gap:10px;padding:12px 16px 0}

.switch{position:relative;width:52px;height:30px;flex:none;border:0;border-radius:999px;background:var(--line);padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--ok)}
.switch[aria-checked="true"]::after{transform:translateX(22px)}
@media (prefers-reduced-motion: reduce){.restbar.done .in{animation:none}.switch::after{transition:none}}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(12px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.92rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.loading{padding:40px 0;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
@media (max-width:360px){.stats{grid-template-columns:1fr 1fr}.date-head h2,.ex-head h2{font-size:2rem}}
.update-bar{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 14px;background:var(--accent-soft);border-radius:10px;font-weight:600;font-size:.92rem}
.in-unit{display:flex;align-items:center;gap:8px;color:var(--muted)}.in-unit .input{flex:1}
.grp-pick{display:flex;flex-direction:column;gap:10px}.grp-sec{display:flex;flex-direction:column;gap:6px}.grp-sec>small{font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
</style>

<script>
(function(){
"use strict";

/* ---------- Konstanten ---------- */
// Muskelgruppen, angelehnt an die übliche Einteilung im Krafttraining
// (Brust · Schultern vorne/seitlich/hinten · Nacken & Trapez · oberer Rücken · Latissimus · unterer Rücken ·
//  Bizeps · Trizeps · Unterarme · gerader und seitlicher Bauch · Po · Abduktoren · Adduktoren · Oberschenkel vorne/hinten · Waden)
const GROUP_SECTIONS=[
  ["Brust & Schultern",["Brust","Vordere Schulter","Seitliche Schulter","Hintere Schulter","Schultern"]],
  ["Rücken",["Nacken & Trapez","Oberer Rücken","Latissimus","Unterer Rücken","Rücken"]],
  ["Arme",["Bizeps","Trizeps","Unterarme"]],
  ["Bauch",["Bauch","Seitliche Bauchmuskeln"]],
  ["Hüfte & Beine",["Po","Abduktoren","Adduktoren","Oberschenkel vorne","Oberschenkel hinten","Waden","Beine"]],
  ["Sonstiges",["Ganzkörper","Cardio","Sonstiges"]]];
const GROUPS = GROUP_SECTIONS.flatMap(x=>x[1]);
// Sammelgruppen: zählen für alle ihre Teilmuskeln
const GROUP_LABEL={"Schultern":"Ganze Schulter","Rücken":"Ganzer Rücken","Beine":"Ganzes Bein","Bauch":"Gerader Bauch"};
function groupLabel(g){ return GROUP_LABEL[g]||g; }
// „Arme“ gibt es nur noch für ältere Übungen, die noch nicht genauer eingeordnet sind
const LEGACY_GROUPS = ["Arme"];
const PRESETS = [["Beinpresse","Beine"],["Latzug",["Latissimus","Bizeps"]],["Brustpresse",["Brust","Vordere Schulter","Trizeps"]],["Rudern sitzend",["Oberer Rücken","Latissimus","Hintere Schulter"]],["Schulterpresse",["Vordere Schulter","Seitliche Schulter","Trizeps"]],["Seitheben","Seitliche Schulter"],["Beinstrecker","Oberschenkel vorne"],["Beinbeuger","Oberschenkel hinten"],["Bizepscurls","Bizeps"],["Trizepsdrücken am Kabel","Trizeps"],["Wadenheben","Waden"],["Rückenstrecker","Unterer Rücken"]];
const presetGroups = g => Array.isArray(g)?g:[g];
function customGroups(){ return (cfg().groups||[]).filter(g=>typeof g==="string"&&g.trim()); }
function legacyUsed(){ const u=new Set(); for(const [,d] of S.docs) if(d&&d.kind==="exercise") for(const g of exGroups(d)) if(LEGACY_GROUPS.includes(g)) u.add(g); return [...u]; }
function allGroups(){ return [...GROUPS.filter(g=>g!=="Sonstiges"),...legacyUsed(),...customGroups(),"Sonstiges"]; }
// Ältere Übungen mit eindeutigem Namen genauer einordnen (z. B. „Latzug“: Rücken → Latissimus)
const GROUP_MIGRATE=[
  ["Arme",/unterarm|handgelenk|wrist|griffkraft|farmer/i,["Unterarme"]],
  ["Arme",/trizeps|triceps|dips|push.?down|pushdown|french|kickback|stirndr|skull/i,["Trizeps"]],
  ["Arme",/bizeps|biceps|curl|hammer/i,["Bizeps"]],
  ["Beine",/abdukt|abduction/i,["Abduktoren"]],
  ["Beine",/addukt|adduction/i,["Adduktoren"]],
  ["Beine",/beinstreck|leg.?ext|quadri/i,["Oberschenkel vorne"]],
  ["Beine",/beinbeug|leg.?curl|beincurl|hamstring/i,["Oberschenkel hinten"]],
  ["Beine",/wade|calf|calves/i,["Waden"]],
  ["Po",/abdukt|abduction/i,["Abduktoren"]],
  ["Po",/addukt|adduction/i,["Adduktoren"]],
  ["Rücken",/kreuzheb|deadlift/i,["Unterer Rücken","Po","Oberschenkel hinten"]],
  ["Rücken",/shrug|schulterheb|nacken|trapez/i,["Nacken & Trapez"]],
  ["Rücken",/hyperext|rückenstreck|back.?ext|superman/i,["Unterer Rücken"]],
  ["Rücken",/face.?pull|reverse.?(fly|butterfly)|butterfly.?reverse/i,["Hintere Schulter","Oberer Rücken"]],
  ["Rücken",/latzug|lat.?pull|pulldown|pull.?down|klimmz|pull.?up|chin.?up|pullover|latissimus|\blat\b/i,["Latissimus"]],
  ["Rücken",/rudern|row|rückenisolator|rhomb/i,["Oberer Rücken","Latissimus"]],
  ["Schultern",/shrug|schulterheb/i,["Nacken & Trapez"]],
  ["Schultern",/face.?pull|reverse|hintere|rear/i,["Hintere Schulter"]],
  ["Schultern",/seitheb|lateral|seitlich/i,["Seitliche Schulter"]],
  ["Schultern",/frontheb|front.?raise/i,["Vordere Schulter"]],
  ["Schultern",/schulterdr|schulterpress|overhead|military|arnold|shoulder.?press/i,["Vordere Schulter","Seitliche Schulter"]],
  ["Bauch",/seitlich|oblique|russian|twist|seitstütz|side.?plank|holzhack|woodchop/i,["Seitliche Bauchmuskeln"]]];
const GROUPS_V=3;
function migrateGroups(force){
  if(!force&&(cfg().groupsV||0)>=GROUPS_V) return 0;
  const out=[];
  for(const [id,d] of S.docs){ if(!d||d.kind!=="exercise") continue;
    const G=exGroups(d); let changed=false;
    const N=G.flatMap(g=>{ const m=GROUP_MIGRATE.find(([from,re])=>from===g&&re.test(d.name)); if(m){ changed=true; return m[2]; } return [g]; });
    if(changed){ const groups=[...new Set(N)]; out.push([id,{...d,group:groups[0],groups,updatedAt:Date.now()}]); } }
  if(out.length) putMany(out);
  if((cfg().groupsV||0)<GROUPS_V) saveCfg({groupsV:GROUPS_V});
  return out.length;
}
function exGroups(e){ const g=Array.isArray(e.groups)&&e.groups.length?e.groups:[e.group||"Sonstiges"]; return [...new Set(g)]; }
function groupsText(e){ return exGroups(e).join(" · "); }
const SETTING_SUGGEST = ["Sitzhöhe","Rückenlehne","Griff","Polster","Fußposition","Bank-Neigung","Kabelhöhe","Startposition"];
const LS_KEY = "gym-logbuch.v1";
const APP_VERSION = "3.7";
const DAY_TYPES = [{k:"push",n:"Push",a:"Pu"},{k:"pull",n:"Pull",a:"Pl"},{k:"beine",n:"Beine",a:"B"},{k:"oben",n:"Oberkörper",a:"OK"},{k:"unten",n:"Unterkörper",a:"UK"},{k:"ganz",n:"Ganzkörper",a:"GK"},{k:"cardio",n:"Cardio",a:"C"},{k:"sonst",n:"Sonstiges",a:"S"}];
DAY_TYPES.forEach(t=>t.c=t.k);
const COLOR_NAMES={push:"Blau",pull:"Orange",beine:"Türkis",oben:"Gelb",unten:"Rosa",ganz:"Grün",cardio:"Lila",sonst:"Rot"};
function cfg(){ const c=S.docs.get("cfg"); return c&&c.kind==="settings"?c:{kind:"settings"}; }
function saveCfg(patch){ put("cfg",{...cfg(),...patch,kind:"settings",updatedAt:Date.now()}); }
function customTypes(){ return (cfg().types||[]).filter(t=>t&&t.k&&t.n); }
function allTypes(){ return [...DAY_TYPES,...customTypes().map(t=>({k:t.k,n:t.n,a:t.a||abbr(t.n),c:COLOR_NAMES[t.c]?t.c:"sonst",custom:true}))]; }
const typeOf = k => k?allTypes().find(t=>t.k===k)||null:null;
function abbr(n){ const w=n.trim().split(/[\s&+\/,-]+/).filter(Boolean); if(w.length>1) return (w[0][0]+w[1][0]).toUpperCase(); const x=w[0]||"?"; return x.length<=2?x:x[0].toUpperCase()+x[1].toLowerCase(); }
const RANGES = [["4w","4 Wochen","Letzte 4 Wochen"],["3m","3 Monate","Letzte 3 Monate"],["6m","6 Monate","Letzte 6 Monate"],["12m","12 Monate","Letzte 12 Monate"],["all","Alles","Gesamter Zeitraum"]];
const TAB_TITLES = {today:"Training", exercises:"Übungen", history:"Verlauf", more:"Mehr"};

const ICON = {
  flame:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2.3 1.2-3.7 2.3-4.8.3 1.5 1 2.4 2 2.8-.6-2.8.2-5.6.7-8z"/></svg>',
  chev:'<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  body:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="4.5" r="2"/><path d="M6 8.5h12M12 8.5v6M12 14.5l-3 6.5M12 14.5l3 6.5M6 8.5l-1 5M18 8.5l1 5"/></svg>',
  copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>',
  grip:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2.5h5"/></svg>',
  doc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>',
  plusItem:'<svg class="plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/></svg>'
};

/* ---------- Zustand ---------- */
const S = {
  docs: new Map(),      // id -> Dokument
  ready: false,
  mode: "loading",      // local | memory
  tab: "today",
  stack: [],            // Unterseiten: {type:'log'|'exercise'|'editEx'|'pick', ...}
  draft: null,          // Logger-Entwurf
  exDraft: null,        // Übungs-Editor-Entwurf
  query: "",
  armedDelete: false,
  prog: {metric:"w", view:"chart", sel:null},
  cal: null,
  rep: null
};
let installPrompt = null; // Android: Installations-Dialog von Chrome
let waitingWorker = null; // neue App-Version wartet

/* ---------- Helfer ---------- */
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf = new Intl.NumberFormat("de-DE",{maximumFractionDigits:2});
const fmtLong = new Intl.DateTimeFormat("de-DE",{weekday:"long",day:"numeric",month:"long"});
const fmtShort = new Intl.DateTimeFormat("de-DE",{day:"2-digit",month:"2-digit"});
const fmtShortY = new Intl.DateTimeFormat("de-DE",{day:"2-digit",month:"2-digit",year:"2-digit"});
const fmtWeekday = new Intl.DateTimeFormat("de-DE",{weekday:"long"});
const sleep = ms => new Promise(r=>setTimeout(r,ms));
function pad(n){return String(n).padStart(2,"0")}
function todayStr(){const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function toDate(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function dayDiff(s){return Math.round((toDate(todayStr())-toDate(s))/86400000)}
function relDay(s){
  const d=dayDiff(s);
  if(d===0) return "Heute"; if(d===1) return "Gestern"; if(d===-1) return "Morgen";
  if(d>1 && d<7) return fmtWeekday.format(toDate(s));
  if(d<-1 && d>-7) return `In ${-d} Tagen`;
  return toDate(s).getFullYear()===new Date().getFullYear() ? fmtShort.format(toDate(s)) : fmtShortY.format(toDate(s));
}
function rid(p){return p+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function parseNum(v){ if(v==null) return null; const s=String(v).trim().replace(",","."); if(s==="") return null; const n=parseFloat(s); return isFinite(n)?n:null; }
function fmtNum(n){return n==null?"":nf.format(n)}
function inputVal(n){return n==null?"":String(n).replace(".",",")}
function e1rm(w,r){ if(!w||!r) return null; return r===1?w:w*(1+r/30); }
const LAYOUT_DEFAULT=["n","w","r","c"];
const BUILTIN_FIELDS={
  n:{t:"Satznummer",h:"Satz",kind:"n"},
  w:{t:"Gewicht",h:"kg",kind:"w"},
  r:{t:"Wiederholungen",h:"Wdh.",kind:"r"},
  c:{t:"Haken (abhaken)",h:"",kind:"c"},
  rpe:{t:"RPE (Anstrengung 1–10)",h:"RPE",kind:"x",type:"num",label:"RPE"},
  dur:{t:"Dauer",h:"Zeit",kind:"x",type:"time",label:"Dauer"},
  dist:{t:"Distanz",h:"km",kind:"x",type:"num",unit:"km",label:"Distanz"}
};
const FIELD_TYPES={num:"Zahl",text:"Text",time:"Zeit (m:ss)"};
function customFields(){ return (cfg().fields||[]).filter(f=>f&&f.k&&f.n); }
function fieldDef(k){ if(BUILTIN_FIELDS[k]) return {k,...BUILTIN_FIELDS[k]}; const c=customFields().find(f=>f.k===k); return c?{k,t:c.n,h:c.n,kind:"x",type:c.type||"num",unit:c.unit||"",label:c.n,custom:true}:null; }
function allFieldKeys(){ return [...Object.keys(BUILTIN_FIELDS),...customFields().map(f=>f.k)]; }
function layoutOrder(){
  const l=cfg().layout;
  if(!Array.isArray(l)) return LAYOUT_DEFAULT;
  const ok=[...new Set(l)].filter(k=>fieldDef(k));
  return ok.some(k=>{const d=fieldDef(k); return d.kind==="w"||d.kind==="r"||d.kind==="x";})?ok:LAYOUT_DEFAULT;
}
function extraKeys(){ return layoutOrder().filter(k=>fieldDef(k).kind==="x"); }
function repsFirst(){ const l=layoutOrder(), a=l.indexOf("r"), b=l.indexOf("w"); return a>=0&&b>=0&&a<b; }
function fieldCol(k){ const d=fieldDef(k); return d.kind==="n"?"2.2rem":d.kind==="c"?"3.1rem":"minmax(0,1fr)"; }
function layoutCols(){ return layoutOrder().map(fieldCol).join(" "); }
function inputCount(){ return layoutOrder().filter(k=>{const d=fieldDef(k); return d.kind!=="n"&&d.kind!=="c";}).length; }
function fmtX(d,v){ if(v==null||v==="") return ""; return d.type==="num"?fmtNum(v):String(v); }
function extraText(s){
  if(!s.x) return "";
  const L=layoutOrder(), pos=k=>{const i=L.indexOf(k); return i<0?99:i;};
  return Object.entries(s.x).sort((a,b)=>pos(a[0])-pos(b[0])).map(([k,v])=>{ const d=fieldDef(k); if(!d||v==null||v==="") return ""; const val=fmtX(d,v); return d.unit?`${val} ${d.unit}`:`${d.label||d.t} ${val}`; }).filter(Boolean).join(" · ");
}
function normTime(v){ const t=String(v).trim().replace(",",":").replace(".",":"); if(!t) return ""; if(/^\d+$/.test(t)){ const n=+t; return n>=60?Math.floor(n/60)+":"+pad(n%60):"0:"+pad(n); } const m=t.match(/^(\d+):(\d{1,2})$/); return m?(+m[1])+":"+pad(Math.min(59,+m[2])):t; }
function parseX(d,v){ if(v==null) return null; const t=String(v).trim(); if(!t) return null; if(d.type==="num") return parseNum(t); if(d.type==="time") return normTime(t); return t.slice(0,40); }
/* ---------- Gegengewicht (z. B. Klimmzug-Turm) ----------
   Bei solchen Übungen wird das am Gerät eingestellte Gegengewicht gespeichert.
   Das echte Trainingsgewicht = Körpergewicht an dem Tag minus Gegengewicht. */
const asA = a => a&&typeof a==="object"?a:null;
function isAssist(e){ return !!(e&&e.load==="assist"); }
function bwOn(date){ const L=weightEntries(); if(!L.length) return null; let b=null; for(const e of L){ if(e.date<=date) b=e; else break; } return (b||L[0]).w; }
function assistCtx(l){ const e=l&&ex(l.exId); return isAssist(e)?{bw:bwOn(l.date)}:null; }
function effW(w,a){ a=asA(a); if(w==null||!a) return w; if(a.bw==null) return null; return Math.max(0,Math.round((a.bw-w)*10)/10); }
/* ---------- eGym-Geräte ----------
   Kalorien kommen aus der eGym-App und werden von Hand eingetragen.
   Gewicht und Wiederholungen dieser Übungen zählen deshalb nicht zusätzlich zur Kalorienschätzung. */
function isEgym(e){ return !!(e&&e.egym); }
function egymKcal(l){ return l&&l.kcal>0?l.kcal:0; }
function logLine(l){ return setsLine(l.sets||[],assistCtx(l))+(egymKcal(l)?`<div class="meta num">${fmtNum(l.kcal)} kcal laut eGym-App</div>`:""); }
function trainSplit(date,S0){
  S0=S0||daySummary(date);
  const TM=trainingMinutes(date,S0), met=metFor(S0,TM);
  const eg=S0.ls.filter(l=>isEgym(ex(l.exId)));
  const egK=eg.reduce((a,l)=>a+egymKcal(l),0), egSets=eg.reduce((a,l)=>a+(l.sets||[]).length,0);
  // Zeit nur für die übrigen Übungen schätzen (anteilig nach Sätzen), damit eGym nicht doppelt zählt
  const restMin=!eg.length?TM.min:eg.length===S0.ls.length?0:S0.sets?Math.round(TM.min*(S0.sets-egSets)/S0.sets):TM.min;
  return {TM,met,eg,egK,restMin};
}
function statSets(l){ const a=assistCtx(l), s=l.sets||[]; return a?s.map(x=>({...x,w:effW(x.w,a)})):s; }
function setText(s,a){
  a=asA(a);
  const ex=extraText(s), xt=ex?`<span class="xt"> · ${esc(ex)}</span>`:"";
  const ew=a&&s.w!=null?effW(s.w,a):null, et=ew!=null?`<span class="xt"> → ${fmtNum(ew)} kg</span>`:"";
  if(s.w==null&&s.r==null) return ex?esc(ex):"";
  return setCore(s,a)+et+xt;
}
function setCore(s,a){
  const wt=asA(a)&&s.w!=null?"−"+fmtNum(s.w):fmtNum(s.w);
  if(s.w!=null && s.r!=null) return repsFirst()?`${s.r}<span class="x"> × </span>${wt} kg`:`${wt}<span class="x"> × </span>${s.r}`;
  if(s.w!=null) return `${wt} kg`;
  if(s.r!=null) return `${s.r} Wdh.`;
  return "";
}
function setPlain(s,a){ return setText(s,a).replace(/<[^>]+>/g,"").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&#39;/g,"'"); }
function setsLine(sets,a){ return `<div class="sets-line">${sets.map(s=>`<span>${setText(s,a)}</span>`).join("")}</div>`; }
function volume(sets){ return sets.reduce((a,s)=>a+((s.w||0)*(s.r||0)),0); }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),2200); }

/* ---------- Datenzugriff ---------- */
function exercises(){ const out=[]; for(const [id,d] of S.docs) if(d&&d.kind==="exercise") out.push({id,...d}); return out.sort((a,b)=>a.name.localeCompare(b.name,"de")); }
function logs(){ const out=[]; for(const [id,d] of S.docs) if(d&&d.kind==="log") out.push({id,...d}); return out; }
function ex(id){ const d=S.docs.get(id); return d&&d.kind==="exercise"?{id,...d}:null; }
function logsFor(exId){ return logs().filter(l=>l.exId===exId).sort((a,b)=>b.date.localeCompare(a.date)); }
function logId(date,exId){ return "lg_"+date+"_"+exId; }
function lastBefore(exId,date){ return logsFor(exId).find(l=>l.date<date) || null; }
function maxW(sets){ let m=null; for(const s of sets) if(s.w!=null && (m==null||s.w>m)) m=s.w; return m; }
function isPR(log){
  const mine=maxW(statSets(log)); if(mine==null) return false;
  const earlier=logsFor(log.exId).filter(l=>l.date<log.date);
  const prev=earlier.reduce((m,l)=>{const x=maxW(statSets(l));return x!=null&&(m==null||x>m)?x:m;},null);
  return prev!=null && mine>prev;
}
function lastUsed(exId){ const l=logsFor(exId)[0]; return l?l.date:null; }

/* ---------- Speicher ---------- */
function readLocal(){ try{ const raw=localStorage.getItem(LS_KEY); return raw?JSON.parse(raw):null; }catch(e){ return undefined; } }
function writeLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify({v:1,docs:Object.fromEntries(S.docs)})); return true; }catch(e){ return false; } }

let localTimer=null;
function setSync(state){
  const el=$("#sync");
  const labels={local:"Gespeichert",saving:"Speichert…",memory:"Nicht gespeichert",error:"Fehler beim Speichern",loading:"Lädt…"};
  el.dataset.s=state==="saving"?"saving":state; el.textContent=labels[state]||"";
}
function persistLocal(){
  clearTimeout(localTimer);
  if(S.mode!=="local") return;
  setSync("saving");
  localTimer=setTimeout(()=>{
    if(writeLocal()) setSync("local");
    else { S.mode="memory"; setSync("memory"); toast("Speichern auf diesem Gerät nicht möglich – mach ein Backup"); }
  },250);
}
function put(id,body){
  if(body===null) S.docs.delete(id); else S.docs.set(id,body);
  persistLocal();
}
async function putMany(entries){
  for(const [id,body] of entries) S.docs.set(id,body);
  persistLocal();
}

async function init(){
  const local=readLocal();
  if(local===undefined){ S.mode="memory"; setSync("memory"); }
  else { S.mode="local"; setSync("local"); if(local&&local.docs) for(const [id,d] of Object.entries(local.docs)) S.docs.set(id,d); }
  if(S.mode!=="memory"||S.docs.size) migrateGroups(false);
  S.ready=true; render();
  // Browser bitten, die Daten nicht automatisch zu löschen
  try{ if(navigator.storage&&navigator.storage.persist) S.persisted=await navigator.storage.persist(); }catch(e){}
}

/* ---------- Navigation ---------- */
function top(){ return S.stack[S.stack.length-1]||null; }
function push(screen){ leaveCurrent(); S.stack.push(screen); enter(screen); render(); window.scrollTo(0,0); }
function replace(screen){ leaveCurrent(); S.stack.pop(); S.stack.push(screen); enter(screen); render(); window.scrollTo(0,0); }
function pop(){ leaveCurrent(); S.stack.pop(); const t=top(); if(t) enter(t); render(); }
function setTab(tab){ leaveCurrent(); S.stack=[]; S.planOpen=false; S.typeForm=null; S.tab=tab; S.query=""; render(); window.scrollTo(0,0); }
function enter(screen){
  S.armedDelete=false;
  if(screen.type==="log") openDraft(screen.exId,screen.date);
  if(screen.type==="editEx"){ openExDraft(screen.exId); if(screen.egym) S.exDraft.egym=true; }
  if(screen.type==="pick"||screen.type==="planPick") S.query="";
  if(screen.type==="day") S.typeForm=null;
  if(screen.type==="exercise") S.prog.sel=null;
  if(screen.type==="report") S.rep={range:"3m",exIds:screen.exId?new Set([screen.exId]):null,chart:true,table:true,result:null,busy:false};
}
function leaveCurrent(){ const t=top(); if(t&&t.type==="log") saveDraft(true); }

/* ---------- Logger-Entwurf ---------- */
let draftTimer=null;
function openDraft(exId,date){
  const existing=S.docs.get(logId(date,exId));
  const last=lastBefore(exId,date);
  let sets;
  const xin=x=>{ const o={}; if(x) for(const [k,v] of Object.entries(x)){ const d=fieldDef(k); o[k]=v==null?"":d&&d.type==="num"?inputVal(v):String(v); } return o; };
  if(existing&&existing.sets&&existing.sets.length) sets=existing.sets.map(s=>({w:inputVal(s.w),r:s.r==null?"":String(s.r),x:xin(s.x)}));
  else { const tg=planTarget(date,exId); sets=Array.from({length:Math.max(tg&&tg.sets&&tg.sets.length?tg.sets.length:tg&&tg.s?tg.s:last&&last.sets?last.sets.length:3,1)},()=>({w:"",r:"",x:{}})); }
  S.draft={exId,date,sets,note:existing&&existing.note?existing.note:"",kcal:existing&&existing.kcal?String(existing.kcal):"",existed:!!existing};
}
function assistLive(){
  const d=S.draft; if(!d) return ""; const bw=bwOn(d.date); if(bw==null) return "";
  const g=ghosts(), vals=d.sets.map((s,i)=>{ const w=parseNum(s.w)??(g[i]?g[i].w:null); return w==null?null:effW(w,{bw}); }).filter(v=>v!=null);
  return vals.length?`Dein Trainingsgewicht: <b>${vals.map(fmtNum).join(" · ")} kg</b>`:"";
}
function ghosts(){
  const d=S.draft, last=lastBefore(d.exId,d.date), lastSets=last?last.sets:[], tg=planTarget(d.date,d.exId);
  const out=[]; let prev=null;
  const XK=extraKeys();
  d.sets.forEach((s,i)=>{
    const own={w:parseNum(s.w),r:parseNum(s.r),x:{}};
    for(const k of XK){ const v=parseX(fieldDef(k),s.x&&s.x[k]); if(v!=null&&v!=="") own.x[k]=v; }
    let g=lastSets[i]||prev||(lastSets.length?lastSets[lastSets.length-1]:null);
    if(tg&&tg.sets&&tg.sets.length){ const ts=tg.sets[Math.min(i,tg.sets.length-1)]; if(!(prev&&prev.own&&i>=tg.sets.length)) g={w:ts.w??null,r:ts.r??null,x:{...(ts.x||{})}}; }
    else if(tg&&(tg.w!=null||tg.r!=null)&&!(prev&&prev.own)) g={w:tg.w??(g?g.w:null),r:tg.r??(g?g.r:null),x:g&&g.x||{}};
    out.push(g?{w:g.w,r:g.r,x:{...(g.x||{})}}:{w:null,r:null,x:{}});
    const hasOwn=own.w!=null||own.r!=null||Object.keys(own.x).length;
    prev=hasOwn?{w:own.w??(g?g.w:null),r:own.r??(g?g.r:null),x:{...(g&&g.x||{}),...own.x},own:true}:(g||prev);
  });
  return out;
}
function draftSets(){
  return S.draft.sets.map(s=>{
    const o={w:parseNum(s.w),r:parseNum(s.r)}; if(o.r!=null) o.r=Math.round(o.r);
    const x={}; for(const [k,v] of Object.entries(s.x||{})){ const d=fieldDef(k); if(!d) continue; const pv=parseX(d,v); if(pv!=null&&pv!=="") x[k]=pv; }
    if(Object.keys(x).length) o.x=x; return o;
  }).filter(s=>s.w!=null||s.r!=null||s.x);
}
function rowFilled(s){ return parseNum(s.w)!=null||parseNum(s.r)!=null||Object.values(s.x||{}).some(v=>String(v??"").trim()!==""); }
function scheduleSave(){ clearTimeout(draftTimer); draftTimer=setTimeout(()=>saveDraft(false),700); }
function saveDraft(final){
  clearTimeout(draftTimer);
  const d=S.draft; if(!d) return;
  const id=logId(d.date,d.exId), sets=draftSets(), note=d.note.trim();
  const kv=parseNum(d.kcal), kcal=kv!=null&&kv>0?Math.round(kv):null;
  const cur=S.docs.get(id);
  if(!sets.length&&!note&&!kcal){ if(cur){ put(id,null); d.existed=false; } return; }
  const body={kind:"log",exId:d.exId,date:d.date,sets,note,createdAt:(cur&&(cur.createdAt||cur.updatedAt))||Date.now(),updatedAt:Date.now()};
  if(kcal) body.kcal=kcal;
  if(cur&&JSON.stringify({s:cur.sets,n:cur.note||"",k:cur.kcal||null})===JSON.stringify({s:sets,n:note,k:kcal})) return;
  put(id,body); d.existed=true;
}

/* ---------- Übungs-Editor ---------- */
function openExDraft(exId){
  const e=exId?ex(exId):null;
  S.exDraft=e?{id:e.id,name:e.name,groups:exGroups(e),settings:(e.settings||[]).map(s=>({k:s.k,v:s.v})),notes:e.notes||"",rest:e.rest,load:e.load||"",egym:!!e.egym}
            :{id:null,name:"",groups:[],settings:[],notes:"",load:"",egym:false};

function createExercise(name,group,settings,notes,load,egym){
  const id=rid("ex"); const now=Date.now();

/* ---------- Rendering ---------- */
function renderFromData(){
  const t=top();
  // Formulare nicht neu zeichnen, während getippt wird
  if(t&&(t.type==="log"||t.type==="editEx")) return;
  render();
}
function render(){
  if(!S.ready) return;
  const t=top();
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===S.tab?"page":"false"));
  $("#back").hidden=!t; $("#bar").classList.toggle("sub",!!t);
  let html="", title=TAB_TITLES[S.tab];
  if(t){
    if(t.type==="log"){ const e=ex(t.exId); title=e?e.name:"Übung"; html=viewLog(); }
    else if(t.type==="exercise"){ const e=ex(t.exId); title=e?e.name:"Übung"; html=viewExercise(t.exId); }
    else if(t.type==="editEx"){ title=S.exDraft.id?"Übung bearbeiten":S.exDraft.egym?"Neues eGym-Gerät":"Neue Übung"; html=viewEditEx(); }
    else if(t.type==="pick"){ title=t.date&&t.date!==todayStr()?"Nachtragen":"Übung wählen"; html=viewPick(); }
    else if(t.type==="report"){ title="Bericht"; html=viewReport(); }
    else if(t.type==="planPick"){ title="Übungen planen"; html=viewPlanPick(t.date); }
    else if(t.type==="applyPick"){ title="Einheit übernehmen"; html=viewApplyPick(t.date); }
    else if(t.type==="finish"){ title=dayDoc(t.date)&&dayDoc(t.date).done?"Geschafft":"Übersicht"; html=viewFinish(t.date); }
    else if(t.type==="act"){ title="Aktivität"; html=viewAct(t.date); }
    else if(t.type==="day"){ title=dayDiff(t.date)<2?relDay(t.date):fmtShortY.format(toDate(t.date)); html=viewDay(t.date); }
  } else {
    html={today:viewToday,exercises:viewExercises,history:viewHistory,more:viewMore}[S.tab]();
  }
  $("#ttl").textContent=title;
  const upd=waitingWorker&&!(t&&(t.type==="log"||t.type==="editEx"))?`<div class="update-bar"><span>Neue Version verfügbar</span><button class="btn primary" data-act="update">Aktualisieren</button></div>`:"";
  $("#main").innerHTML=`<div class="wrap">${upd}${html}</div>`;
  if(t&&t.type==="finish") mountAnatomy(t.date);

}

function viewToday(){

  h+=dailyCard(date);

    const vol=today.reduce((a,l)=>a+volume(statSets(l)),0);

    h+=`<p class="meta num">${today.length} ${today.length===1?"Übung":"Übungen"} · ${setCount} ${setCount===1?"Satz":"Sätze"}${vol?` · ${fmtNum(Math.round(vol))} kg Volumen`:""}</p>`;
    h+=`<div class="stack${today.length>1?" sortable":""}" data-sort="day" data-date="${date}">${today.map(l=>{const e=ex(l.exId); if(!e) return "";

        <div class="top"><h3>${esc(e.name)}</h3>${isPR(l)?'<span class="pr">Rekord</span>':""}</div>

      </button>`;}).join("")}</div>`;
  }
  const doneAt=dayDoc(date)&&dayDoc(date).done;
  if(doneAt){
    h+=`<div class="card done-card"><span class="ic">${ICON.check}</span><div style="flex:1;min-width:0"><b>Training beendet</b><div class="meta">um ${new Date(doneAt).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})} Uhr</div></div><button class="btn" data-act="finishView" data-date="${date}">Übersicht</button></div>
    <div class="btn-row"><button class="btn" data-act="pick">${ICON.plus}Noch etwas eintragen</button><button class="btn" data-act="unfinish" data-date="${date}">Rückgängig</button></div>`;
  } else {

    if(today.length) h+=`<button class="btn success big" data-act="finish" data-date="${date}">${ICON.check}Training beenden</button>`;
  }
  const np=nextPlanned();
  if(np){ const n=planItems(np.date).length;
    h+=`<button class="plan-next" data-act="day" data-date="${np.date}"><div class="grow" style="flex:1;min-width:0"><p class="eyebrow">Als Nächstes geplant</p><div class="name" style="font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap">${esc(relDay(np.date))}, ${esc(fmtShort.format(toDate(np.date)))} ${typeBadge(np.date)}</div>${n?`<div class="meta">${n} ${n===1?"Übung":"Übungen"} eingeplant</div>`:""}</div>${ICON.chev}</button>`; }

function exerciseList(list,act,sel){
  const q=S.query.trim().toLowerCase();
  const filtered=list.filter(e=>!q||e.name.toLowerCase().includes(q)||exGroups(e).some(g=>g.toLowerCase().includes(q)));
  if(!filtered.length) return `<p class="hint">Keine Übung gefunden${q?` für „${esc(S.query)}“`:""}.</p>`;
  const byGroup=new Map();
  for(const e of filtered) for(const g of exGroups(e)){ if(!byGroup.has(g)) byGroup.set(g,[]); byGroup.get(g).push(e); }
  const ag=allGroups(), order=[...ag,...[...byGroup.keys()].filter(g=>!ag.includes(g))];
  const groups=order.filter(g=>byGroup.has(g)).map(g=>[g,byGroup.get(g)]);
  if(!q&&list.length>5&&act!=="openEx") groups.unshift(["Zuletzt verwendet oder angelegt",[...list].sort((a,b)=>recency(b)-recency(a)).slice(0,5)]);
  return groups.map(([g,items])=>`<div class="group"><h3>${esc(g)}</h3><div class="list">${items.map(e=>{
    const l=logsFor(e.id)[0];
    const sub=l?`${relDay(l.date)} · ${(l.sets||[]).map(s=>setPlain(s,assistCtx(l))).join(", ")}`:"Noch nicht trainiert";
    const set=[e.egym?"eGym-Gerät":"",...(e.settings||[]).filter(s=>s.k&&s.v).map(s=>`${s.k} ${s.v}`)].filter(Boolean).join(" · ");
    const also=exGroups(e).filter(x=>x!==g);
    return `<button class="item" data-act="${act}" data-ex="${esc(e.id)}"${act==="planToggle"?` aria-pressed="${!!(sel&&sel.has(e.id))}"`:""}><div class="grow"><div class="name">${esc(e.name)}</div><div class="sub num">${esc(sub)}</div>${also.length?`<div class="sub">${allGroups().includes(g)?"Auch: ":""}${esc(also.join(" · "))}</div>`:""}${set?`<div class="sub">${esc(set)}</div>`:""}</div>${act==="planToggle"?(sel&&sel.has(e.id)?ICON.check.replace("<svg","<svg class=\"chk-on\""):ICON.plusItem):act==="pickEx"?ICON.plusItem:ICON.chev}</button>`;}).join("")}</div></div>`).join("");
}
function recency(e){ const l=lastUsed(e.id); return Math.max(l?toDate(l).getTime()+86399999:0,e.createdAt||0); }
function searchBox(){ return `<label class="search">${ICON.search}<input class="input" id="q" data-field="query" type="search" placeholder="Übung suchen" value="${esc(S.query)}" autocomplete="off"></label>`; }

function viewPick(){

function niceStep(range,count){ const raw=range/Math.max(1,count), mag=Math.pow(10,Math.floor(Math.log10(raw))), n=raw/mag; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*mag; }
function chartSvg(points,unit,label,sel){
  // points: [{date, v}] chronologisch
  const W=320,H=150,L=38,R=16,T=26,B=22;
  const vs=points.map(p=>p.v); let lo=Math.min(...vs), hi=Math.max(...vs);
  if(hi===lo){ hi+=unit==="kg"?5:2; lo=Math.max(0,lo-(unit==="kg"?5:2)); }
  if(unit!=="kg"&&hi-lo<3){ hi=Math.ceil(hi+1); lo=Math.max(0,Math.floor(lo-1)); }
  const step=unit==="kg"?niceStep(hi-lo,3):Math.max(1,Math.round(niceStep(hi-lo,3))); lo=Math.max(0,Math.floor(lo/step)*step); hi=Math.ceil(hi/step)*step;
  const x=i=>L+(points.length===1?(W-L-R)/2:(i*(W-L-R)/(points.length-1)));
  const y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  const pts=points.map((p,i)=>[x(i),y(p.v)]);
  const line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area=line+` L${pts[pts.length-1][0].toFixed(1)} ${H-B} L${pts[0][0].toFixed(1)} ${H-B} Z`;
  const ticks=[]; for(let v=lo; v<=hi+1e-9; v+=step) ticks.push(v);
  const si=sel!=null&&sel<points.length?sel:points.length-1;
  const sp=pts[si], sv=points[si];
  const tipText=`${fmtShort.format(toDate(sv.date))}  ${fmtNum(Math.round(sv.v*10)/10)}${unit?" "+unit:""}`;
  const tipW=tipText.length*6.2+14, tipX=Math.min(Math.max(sp[0]-tipW/2,L),W-R-tipW), tipY=Math.max(0,sp[1]-30);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}: Verlauf über ${points.length} Einheiten">
    ${ticks.map(t=>`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}"/><text x="${L-6}" y="${(y(t)+3).toFixed(1)}" text-anchor="end">${fmtNum(t)}</text>`).join("")}
    <path class="area" d="${area}"/><path class="line" d="${line}"/>
    ${pts.map((p,i)=>i===si?"":`<circle class="dot" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3"/>`).join("")}
    <circle class="sel" cx="${sp[0].toFixed(1)}" cy="${sp[1].toFixed(1)}" r="5.5"/>
    <rect class="tipbg" x="${tipX.toFixed(1)}" y="${tipY.toFixed(1)}" width="${tipW.toFixed(1)}" height="20" rx="6"/>
    <text class="tip" x="${(tipX+tipW/2).toFixed(1)}" y="${(tipY+14).toFixed(1)}" text-anchor="middle">${tipText}</text>
    <text x="${L}" y="${H-6}" text-anchor="start">${fmtShort.format(toDate(points[0].date))}</text>
    ${points.length>1?`<text x="${W-R}" y="${H-6}" text-anchor="end">${fmtShort.format(toDate(points[points.length-1].date))}</text>`:""}
    ${pts.map((p,i)=>`<circle class="hit" data-act="pt" data-i="${i}" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${Math.max(10,Math.min(18,(W-L-R)/Math.max(1,points.length-1)/2)).toFixed(1)}"><title>${fmtShort.format(toDate(points[i].date))}: ${fmtNum(Math.round(points[i].v*10)/10)} ${unit}</title></circle>`).join("")}
  </svg>`;
}
function logStats(l){
  const sets=statSets(l); let e=null, r=null;
  for(const s of sets){ const x=e1rm(s.w,s.r); if(x!=null&&(e==null||x>e)) e=x; if(s.r!=null&&(r==null||s.r>r)) r=s.r; }
  return {best:maxW(sets), e1rm:e, reps:r, volume:volume(sets)};
}
const METRICS={w:["Bestes Gewicht","kg","best"],e:["Geschätztes 1RM","kg","e1rm"],v:["Volumen","kg","volume"],r:["Beste Wiederholungen","Wdh.","reps"]};
function progressCard(hist){
  const hasW=hist.some(l=>maxW(statSets(l))!=null);
  const P=S.prog; const metric=hasW?(P.metric==="r"?"w":P.metric):"r";
  const [label,unit,key]=METRICS[metric];
  const chrono=hist.slice(0,20).reverse().map(l=>({date:l.date,...logStats(l)}));
  const pts=chrono.filter(r=>r[key]!=null&&r[key]!==0).map(r=>({date:r.date,v:r[key]}));
  let h=`<div class="card chart"><div class="chart-top"><p class="eyebrow">Fortschritt</p>
    <div class="seg" role="group" aria-label="Ansicht"><button data-act="progView" data-v="chart" aria-pressed="${P.view==="chart"}">Grafik</button><button data-act="progView" data-v="table" aria-pressed="${P.view==="table"}">Tabelle</button></div></div>`;
  if(P.view==="chart"){
    if(hasW) h+=`<div class="chips small" style="margin-bottom:8px">${["w","e","v"].map(m=>`<button class="chip" data-act="progMetric" data-m="${m}" aria-pressed="${metric===m}">${METRICS[m][0]}</button>`).join("")}</div>`;
    if(pts.length>=2) h+=chartSvg(pts,unit,label,P.sel)+`<p class="hint" style="margin-top:4px">Tipp auf einen Punkt, um den Wert zu sehen.</p>`;
    else h+=`<p class="hint">Ab der zweiten Einheit siehst du hier deinen Fortschritt als Kurve.</p>`;
  } else {
    const rows=hist.slice(0,60).map(l=>({date:l.date,...logStats(l)}));
    h+=`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Datum</th>${hasW?`<th>Bestes Gew.</th><th>1RM</th><th>Volumen</th>`:`<th>Beste Wdh.</th>`}</tr></thead><tbody>${rows.map(r=>`<tr><td>${fmtShortY.format(toDate(r.date))}</td>${hasW?`<td class="b">${r.best!=null?fmtNum(r.best)+" kg":"–"}</td><td>${r.e1rm!=null?fmtNum(Math.round(r.e1rm))+" kg":"–"}</td><td>${r.volume?fmtNum(Math.round(r.volume))+" kg":"–"}</td>`:`<td class="b">${r.reps??"–"}</td>`}</tr>`).join("")}</tbody></table></div>`;
  }
  return h+`</div>`;
}

function viewExercise(exId){
  const e=ex(exId);
  if(!e) return `<p class="hint">Diese Übung wurde gelöscht.</p>`;
  const hist=logsFor(exId);

  const bestE=hist.reduce((m,l)=>{for(const s of statSets(l)){const v=e1rm(s.w,s.r); if(v!=null&&(m==null||v>m)) m=v;} return m;},null);
  let h=`<div class="ex-head"><p class="eyebrow">${esc(groupsText(e))}</p>${settingsDl(e)}${e.notes?`<p class="muted" style="margin:0">${esc(e.notes)}</p>`:""}</div>
  <div class="btn-row"><button class="btn primary" data-act="openLog" data-ex="${esc(e.id)}" data-date="${todayStr()}">${ICON.plus}Heute eintragen</button><button class="btn" data-act="editEx" data-ex="${esc(e.id)}">Bearbeiten</button></div>
  <div class="stats">
    <div class="card stat"><b>${best!=null?fmtNum(best):"–"}</b><span>Bestes Gewicht (kg)</span></div>
    <div class="card stat"><b>${bestE!=null?fmtNum(Math.round(bestE)):"–"}</b><span>Geschätztes 1RM (kg)</span></div>
    <div class="card stat"><b>${hist.length}</b><span>Einheiten</span></div>
  </div>`;
  if(hist.length){
    h+=progressCard(hist);
    h+=`<button class="btn" data-act="report" data-ex="${esc(e.id)}">${ICON.doc}Fortschritt als PDF</button>`;
    h+=`<div class="group"><h3>Alle Einheiten</h3><div class="list hist">${hist.map(l=>`<button class="item" data-act="openLog" data-ex="${esc(e.id)}" data-date="${l.date}">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline"><span class="name">${relDay(l.date)}</span>${isPR(l)?'<span class="pr">Rekord</span>':`<span class="meta num">${volume(statSets(l))?fmtNum(Math.round(volume(statSets(l))))+" kg":""}</span>`}</div>
      ${logLine(l)}${l.note?`<div class="meta">${esc(l.note)}</div>`:""}</button>`).join("")}</div></div>`;
  } else h+=`<p class="hint">Noch keine Einheit eingetragen.</p>`;
  return h;
}

/* ---------- PDF-Bericht ---------- */
function rangeFrom(range){
  const d=toDate(todayStr());
  if(range==="4w") d.setDate(d.getDate()-27);
  else if(range==="3m") d.setMonth(d.getMonth()-3);
  else if(range==="6m") d.setMonth(d.getMonth()-6);
  else if(range==="12m") d.setFullYear(d.getFullYear()-1);
  else { const all=logs().map(l=>l.date).sort(); return all[0]||todayStr(); }
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
}
function reportSelection(){
  const R=S.rep, from=rangeFrom(R.range), to=todayStr();
  const exs=exercises().filter(e=>!R.exIds||R.exIds.has(e.id));
  const order=e=>{const i=allGroups().indexOf(exGroups(e)[0]);return i<0?99:i;};
  exs.sort((a,b)=>order(a)-order(b)||a.name.localeCompare(b.name,"de"));
  const items=exs.map(e=>({e,logs:logsFor(e.id).filter(l=>l.date>=from&&l.date<=to).reverse()})).filter(x=>x.logs.length);
  return {from,to,items};
}
function viewReport(){
  const R=S.rep;
  const withLogs=exercises().filter(e=>logsFor(e.id).length);
  const sel=reportSelection();
  const sessions=sel.items.reduce((a,x)=>a+x.logs.length,0);
  let h=`<p class="muted" style="margin:0">Erstellt eine PDF mit Kurve und Tabelle pro Übung. Die Datei kannst du speichern, ausdrucken oder z. B. deinem Trainer schicken.</p>
  <div class="field"><span>Zeitraum</span><div class="chips">${RANGES.map(([k,l])=>`<button class="chip" data-act="repRange" data-k="${k}" aria-pressed="${R.range===k}">${l}</button>`).join("")}</div></div>
  <div class="field"><span>Übungen</span><div class="chips"><button class="chip" data-act="repAll" aria-pressed="${!R.exIds}">Alle</button>${withLogs.map(e=>`<button class="chip" data-act="repEx" data-ex="${esc(e.id)}" aria-pressed="${!!R.exIds&&R.exIds.has(e.id)}">${esc(e.name)}</button>`).join("")}</div></div>
  <div class="field"><span>Inhalt</span><div class="chips"><button class="chip" data-act="repPart" data-k="chart" aria-pressed="${R.chart}">Grafik</button><button class="chip" data-act="repPart" data-k="table" aria-pressed="${R.table}">Tabelle</button></div></div>
  <p class="meta num">${sel.items.length} ${sel.items.length===1?"Übung":"Übungen"} · ${sessions} ${sessions===1?"Einheit":"Einheiten"} · ${fmtShortY.format(toDate(sel.from))} – ${fmtShortY.format(toDate(sel.to))}</p>`;
  if(R.result) h+=`<div class="card result"><div class="status"><i></i>${esc(R.result.name)}</div><p class="muted" style="margin:0">Die PDF wurde gespeichert. Auf dem Handy findest du sie in „Downloads“ bzw. „Eigene Dateien“.</p>
    <div class="btn-row"><button class="btn" data-act="repSave">Nochmal speichern</button>${R.result.canShare?`<button class="btn" data-act="repShare">Teilen</button>`:""}</div></div>`;
  h+=`<button class="btn primary big" data-act="repMake" ${sel.items.length?"":"disabled"}>${ICON.doc}${R.busy?"Wird erstellt…":"PDF erstellen"}</button>`;
  if(!sel.items.length) h+=`<p class="hint">Im gewählten Zeitraum gibt es keine Einträge. Wähle einen längeren Zeitraum.</p>`;
  return h;
}
function setsPlain(sets,hasW,a){ return sets.map(s=>{ const ex=extraText(s), ew=asA(a)&&s.w!=null?effW(s.w,a):null; return setsPlainCore(s,hasW,a)+(ew!=null?` -> ${fmtNum(ew)} kg`:"")+(ex?(s.w!=null||s.r!=null?` (${ex})`:ex):""); }).join(", "); }
function setsPlainCore(s,hasW,a){ const wt=asA(a)&&s.w!=null?"-"+fmtNum(s.w):fmtNum(s.w); if(s.w!=null&&s.r!=null) return repsFirst()?`${s.r} × ${wt} kg`:`${wt} × ${s.r}`; if(s.w!=null) return `${wt} kg`; if(s.r!=null) return hasW?`${s.r} Wdh.`:`${s.r}`; return ""; }
function slug(s){ return s.toLowerCase().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""); }
function makeReport(){
  const R=S.rep, sel=reportSelection(), rl=RANGES.find(r=>r[0]===R.range)[2];
  const dates=new Set(); let setsN=0, vol=0, sessions=0;
  const exercisesModel=sel.items.map(({e,logs:ls})=>{
    for(const l of ls){ dates.add(l.date); setsN+=(l.sets||[]).length; vol+=volume(statSets(l)); sessions++; }
    return {name:e.name, group:groupsText(e), settingsLine:(e.settings||[]).filter(s=>s.k||s.v).map(s=>`${s.k} ${s.v}`.trim()).join(" · "),
      rows:ls.map(l=>({date:l.date, setsText:setsPlain(l.sets||[],ls.some(x=>maxW(statSets(x))!=null),assistCtx(l)), ...logStats(l)}))};
  });
  const bytes=window.GymReport.build({title:"Fortschrittsbericht",rangeLabel:rl,fromDate:sel.from,toDate:sel.to,created:todayStr(),
    includeChart:R.chart,includeTable:R.table,repsFirst:repsFirst(),summary:{days:dates.size,sessions,sets:setsN,volume:Math.round(vol)},exercises:exercisesModel});
  const name=`gym-logbuch-${sel.items.length===1?slug(sel.items[0].e.name)+"-":""}fortschritt-${todayStr()}.pdf`;
  const blob=new Blob([bytes],{type:"application/pdf"});
  let canShare=false; try{ canShare=!!(navigator.canShare&&navigator.canShare({files:[new File([blob],name,{type:"application/pdf"})]})); }catch(e){}
  return {blob,name,canShare};
}
function saveBlob(blob,name){
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),10000);
}

function viewHistory(){
  const byDate=logsByDate();
  if(!byDate.size) return calendarCard(byDate)+`<div class="card empty"><h3>Noch kein Training</h3><p class="muted">Sobald du Sätze einträgst, werden deine Trainingstage im Kalender farbig markiert. Tipp auf einen Tag, um das Training zu sehen oder nachzutragen.</p><button class="btn primary" data-act="tab" data-tab="today">Zum Training</button></div>`;
  const {y,m}=S.cal||{y:new Date().getFullYear(),m:new Date().getMonth()};
  let h=calendarCard(byDate);
  const prefix=y+"-"+pad(m+1)+"-";
  const today=todayStr();
  const plans=[...S.docs.values()].filter(d=>d&&d.kind==="day"&&d.date>today&&d.date.startsWith(prefix)).sort((a,b)=>a.date.localeCompare(b.date));
  if(plans.length) h+=`<div class="group"><h3>Geplant</h3><div class="list">${plans.map(d=>{const names=planIds(d.date).map(id=>ex(id).name);
    return `<button class="item" data-act="day" data-date="${d.date}"><div class="grow"><div class="name" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${esc(relDay(d.date))}${dayDiff(d.date)>-7?` · ${esc(fmtShort.format(toDate(d.date)))}`:""} ${typeBadge(d.date)}</div><div class="sub">${names.length?esc(names.join(", ")):esc(d.note||"Noch keine Übungen eingeplant")}</div></div>${ICON.chev}</button>`;}).join("")}</div></div>`;
  const actDates=[...S.docs.values()].filter(d=>d&&d.kind==="day"&&d.acts&&d.acts.length&&d.date<=today&&d.date.startsWith(prefix)).map(d=>d.date);
  const dates=[...new Set([...byDate.keys(),...actDates])].filter(d=>d.startsWith(prefix)).sort().reverse();
  if(!dates.length) return h+(plans.length?"":`<p class="hint">In diesem Monat gibt es keine Trainings. Tipp auf einen vergangenen Tag, um ein Training nachzutragen, oder auf einen kommenden Tag, um es zu planen.</p>`);
  return h+dates.map(date=>{
    const ls=sortDayLogs(date,byDate.get(date)||[]), AL=dayActs(date);
    const vol=ls.reduce((a,l)=>a+volume(statSets(l)),0);
    const label=dayDiff(date)<7?relDay(date):fmtLong.format(toDate(date));
    return `<section class="day"><h3><span style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><button class="btn ghost" data-act="day" data-date="${date}" style="padding:0;min-height:0;font:inherit;color:inherit;text-transform:inherit">${esc(label)}</button>${typeBadge(date)}</span><small class="num">${ls.length?`${ls.length} ${ls.length===1?"Übung":"Übungen"}`:""}${vol?` · ${fmtNum(Math.round(vol))} kg`:""}</small></h3>${ls.length?dayList(date,ls):""}${AL.length?`<div class="list">${AL.map((a,i)=>`<button class="item" data-act="actEdit" data-date="${date}" data-i="${i}"><div class="grow"><div class="name">${esc(actName(a))}</div><div class="sub num">${fmtNum(+a.min)} min${parseNum(a.km)>0?" · "+fmtNum(parseNum(a.km))+" km":""}</div></div>${(()=>{const K=actKcal(a,date); return K&&K.net!=null?`<span class="meta num">+${fmtNum(K.net)} kcal</span>`:"";})()}</button>`).join("")}</div>`:""}</section>`;
  }).join("");
}
function viewDay(date){
  const ls=sortDayLogs(date,logsByDate().get(date)||[]);
  const fut=date>todayStr(), doc=dayDoc(date);
  let h=`<div class="date-head"><p class="eyebrow">${esc(fut?"Planen · "+relDay(date):relDay(date))}</p><h2>${esc(fmtLong.format(toDate(date)))}</h2></div>`+typePicker(date);
  if(fut){
    h+=`<button class="btn primary" data-act="applyOpen" data-date="${date}">${ICON.copy}Einheit übernehmen</button>`;
    h+=planEditor(date);
    if(doc) h+=`<div class="btn-row"><button class="btn" data-act="copyPlan" data-date="${date}">Eine Woche später wiederholen</button><button class="btn" data-act="clearPlan" data-date="${date}">Plan löschen</button></div>${planItems(date).length?tplSaveForm(date):""}
      <p class="hint">Am Tag selbst siehst du den Plan im Reiter „Training“ und kannst die Übungen direkt eintragen.</p>`;
    else h+=`<p class="hint">Wähle eine Trainingsart und/oder Übungen. Der Tag erscheint dann im Kalender als geplant (gestrichelt).</p>`;
    return h;
  }
  if(date!==todayStr()) h+=dailyCard(date)+actsCard(date);
  const loggedIds=new Set(ls.map(l=>l.exId));
  const planned=plannedList(date,loggedIds);
  const editPlan=date===todayStr()?`<details class="plan-edit"${S.planOpen?" open":""}><summary>${planIds(date).length?"Plan bearbeiten":"Übungen für heute planen"}</summary><div class="stack">${planEditor(date)}</div></details>`:"";
  if(!ls.length) return h+planned+(planned?`<button class="btn" data-act="pickFor" data-date="${date}">${ICON.plus}Andere Übung eintragen</button>`:`<div class="card empty"><h3>Kein Training an diesem Tag</h3><p class="muted">Hast du trainiert und es nur nicht eingetragen? Dann kannst du es hier nachtragen.</p><button class="btn primary" data-act="pickFor" data-date="${date}">${ICON.plus}Training nachtragen</button></div>`)+`<button class="btn" data-act="applyOpen" data-date="${date}">${ICON.copy}Einheit übernehmen</button>`+editPlan;
  const sets=ls.reduce((a,l)=>a+(l.sets||[]).length,0), vol=ls.reduce((a,l)=>a+volume(statSets(l)),0);
  h+=`<p class="meta num">${ls.length} ${ls.length===1?"Übung":"Übungen"} · ${sets} ${sets===1?"Satz":"Sätze"}${vol?` · ${fmtNum(Math.round(vol))} kg Volumen`:""}</p>`;
  h+=dayList(date,ls)+planned;
  h+=`<button class="btn success big" data-act="finishView" data-date="${date}">${ICON.body}${dayDoc(date)&&dayDoc(date).done?"Trainingsübersicht":"Übersicht mit Körpermodell"}</button>
  <button class="btn primary big" data-act="dayPdf" data-date="${date}">${ICON.doc}Diesen Tag als PDF</button>
  <button class="btn" data-act="pickFor" data-date="${date}">${ICON.plus}Übung zu diesem Tag hinzufügen</button>`+tplSaveForm(date)+editPlan;
  return h;
}
function pdfFieldKeys(ls){
  // Felder des Layouts (ohne Satznummer/Haken), plus ausgeblendete Felder, die an diesem Tag Werte haben
  const keys=layoutOrder().filter(k=>{const d=fieldDef(k); return d.kind==="w"||d.kind==="r"||d.kind==="x";});
  for(const l of ls) for(const st of l.sets||[]){ if(st.w!=null&&!keys.includes("w")) keys.push("w"); if(st.r!=null&&!keys.includes("r")) keys.push("r"); for(const k of Object.keys(st.x||{})) if(fieldDef(k)&&!keys.includes(k)) keys.push(k); }
  return keys.length?keys:["w","r"];
}
function makeDayPdf(date){
  const ls=sortDayLogs(date,logsByDate().get(date)||[]);
  const ts=dayTypes(date);
  const model={date,repsFirst:repsFirst(),typeName:typesName(ts),dateLong:new Intl.DateTimeFormat("de-DE",{weekday:"long",day:"numeric",month:"long",year:"numeric"}).format(toDate(date)),created:todayStr(),
    cols:pdfFieldKeys(ls).map(k=>{const d=fieldDef(k); return {t:d.kind==="w"?"Gewicht":d.kind==="r"?"Wdh.":(d.label||d.t)+(d.unit?` (${d.unit})`:""),bold:d.kind==="w"};}),
    exercises:ls.map(l=>{const e=ex(l.exId)||{name:"Gelöschte Übung"}, keys=pdfFieldKeys(ls), A=assistCtx(l); return {name:e.name,group:e.kind?groupsText(e):"",settingsLine:(e.settings||[]).filter(x=>x.k||x.v).map(x=>`${x.k} ${x.v}`.trim()).join(" · "),note:l.note||"",
      sets:(l.sets||[]).map(st=>({...st,cells:keys.map(k=>{const d=fieldDef(k); if(d.kind==="w"){ if(st.w==null) return "–"; if(!A) return fmtNum(st.w)+" kg"; const ew=effW(st.w,A); return "-"+fmtNum(st.w)+" kg"+(ew!=null?` (${fmtNum(ew)} kg)`:""); } if(d.kind==="r") return st.r!=null?String(st.r):"–"; const v=st.x&&st.x[k]; return v!=null&&v!==""?fmtX(d,v):"–";})}))};})};
  const bytes=window.GymReport.buildDay(model);
  return {blob:new Blob([bytes],{type:"application/pdf"}),name:`gym-logbuch-training-${date}.pdf`};
}

  return `${install}${meCard}${goalCard}${foodCard}${ibCard}${bodyCard}${wxCard}${iconCard}${layoutCard}${restCard}${pdfCard}${ctCard}<div class="card panel"><h3>Speicherort</h3>${status}<p class="meta num">${exCount} Übungen · ${lgCount} eingetragene Einheiten</p></div>
  <div class="card panel"><h3>Backup</h3><p class="muted">Sichert alle Übungen, Einstellungen und Einheiten in einer Datei. Damit nimmst du dein Logbuch auf ein neues Handy mit. Ein Backup aus der Claude-Version kannst du hier auch importieren.</p>
    <div class="btn-row"><button class="btn" data-act="export">Backup exportieren</button><button class="btn" data-act="import">Backup importieren</button></div>
  </div>
  <p class="hint">Gym-Logbuch · Version ${APP_VERSION}</p>`;
}

/* ---------- Ereignisse ---------- */
document.addEventListener("click",ev=>{
  const b=ev.target.closest("[data-act]"); if(!b) return;
  const a=b.dataset.act;
  switch(a){
    case "tab": setTab(b.dataset.tab); break;
    case "back": pop(); break;
    case "pick": push({type:"pick"}); break;
    case "pickEx": replace({type:"log",exId:b.dataset.ex,date:top().date||todayStr()}); break;
    case "openLog": push({type:"log",exId:b.dataset.ex,date:b.dataset.date}); break;
    case "openEx": push({type:"exercise",exId:b.dataset.ex}); break;
    case "newEx": push({type:"editEx",exId:null,thenLog:S.tab==="today"}); break;
    case "newExLog": replace({type:"editEx",exId:null,thenLog:true,date:top().date||null}); break;
    case "newEgymLog": replace({type:"editEx",exId:null,thenLog:true,date:top().date||null,egym:true}); break;
    case "exEgym": S.exDraft.egym=b.dataset.v==="1"; render(); break;
    case "editEx": push({type:"editEx",exId:b.dataset.ex}); break;
    case "vagueOk": { const VG=["Arme","Rücken","Schultern"]; saveCfg({vagueOk:[...new Set([...(cfg().vagueOk||[]),...exercises().filter(e=>exGroups(e).some(g=>VG.includes(g))).map(e=>e.id)])]}); render(); break; }
    case "preset": {
      const [n,g]=PRESETS[+b.dataset.i];
      const found=exercises().find(e=>e.name===n);
      const id=found?found.id:createExercise(n,g,[],"");
      if(top()&&top().type==="pick") replace({type:"log",exId:id,date:top().date||todayStr()}); else push({type:"log",exId:id,date:todayStr()});
      break;
    }
    case "fill": {
      const i=+b.dataset.i, s=S.draft.sets[i], g=ghosts()[i], L=layoutOrder(); s.x=s.x||{};
      const hasW=L.includes("w"), hasR=L.includes("r"), XK=extraKeys();
      const gHas=(hasW&&g.w!=null)||(hasR&&g.r!=null)||XK.some(k=>g.x&&g.x[k]!=null&&g.x[k]!=="");
      if(!rowFilled(s)&&!gHas){ const first=document.querySelector(`.set-row[data-row="${i}"] input`); first&&first.focus(); return; }
      if(hasW&&parseNum(s.w)==null&&g.w!=null) s.w=inputVal(g.w);
      if(hasR&&parseNum(s.r)==null&&g.r!=null) s.r=String(g.r);
      for(const k of XK){ if(String(s.x[k]??"").trim()===""&&g.x&&g.x[k]!=null&&g.x[k]!==""){ const d=fieldDef(k); s.x[k]=d.type==="num"?inputVal(g.x[k]):String(g.x[k]); } }
      saveDraft(false); render();
      { const e=ex(S.draft.exId), secs=e?restFor(e):0; if(secs&&restCfg().auto){ const n=S.draft.sets.length; Rest.start(secs, i+1<n?`Weiter mit Satz ${i+2}`:"Weiter mit der nächsten Übung", e.name); } }
      break;
    }
    case "addSet": S.draft.sets.push({w:"",r:"",x:{}}); render(); setTimeout(()=>{const el=$("#w-"+(S.draft.sets.length-1)); el&&el.scrollIntoView({block:"center",behavior:"smooth"});},30); break;
    case "rmSet": S.draft.sets.pop(); saveDraft(false); render(); break;
    case "doneLog": {
      saveDraft(true);
      const has=draftSets().length; pop(); if(has) toast("Gespeichert"); break;
    }
    case "exLoad": S.exDraft.load=b.dataset.v; render(); break;
    case "group": { const G=S.exDraft.groups, g=b.dataset.g, i=G.indexOf(g); if(i>=0) G.splice(i,1); else G.push(g); render(); break; }
    case "groupNew": S.exDraft.newGroup=""; render(); setTimeout(()=>{const el=$("#newgroup"); el&&el.focus();},30); break;
    case "groupAdd": {
      const n=(S.exDraft.newGroup||"").trim(); if(!n){ $("#newgroup").focus(); return; }
      const hit=allGroups().find(g=>g.toLowerCase()===n.toLowerCase());
      if(!hit) saveCfg({groups:[...customGroups(),n]});
      const g=hit||n; if(!S.exDraft.groups.includes(g)) S.exDraft.groups.push(g);
      S.exDraft.newGroup=null; render(); break;
    }
    case "addSetting": S.exDraft.settings.push({k:b.dataset.k,v:""}); render(); setTimeout(()=>{const i=S.exDraft.settings.length-1; const el=$((b.dataset.k?"#sv-":"#sk-")+i); el&&el.focus();},30); break;
    case "rmSetting": S.exDraft.settings.splice(+b.dataset.i,1); render(); break;
    case "noop": break;
    case "iconPick": saveCfg({icon:{...iconCfg(),pick:b.dataset.v,random:false}}); applyIcon(); render(); toast("App-Symbol gewählt"); break;
    case "iconRandom": saveCfg({icon:{...iconCfg(),random:!iconCfg().random}}); applyIcon(); render(); break;
    case "iconPeriod": saveCfg({icon:{...iconCfg(),period:b.dataset.v}}); applyIcon(); render(); break;
    case "actNew": S.armedAct=false; openAct(b.dataset.date,null); break;
    case "actEdit": S.armedAct=false; openAct(b.dataset.date,+b.dataset.i); break;
    case "actPick": { const A=ACT_BY[b.dataset.k]; S.actDraft={...S.actDraft,k:b.dataset.k,v:A?A.d:0}; render(); setTimeout(()=>{ const i=$("#act-min")||$("#act-name"); if(i) i.focus(); },50); break; }
    case "actChange": S.actDraft={...S.actDraft,k:null}; render(); break;
    case "actVar": S.actDraft.v=+b.dataset.v; render(); break;
    case "actPhone": S.actDraft.phone=S.actDraft.phone===false; render(); break;
    case "actSave": {
      const t=top(), D=S.actDraft; if(!t||!D||!D.k) return;
