/* ---------- Pausentimer ---------- */
function restCfg(){ const r=cfg().rest||{}; return {auto:r.auto!==false, def:r.def>0?r.def:90, sound:r.sound!==false, vib:r.vib!==false}; }
function saveRestCfg(patch){ saveCfg({rest:{...restCfg(),...patch}}); }
function restFor(e){ if(e&&typeof e.rest==="number") return e.rest; return restCfg().def; }
function fmtClock(sec){ sec=Math.max(0,Math.round(sec)); return pad(Math.floor(sec/60))+":"+pad(sec%60); }
const REST_OPTIONS=(()=>{ const a=[0]; for(let v=15; v<=300; v+=15) a.push(v); for(let v=360; v<=600; v+=60) a.push(v); return a; })();
function openRestSheet(exId){
  const e=exId?ex(exId):null;
  S.sheet={exId, val:e?restFor(e):restCfg().def};
  renderSheet(false);
}
function closeSheet(){ S.sheet=null; $("#sheetRoot").innerHTML=""; }
function renderSheet(keepScroll){
  const sh=S.sheet; if(!sh) return;
  const e=sh.exId?ex(sh.exId):null;
  const wheel=$("#wheel"), st=wheel?wheel.scrollTop:0;
  const opts=sh.exId?REST_OPTIONS:REST_OPTIONS.filter(v=>v>0);
  $("#sheetRoot").innerHTML=`<div class="sheet-bg" data-act="sheetCancel"><div class="sheet" role="dialog" aria-modal="true" aria-label="Pausenzeit" data-act="noop">
    <div class="sheet-head"><button class="btn ghost" data-act="sheetCancel">Abbrechen</button><b>${e?"Pause":"Standard-Pause"}</b><button class="btn ghost" data-act="sheetOk" style="font-weight:700">Bestätigen</button></div>
    <div class="wheel-wrap"><div class="wheel" id="wheel"><div class="pad"></div>${opts.map(v=>`<button data-act="sheetPick" data-v="${v}" aria-pressed="${sh.val===v}">${v?fmtClock(v):"Aus"}</button>`).join("")}<div class="pad"></div></div></div>
    <div class="sheet-foot">${e?`<p class="hint" style="margin:0">Gilt für ${esc(e.name)}. Die Standard-Pause stellst du unter „Mehr“ ein.</p>`:""}${sh.val&&e?`<button class="btn" data-act="sheetStart">${ICON.clock}Jetzt ${fmtClock(sh.val)} Pause starten</button>`:""}</div>
  </div></div>`;
  const w=$("#wheel");
  if(keepScroll) w.scrollTop=st;
  const idx=opts.indexOf(sh.val);
  const target=Math.max(0,idx)*44;
  if(keepScroll) w.scrollTo({top:target,behavior:"smooth"}); else w.scrollTop=target;
  let t=null;
  w.addEventListener("scroll",()=>{ clearTimeout(t); t=setTimeout(()=>{ const i=Math.round(w.scrollTop/44), v=opts[Math.min(opts.length-1,Math.max(0,i))]; if(v!==S.sheet?.val&&S.sheet){ S.sheet.val=v; w.querySelectorAll("button").forEach(bt=>bt.setAttribute("aria-pressed",String(+bt.dataset.v===v))); const f=$(".sheet-foot"); if(f){ const e2=S.sheet.exId?ex(S.sheet.exId):null; f.innerHTML=(e2?`<p class="hint" style="margin:0">Gilt für ${esc(e2.name)}. Die Standard-Pause stellst du unter „Mehr“ ein.</p>`:"")+(v&&e2?`<button class="btn" data-act="sheetStart">${ICON.clock}Jetzt ${fmtClock(v)} Pause starten</button>`:""); } } },90); },{passive:true});
}

const Rest=(()=>{
  let end=0,total=0,label="",name="",timer=null,doneAt=0,ctx=null,scheduled=[],lock=null,hideT=null;
  const bar=()=>$("#restbar");
  function audio(){
    try{
      if(!ctx){ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null; ctx=new AC(); }
      try{ if(navigator.audioSession) navigator.audioSession.type="ambient"; }catch(e){}
      if(ctx.state==="suspended") ctx.resume();
      return ctx;
    }catch(e){ return null; }
  }
  function clearBeeps(){ for(const o of scheduled){ try{ o.stop(); }catch(e){} } scheduled=[]; }
  function beepAt(t,freq,dur,vol){
    const c=ctx; const o=c.createOscillator(), g=c.createGain();
    o.type="sine"; o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.015); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+0.05); scheduled.push(o);
  }
  function schedule(){
    clearBeeps();
    if(!restCfg().sound) return;
    const c=audio(); if(!c) return;
    const left=(end-Date.now())/1000, t0=c.currentTime+Math.max(0,left);
    // kurze Vorwarnung bei 3, 2, 1 Sekunden, dann Signal
    for(let k=3;k>=1;k--) if(left-k>0.2) beepAt(t0-k,660,0.09,0.25);
    beepAt(t0,880,0.18,0.5); beepAt(t0+0.25,880,0.18,0.5); beepAt(t0+0.5,1175,0.35,0.55);
  }
  async function wake(on){
    try{
      if(on&&!lock&&navigator.wakeLock){ lock=await navigator.wakeLock.request("screen"); lock.addEventListener("release",()=>{lock=null;}); }
      if(!on&&lock){ await lock.release(); lock=null; }
    }catch(e){ lock=null; }
  }
  function draw(){
    const b=bar(); if(!b) return;
    const now=Date.now();
    if(!end){ b.hidden=true; document.body.classList.remove("has-rest"); return; }
    b.hidden=false; document.body.classList.add("has-rest");
    const left=Math.max(0,(end-now)/1000);
    if(left<=0&&!doneAt) finish();
    if(doneAt){
      b.className="restbar done";
      b.innerHTML=`<div class="in" role="alert"><div class="row"><div class="lbl"><small>${esc(name||"Pause")}</small><span class="time" style="font-size:1.5rem">${esc(label||"Pause vorbei")}</span></div><button class="main" data-act="restStop">OK</button></div></div>`;
      return;
    }
    b.className="restbar";
    const frac=total?left/total:0;
    if(!b.querySelector(".time")){
      b.innerHTML=`<div class="in" role="timer" aria-live="off"><div class="row"><div class="lbl"><small>Pause${name?" · "+esc(name):""}</small><span class="time"></span></div><button data-act="restAdd" data-s="-15" aria-label="15 Sekunden weniger">−15</button><button data-act="restAdd" data-s="15" aria-label="15 Sekunden mehr">+15</button><button class="main" data-act="restStop" aria-label="Pause beenden">${ICON.x.replace("<svg",'<svg style="width:18px;height:18px"')}</button></div><div class="prog"><i></i></div></div>`;
    }
    b.querySelector(".time").textContent=fmtClock(Math.ceil(left));
    b.querySelector(".prog i").style.transform=`scaleX(${frac.toFixed(4)})`;
  }
  function finish(){
    doneAt=Date.now();
    const c=restCfg();
    if(c.vib&&navigator.vibrate){ try{ navigator.vibrate([350,150,350,150,600]); }catch(e){} }
    wake(false);
    clearTimeout(hideT); hideT=setTimeout(()=>{ if(doneAt) stop(); },12000);
  }
  function loop(){ clearInterval(timer); timer=setInterval(draw,250); draw(); }
  function start(secs,lbl,exName){
    total=secs; end=Date.now()+secs*1000; label=lbl||""; name=exName||""; doneAt=0; clearTimeout(hideT);
    const b=bar(); if(b) b.innerHTML="";
    schedule(); wake(true); loop();
  }
  function add(s){
    if(!end||doneAt) return;
    end=Math.max(Date.now()+1000,end+s*1000); total=Math.max(total+s,(end-Date.now())/1000);
    schedule(); draw();
  }
  function stop(){ end=0; doneAt=0; clearBeeps(); clearInterval(timer); clearTimeout(hideT); wake(false); const b=bar(); if(b) b.innerHTML=""; draw(); }
  function test(){ const c=audio(); if(!c){ toast("Ton wird hier nicht unterstützt"); return; } clearBeeps(); const t=c.currentTime+0.05; beepAt(t,880,0.18,0.5); beepAt(t+0.25,880,0.18,0.5); beepAt(t+0.5,1175,0.35,0.55); if(restCfg().vib&&navigator.vibrate) try{ navigator.vibrate([200,100,200]); }catch(e){} }
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&end&&!doneAt){ wake(true); if(ctx&&ctx.state==="suspended") ctx.resume().then(schedule).catch(()=>{}); draw(); } });
  return {start,add,stop,test};
})();

/* ---------- Backup ---------- */
async function exportBackup(){
  const docs={}; for(const [id,d] of S.docs) docs[id]=d;
  const data=JSON.stringify({app:"gym-logbuch",version:1,exportedAt:new Date().toISOString(),docs},null,1);
  const name=`gym-logbuch-backup-${todayStr()}.json`;
  const blob=new Blob([data],{type:"application/json"});
  // Auf dem Handy: Teilen-Menü (z. B. in Google Drive speichern oder per Mail an dich selbst)
  try{
    const file=new File([blob],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:"Gym-Logbuch Backup"}); return; }
  }catch(e){ if(e&&e.name==="AbortError") return; }
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
  toast("Backup heruntergeladen");
}
$("#importFile").addEventListener("change",ev=>{
  const file=ev.target.files&&ev.target.files[0]; ev.target.value=""; if(!file) return;
  const fr=new FileReader();
  fr.onload=async()=>{
    let parsed; try{ parsed=JSON.parse(fr.result); }catch(e){ toast("Diese Datei ist kein Gym-Logbuch-Backup"); return; }
    if(!parsed||parsed.app!=="gym-logbuch"||!parsed.docs){ toast("Diese Datei ist kein Gym-Logbuch-Backup"); return; }
    if(parsed.docs.cfg&&Array.isArray(parsed.docs.cfg.types)){ const have=new Set(customTypes().map(t=>t.k)); const add=parsed.docs.cfg.types.filter(t=>t&&t.k&&t.n&&!have.has(t.k)); if(add.length) saveCfg({types:[...customTypes(),...add]}); }
    const entries=Object.entries(parsed.docs).filter(([id,d])=>d&&(d.kind==="exercise"||d.kind==="log"||d.kind==="day")&&/^[A-Za-z0-9_\-.~:@+]+$/.test(id))
      .filter(([id,d])=>{const cur=S.docs.get(id); return !cur||(d.updatedAt||0)>(cur.updatedAt||0);});
    if(!entries.length){ toast("Alles schon vorhanden – nichts Neues im Backup"); return; }
    toast("Importiere…");
    await putMany(entries); render(); toast(`${entries.length} Einträge importiert`);
  };
  fr.readAsText(file);
});

/* ---------- Installieren & Offline ---------- */
window.addEventListener("beforeinstallprompt",ev=>{ ev.preventDefault(); installPrompt=ev; if(S.tab==="more"&&!top()) render(); });
window.addEventListener("appinstalled",()=>{ installPrompt=null; toast("App installiert"); render(); });
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js").then(reg=>{
      const watch=w=>{ if(!w) return; w.addEventListener("statechange",()=>{ if(w.state==="installed"&&navigator.serviceWorker.controller){ waitingWorker=w; renderFromData(); } }); };
      if(reg.waiting&&navigator.serviceWorker.controller){ waitingWorker=reg.waiting; renderFromData(); }
      reg.addEventListener("updatefound",()=>watch(reg.installing));
      document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") reg.update().catch(()=>{}); });
    }).catch(()=>{});
    let reloading=false;
    navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(reloading) return; reloading=true; leaveCurrent(); location.reload(); });
  });
}

init();
})();
</script>
