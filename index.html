<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gym-Logbuch</title>
<meta name="description" content="Trainings-Logbuch: Übungen, Geräte-Einstellungen, Sätze, Wiederholungen und Gewicht.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#eef1f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1219" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gym-Log">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow phone column, sticky title bar on top, tab bar fixed at the bottom; screens stack above the tabs. */
:root{
  --bg:#eef1f5; --surface:#ffffff; --sunk:#e3e8ef; --ink:#121823; --muted:#566274; --line:#d2d8e1;
  --accent:#1f46c2; --accent-ink:#ffffff; --accent-soft:#dfe6fb;
  --pr:#c62f28; --pr-soft:#fbe2df; --ok:#1d7a4b;
  --cal1:#c9d6f7; --cal2:#7d9bec; --cal3:#1f46c2; --cal-ink3:#ffffff;
  --t-push:#2a78d6; --t-push-ink:#fff; --t-pull:#eb6834; --t-pull-ink:#fff; --t-beine:#1baf7a; --t-beine-ink:#0b1a14; --t-oben:#eda100; --t-oben-ink:#1f1600; --t-unten:#e87ba4; --t-unten-ink:#2a0d18; --t-ganz:#008300; --t-ganz-ink:#fff; --t-cardio:#6250d6; --t-cardio-ink:#fff; --t-sonst:#e34948; --t-sonst-ink:#fff;
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1219; --surface:#161d28; --sunk:#1e2734; --ink:#e6ebf2; --muted:#93a0b2; --line:#2a3546;
    --accent:#7196ff; --accent-ink:#0a1124; --accent-soft:#1c2a4f;
    --pr:#ff7568; --pr-soft:#3d1e1b; --ok:#52c78d; --cal1:#24345e; --cal2:#3d5bb5; --cal3:#7196ff; --cal-ink3:#0a1124; --t-push:#3987e5; --t-push-ink:#fff; --t-pull:#d95926; --t-pull-ink:#fff; --t-beine:#199e70; --t-beine-ink:#fff; --t-oben:#c98500; --t-oben-ink:#1f1600; --t-unten:#d55181; --t-unten-ink:#fff; --t-ganz:#008300; --t-ganz-ink:#fff; --t-cardio:#9085e9; --t-cardio-ink:#120d33; --t-sonst:#e66767; --t-sonst-ink:#fff; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1219; --surface:#161d28; --sunk:#1e2734; --ink:#e6ebf2; --muted:#93a0b2; --line:#2a3546;
  --accent:#7196ff; --accent-ink:#0a1124; --accent-soft:#1c2a4f;
  --pr:#ff7568; --pr-soft:#3d1e1b; --ok:#52c78d; --cal1:#24345e; --cal2:#3d5bb5; --cal3:#7196ff; --cal-ink3:#0a1124; --t-push:#3987e5; --t-push-ink:#fff; --t-pull:#d95926; --t-pull-ink:#fff; --t-beine:#199e70; --t-beine-ink:#fff; --t-oben:#c98500; --t-oben-ink:#1f1600; --t-unten:#d55181; --t-unten-ink:#fff; --t-ganz:#008300; --t-ganz-ink:#fff; --t-cardio:#9085e9; --t-cardio-ink:#120d33; --t-sonst:#e66767; --t-sonst-ink:#fff; color-scheme:dark;
}
*{box-sizing:border-box}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
img{max-width:100%}
html,body{background:var(--bg)}
body{margin:0;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;line-height:1.05;text-wrap:balance;margin:0}
.num{font-variant-numeric:tabular-nums}

/* Title bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid transparent}
.bar.scrolled{border-bottom-color:var(--line)}
.bar .wrap{display:flex;align-items:center;gap:10px;min-height:58px;padding-block:8px}
.bar h1{font-size:1.75rem;text-transform:uppercase;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar.sub h1{font-size:1.4rem}
.back{border:0;background:var(--sunk);border-radius:999px;padding:6px 14px 6px 10px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.back svg{width:18px;height:18px}
.sync{font-size:.78rem;color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync[data-s="local"]::before{background:var(--ok)}
.sync[data-s="saving"]::before{background:var(--accent)}
.sync[data-s="memory"]::before{background:#d39b1f}
.sync[data-s="error"]::before{background:var(--pr)}

main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
main .wrap{display:flex;flex-direction:column;gap:20px;padding-block:8px 24px}

/* Tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 10px;font-size:.78rem;font-weight:600;color:var(--muted)}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent)}

/* Generic pieces */
.eyebrow{font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{width:100%;min-height:54px;font-size:1.05rem}
.btn.ghost{background:none;border-color:transparent;color:var(--accent);padding-inline:8px}
.btn.danger{color:var(--pr);border-color:var(--pr)}
.btn.danger.armed{background:var(--pr);color:var(--surface)}
.btn svg{width:20px;height:20px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row .btn{flex:1 1 140px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:500;font-size:.92rem}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pr{display:inline-flex;align-items:center;gap:4px;background:var(--pr-soft);color:var(--pr);font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:2px 8px;white-space:nowrap}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:.85rem;font-weight:600;color:var(--muted)}
.input,textarea.input,select.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px;min-height:46px}
textarea.input{min-height:76px;resize:vertical}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.search .input{padding-left:38px}

/* Today */
.date-head h2{font-size:2.3rem;text-transform:uppercase}
.log-card{display:flex;flex-direction:column;gap:6px;padding:14px 16px;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius)}
.log-card .top{display:flex;align-items:baseline;gap:8px;justify-content:space-between}
.log-card h3{font-size:1.35rem}
.sets-line{display:flex;flex-wrap:wrap;gap:4px 12px;font-family:var(--f-display);font-size:1.15rem;font-weight:600;font-variant-numeric:tabular-nums}
.sets-line .x{color:var(--muted);font-weight:500}
.meta{font-size:.85rem;color:var(--muted)}

.empty{padding:22px 18px;display:flex;flex-direction:column;gap:14px}
.empty h3{font-size:1.5rem}
.empty p{margin:0}

/* Lists */
.group h3{font-size:.8rem;font-family:var(--f-body);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px 2px}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:13px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0}
.item .name{font-weight:600;font-size:1.05rem}
.item .sub{font-size:.85rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .chev{width:18px;height:18px;color:var(--muted);flex:none}
.item .plus{width:22px;height:22px;color:var(--accent);flex:none}

/* Logger */
.ex-head{display:flex;flex-direction:column;gap:8px}
.ex-head h2{font-size:2.4rem;text-transform:uppercase}
.settings{display:flex;flex-wrap:wrap;gap:8px;margin:0}
.settings div{background:var(--sunk);border-radius:8px;padding:6px 10px;display:flex;gap:6px;align-items:baseline}
.settings dt{font-size:.8rem;color:var(--muted)}
.settings dd{margin:0;font-weight:600}
.lastline{padding:10px 14px;background:var(--accent-soft);border-radius:10px;font-size:.92rem}
.lastline b{font-family:var(--f-display);font-size:1.05rem;font-variant-numeric:tabular-nums}
.sets{display:flex;flex-direction:column;gap:8px}
.set-head,.set-row{display:grid;grid-template-columns:2.2rem 1fr 1fr 3.1rem;gap:8px;align-items:center}
.set-head{font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 2px}
.set-head span:nth-child(2),.set-head span:nth-child(3){text-align:center}
.set-row .n{font-family:var(--f-display);font-size:1.4rem;font-weight:700;color:var(--muted);text-align:center}
.set-row input{width:100%;min-width:0;height:54px;border:1px solid var(--line);background:var(--surface);border-radius:10px;text-align:center;font-family:var(--f-display);font-size:1.6rem;font-weight:600;font-variant-numeric:tabular-nums}
.set-row input::placeholder{color:var(--muted);opacity:.55}
.chk{height:54px;border-radius:10px;border:1px dashed var(--line);background:none;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.chk svg{width:24px;height:24px}
.set-row.filled .chk{border-style:solid;border-color:var(--ok);background:var(--ok);color:var(--surface)}
.set-row.filled .n{color:var(--ink)}
.hint{font-size:.85rem;color:var(--muted);margin:0}

/* Exercise detail */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-size:1.7rem;font-variant-numeric:tabular-nums;line-height:1}
.stat span{font-size:.75rem;color:var(--muted);font-weight:600}
.chart{padding:14px 14px 8px}
.chart svg{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .area{fill:var(--accent);opacity:.12}
.chart .line{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .end{fill:var(--accent)}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--f-body);font-variant-numeric:tabular-nums}
.chart text.endlabel{fill:var(--ink);font-weight:600;font-size:11px}
.hist{display:flex;flex-direction:column}
.cal{padding:14px 12px 12px}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.cal-head h3{font-size:1.45rem;text-transform:uppercase;flex:1;text-align:center}
.cal-nav{width:44px;height:40px;border:1px solid var(--line);background:var(--surface);border-radius:10px;display:flex;align-items:center;justify-content:center}
.cal-nav svg{width:20px;height:20px}
.cal-nav:disabled{opacity:.35}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-grid .wd{font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center;padding-bottom:4px}
.cal-day{aspect-ratio:1;max-width:100%;border:0;border-radius:10px;background:none;font-family:var(--f-display);font-size:1.15rem;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink);display:flex;align-items:center;justify-content:center;position:relative}
.cal-day.out{visibility:hidden}
.cal-day.future{color:var(--muted)}
.cal-day.plan{outline:2px dashed var(--muted);outline-offset:-2px;color:var(--ink)}
.cal-day.ty.plan{background:color-mix(in srgb,var(--tc) 28%,var(--surface));color:var(--ink);outline-color:var(--tc)}
.legend i.plan{background:none;outline:1.5px dashed var(--muted);outline-offset:-1.5px}
details.plan-edit{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:12px 14px}
details.plan-edit summary{font-weight:600;cursor:pointer}
details.plan-edit[open] summary{margin-bottom:12px}
.plan-next{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;border:1px dashed var(--line);border-radius:var(--radius);background:var(--surface)}
.plan-next .chev{width:18px;height:18px;color:var(--muted);flex:none}
.plan-row{padding:12px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.plan-row:first-child{border-top:0}
.plan-top{display:flex;gap:10px;align-items:flex-start}
.plan-top .grow{flex:1;min-width:0}
.plan-top .icon-btn{width:38px;height:38px}
.plan-tg{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.plan-tg label{display:flex;align-items:center;gap:5px}
.plan-tg input{width:58px;height:42px;border:1px solid var(--line);border-radius:8px;text-align:center;font-family:var(--f-display);font-size:1.2rem;font-weight:600;font-variant-numeric:tabular-nums;background:var(--surface)}
.plan-tg input::placeholder{color:var(--muted);opacity:.55}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:34px;height:34px;border-radius:50%;border:0;background:var(--tc);flex:none}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--ink)}
.type-form{padding:14px;display:flex;flex-direction:column;gap:12px}
.ct-row{display:flex;flex-direction:column;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.ct-row:first-of-type{border-top:0}
.ct-row .top{display:flex;gap:8px;align-items:center}
.ct-row .top .input{flex:1;min-width:0}
.item .chk-on{width:22px;height:22px;color:var(--ok);flex:none}
.plan-next .eyebrow{margin-bottom:2px}
.cal-day.l1{background:var(--cal1)}
.cal-day.l2{background:var(--cal2);color:var(--cal-ink3)}
.cal-day.l3{background:var(--cal3);color:var(--cal-ink3)}
.cal-day.today{box-shadow:inset 0 0 0 2px var(--ink)}
.cal-day.picked{box-shadow:inset 0 0 0 2px var(--pr)}
.cal-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:.8rem;color:var(--muted)}
.legend{display:flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
.legend i.ty{background:var(--tc)}
.legend i.none{background:var(--sunk);box-shadow:inset 0 0 0 1.5px var(--muted)}
.legend{flex-wrap:wrap}
.ty-push{--tc:var(--t-push);--tci:var(--t-push-ink)}
.ty-pull{--tc:var(--t-pull);--tci:var(--t-pull-ink)}
.ty-beine{--tc:var(--t-beine);--tci:var(--t-beine-ink)}
.ty-oben{--tc:var(--t-oben);--tci:var(--t-oben-ink)}
.ty-unten{--tc:var(--t-unten);--tci:var(--t-unten-ink)}
.ty-ganz{--tc:var(--t-ganz);--tci:var(--t-ganz-ink)}
.ty-cardio{--tc:var(--t-cardio);--tci:var(--t-cardio-ink)}
.ty-sonst{--tc:var(--t-sonst);--tci:var(--t-sonst-ink)}
.cal-day.ty{background:var(--tc);color:var(--tci);flex-direction:column;gap:0;line-height:1}
.cal-day small{font-family:var(--f-body);font-size:.6rem;font-weight:700;letter-spacing:.03em;opacity:.9;margin-top:2px}
.cal-day.none{background:var(--sunk);box-shadow:inset 0 0 0 1.5px var(--muted)}
.cal-day.today.ty,.cal-day.today.none{box-shadow:inset 0 0 0 2px var(--ink),inset 0 0 0 4px var(--surface)}
.type-row{display:flex;flex-wrap:wrap;gap:8px}
.tchip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px 7px 10px;font-weight:600;font-size:.9rem}
.tchip i{width:12px;height:12px;border-radius:50%;background:var(--tc);flex:none}
.tchip[aria-pressed="true"]{background:var(--tc);border-color:var(--tc);color:var(--tci)}
.tchip[aria-pressed="true"] i{background:var(--tci)}
.tbadge{display:inline-flex;align-items:center;border-radius:999px;padding:2px 9px;font-family:var(--f-body);font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:var(--tc);color:var(--tci);vertical-align:middle}
.legend i.l1{background:var(--cal1)}.legend i.l2{background:var(--cal2)}.legend i.l3{background:var(--cal3)}
.chart-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.seg{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px}
.seg button{border:0;background:none;border-radius:7px;padding:6px 12px;font-weight:600;font-size:.88rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chips.small .chip{padding:5px 11px;font-size:.84rem}
.chart .hit{fill:transparent;cursor:pointer}
.chart .sel{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart text.tip{fill:var(--ink);font-weight:700;font-size:11px}
.chart .tipbg{fill:var(--surface);stroke:var(--line)}
.tbl-wrap{overflow-x:auto;margin:0 -2px}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem;font-variant-numeric:tabular-nums}
.tbl th{font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{text-align:right;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left;padding-left:2px}
.tbl td.b{font-weight:600}
.result{padding:14px 16px;display:flex;flex-direction:column;gap:10px;border-color:var(--ok)}
.result .status i{background:var(--ok)}
.hist .item{flex-direction:column;align-items:stretch;gap:4px}

/* Editor */
.set-edit{display:grid;grid-template-columns:1fr 1fr 44px;gap:8px;align-items:center}
.icon-btn{width:44px;height:46px;border:1px solid var(--line);border-radius:10px;background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.icon-btn svg{width:18px;height:18px}

/* History */
.day h3{font-size:1.4rem;text-transform:uppercase;display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:0 0 8px}
.day h3 small{font-family:var(--f-body);font-size:.8rem;font-weight:500;color:var(--muted);text-transform:none;letter-spacing:0}

/* More */
.panel{padding:16px;display:flex;flex-direction:column;gap:10px}
.panel h3{font-size:1.3rem}
.panel p{margin:0}
.panel ol{margin:0;padding-left:20px}
.status{display:flex;align-items:center;gap:10px;font-weight:600}
.status i{width:10px;height:10px;border-radius:50%;background:var(--ok);flex:none}
.status.local i{background:#d39b1f}
.backup-text{font-family:ui-monospace,Menlo,monospace;font-size:.75rem;min-height:140px}

body.has-rest .toast{bottom:calc(168px + env(safe-area-inset-bottom,0px))}
body.has-rest main{padding-bottom:calc(190px + env(safe-area-inset-bottom,0px))}
.pause-chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:.92rem;font-variant-numeric:tabular-nums}
.pause-chip svg{width:18px;height:18px}
.pause-chip.off{color:var(--muted)}
.log-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.restbar{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom,0px));z-index:7;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:0 8px;pointer-events:none}
.restbar .in{max-width:536px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:16px;padding:12px 14px 10px;display:flex;flex-direction:column;gap:8px;box-shadow:0 8px 24px rgba(0,0,0,.25);pointer-events:auto}
.restbar .row{display:flex;align-items:center;gap:10px}
.restbar .lbl{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15}
.restbar .lbl small{font-size:.75rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.restbar .time{font-family:var(--f-display);font-size:2.2rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.restbar button{border:0;border-radius:10px;min-width:48px;height:44px;padding:0 10px;font-weight:700;font-variant-numeric:tabular-nums;background:color-mix(in srgb,var(--bg) 16%,transparent);color:var(--bg)}
.restbar button.main{background:var(--bg);color:var(--ink)}
.restbar .prog{height:4px;border-radius:4px;background:color-mix(in srgb,var(--bg) 20%,transparent);overflow:hidden}
.restbar .prog i{display:block;height:100%;background:var(--bg);border-radius:4px;transform-origin:left center}
.restbar.done .in{background:var(--ok);color:#fff}
.restbar.done button{color:#fff}
.restbar.done button.main{background:#fff;color:var(--ok)}
.restbar.done .prog{display:none}
@keyframes restpulse{0%{transform:scale(1)}50%{transform:scale(1.025)}100%{transform:scale(1)}}
.restbar.done .in{animation:restpulse .5s ease-in-out 3}
.sheet-bg{position:fixed;inset:0;z-index:30;background:rgba(8,12,20,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;background:var(--surface);border-radius:18px 18px 0 0;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:12px 8px;border-bottom:1px solid var(--line)}
.sheet-head b{font-family:var(--f-display);font-size:1.25rem;text-transform:uppercase}
.sheet-head .btn{min-height:40px}
.wheel{position:relative;height:220px;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;-webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent)}
.wheel .pad{height:88px}
.wheel button{display:block;width:100%;height:44px;border:0;background:none;scroll-snap-align:center;font-family:var(--f-display);font-size:1.5rem;font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted)}
.wheel button[aria-pressed="true"]{color:var(--ink);font-size:1.75rem}
.wheel-wrap{position:relative}
.wheel-wrap::before{content:"";position:absolute;left:12px;right:12px;top:88px;height:44px;border-radius:10px;background:var(--sunk);pointer-events:none}
.sheet-foot{display:flex;flex-direction:column;gap:10px;padding:12px 16px 0}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.switch-row span{font-weight:500}
.switch{position:relative;width:52px;height:30px;flex:none;border:0;border-radius:999px;background:var(--line);padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--ok)}
.switch[aria-checked="true"]::after{transform:translateX(22px)}
@media (prefers-reduced-motion: reduce){.restbar.done .in{animation:none}.switch::after{transition:none}}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(12px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.92rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.loading{padding:40px 0;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
@media (max-width:360px){.stats{grid-template-columns:1fr 1fr}.date-head h2,.ex-head h2{font-size:2rem}}
.update-bar{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 14px;background:var(--accent-soft);border-radius:10px;font-weight:600;font-size:.92rem}
</style>
</head>
<body>

<header class="bar" id="bar">
  <div class="wrap">
    <button class="back" id="back" data-act="back" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>Zurück</button>
    <h1 id="ttl">Training</h1>
    <span class="sync" id="sync" data-s="loading">Lädt…</span>
  </div>
</header>

<main id="main"><div class="wrap"><p class="loading">Dein Logbuch wird geladen…</p></div></main>

<nav class="tabs" aria-label="Bereiche">
  <div class="wrap">
    <button class="tab" data-act="tab" data-tab="today" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg>Training</button>
    <button class="tab" data-act="tab" data-tab="exercises"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg>Übungen</button>
    <button class="tab" data-act="tab" data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>Verlauf</button>
    <button class="tab" data-act="tab" data-tab="more"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5.5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="18.5" cy="12" r="1.8"/></svg>Mehr</button>
  </div>
</nav>
<div class="restbar" id="restbar" hidden></div>
<div id="sheetRoot"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script src="report.js"></script>
<script>
(function(){
"use strict";

/* ---------- Konstanten ---------- */
const GROUPS = ["Brust","Rücken","Schultern","Beine","Po","Arme","Bauch","Ganzkörper","Cardio","Sonstiges"];
const PRESETS = [["Beinpresse","Beine"],["Latzug","Rücken"],["Brustpresse","Brust"],["Rudern sitzend","Rücken"],["Schulterpresse","Schultern"],["Beinstrecker","Beine"],["Beinbeuger","Beine"],["Bizepscurls","Arme"]];
function customGroups(){ return (cfg().groups||[]).filter(g=>typeof g==="string"&&g.trim()); }
function allGroups(){ return [...GROUPS.filter(g=>g!=="Sonstiges"),...customGroups(),"Sonstiges"]; }
function exGroups(e){ const g=Array.isArray(e.groups)&&e.groups.length?e.groups:[e.group||"Sonstiges"]; return [...new Set(g)]; }
function groupsText(e){ return exGroups(e).join(" · "); }
const SETTING_SUGGEST = ["Sitzhöhe","Rückenlehne","Griff","Polster","Fußposition","Bank-Neigung","Kabelhöhe","Startposition"];
const LS_KEY = "gym-logbuch.v1";
const APP_VERSION = "1.7";
const DAY_TYPES = [{k:"push",n:"Push",a:"Pu"},{k:"pull",n:"Pull",a:"Pl"},{k:"beine",n:"Beine",a:"B"},{k:"oben",n:"Oberkörper",a:"OK"},{k:"unten",n:"Unterkörper",a:"UK"},{k:"ganz",n:"Ganzkörper",a:"GK"},{k:"cardio",n:"Cardio",a:"C"},{k:"sonst",n:"Sonstiges",a:"S"}];
DAY_TYPES.forEach(t=>t.c=t.k);
const COLOR_NAMES={push:"Blau",pull:"Orange",beine:"Türkis",oben:"Gelb",unten:"Rosa",ganz:"Grün",cardio:"Lila",sonst:"Rot"};
function cfg(){ const c=S.docs.get("cfg"); return c&&c.kind==="settings"?c:{kind:"settings"}; }
function saveCfg(patch){ put("cfg",{...cfg(),...patch,kind:"settings",updatedAt:Date.now()}); }
function customTypes(){ return (cfg().types||[]).filter(t=>t&&t.k&&t.n); }
function allTypes(){ return [...DAY_TYPES,...customTypes().map(t=>({k:t.k,n:t.n,a:t.a||abbr(t.n),c:COLOR_NAMES[t.c]?t.c:"sonst",custom:true}))]; }
const typeOf = k => k?allTypes().find(t=>t.k===k)||null:null;
function abbr(n){ const w=n.trim().split(/[\s&+\/,-]+/).filter(Boolean); if(w.length>1) return (w[0][0]+w[1][0]).toUpperCase(); const x=w[0]||"?"; return x.length<=2?x:x[0].toUpperCase()+x[1].toLowerCase(); }
const RANGES = [["4w","4 Wochen","Letzte 4 Wochen"],["3m","3 Monate","Letzte 3 Monate"],["6m","6 Monate","Letzte 6 Monate"],["12m","12 Monate","Letzte 12 Monate"],["all","Alles","Gesamter Zeitraum"]];
const TAB_TITLES = {today:"Training", exercises:"Übungen", history:"Verlauf", more:"Mehr"};

const ICON = {
  chev:'<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2.5h5"/></svg>',
  doc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>',
  plusItem:'<svg class="plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/></svg>'
};

/* ---------- Zustand ---------- */
const S = {
  docs: new Map(),      // id -> Dokument
  ready: false,
  mode: "loading",      // local | memory
  tab: "today",
  stack: [],            // Unterseiten: {type:'log'|'exercise'|'editEx'|'pick', ...}
  draft: null,          // Logger-Entwurf
  exDraft: null,        // Übungs-Editor-Entwurf
  query: "",
  armedDelete: false,
  prog: {metric:"w", view:"chart", sel:null},
  cal: null,
  rep: null
};
let installPrompt = null; // Android: Installations-Dialog von Chrome
let waitingWorker = null; // neue App-Version wartet

/* ---------- Helfer ---------- */
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf = new Intl.NumberFormat("de-DE",{maximumFractionDigits:2});
const fmtLong = new Intl.DateTimeFormat("de-DE",{weekday:"long",day:"numeric",month:"long"});
const fmtShort = new Intl.DateTimeFormat("de-DE",{day:"2-digit",month:"2-digit"});
const fmtShortY = new Intl.DateTimeFormat("de-DE",{day:"2-digit",month:"2-digit",year:"2-digit"});
const fmtWeekday = new Intl.DateTimeFormat("de-DE",{weekday:"long"});
const sleep = ms => new Promise(r=>setTimeout(r,ms));
function pad(n){return String(n).padStart(2,"0")}
function todayStr(){const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function toDate(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function dayDiff(s){return Math.round((toDate(todayStr())-toDate(s))/86400000)}
function relDay(s){
  const d=dayDiff(s);
  if(d===0) return "Heute"; if(d===1) return "Gestern"; if(d===-1) return "Morgen";
  if(d>1 && d<7) return fmtWeekday.format(toDate(s));
  if(d<-1 && d>-7) return `In ${-d} Tagen`;
  return toDate(s).getFullYear()===new Date().getFullYear() ? fmtShort.format(toDate(s)) : fmtShortY.format(toDate(s));
}
function rid(p){return p+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function parseNum(v){ if(v==null) return null; const s=String(v).trim().replace(",","."); if(s==="") return null; const n=parseFloat(s); return isFinite(n)?n:null; }
function fmtNum(n){return n==null?"":nf.format(n)}
function inputVal(n){return n==null?"":String(n).replace(".",",")}
function e1rm(w,r){ if(!w||!r) return null; return r===1?w:w*(1+r/30); }
function setText(s){
  if(s.w!=null && s.r!=null) return `${fmtNum(s.w)}<span class="x"> × </span>${s.r}`;
  if(s.w!=null) return `${fmtNum(s.w)} kg`;
  if(s.r!=null) return `${s.r} Wdh.`;
  return "";
}
function setsLine(sets){ return `<div class="sets-line">${sets.map(s=>`<span>${setText(s)}</span>`).join("")}</div>`; }
function volume(sets){ return sets.reduce((a,s)=>a+((s.w||0)*(s.r||0)),0); }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),2200); }

/* ---------- Datenzugriff ---------- */
function exercises(){ const out=[]; for(const [id,d] of S.docs) if(d&&d.kind==="exercise") out.push({id,...d}); return out.sort((a,b)=>a.name.localeCompare(b.name,"de")); }
function logs(){ const out=[]; for(const [id,d] of S.docs) if(d&&d.kind==="log") out.push({id,...d}); return out; }
function ex(id){ const d=S.docs.get(id); return d&&d.kind==="exercise"?{id,...d}:null; }
function logsFor(exId){ return logs().filter(l=>l.exId===exId).sort((a,b)=>b.date.localeCompare(a.date)); }
function logId(date,exId){ return "lg_"+date+"_"+exId; }
function lastBefore(exId,date){ return logsFor(exId).find(l=>l.date<date) || null; }
function maxW(sets){ let m=null; for(const s of sets) if(s.w!=null && (m==null||s.w>m)) m=s.w; return m; }
function isPR(log){
  const mine=maxW(log.sets||[]); if(mine==null) return false;
  const earlier=logsFor(log.exId).filter(l=>l.date<log.date);
  const prev=earlier.reduce((m,l)=>{const x=maxW(l.sets||[]);return x!=null&&(m==null||x>m)?x:m;},null);
  return prev!=null && mine>prev;
}
function lastUsed(exId){ const l=logsFor(exId)[0]; return l?l.date:null; }

/* ---------- Speicher ---------- */
function readLocal(){ try{ const raw=localStorage.getItem(LS_KEY); return raw?JSON.parse(raw):null; }catch(e){ return undefined; } }
function writeLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify({v:1,docs:Object.fromEntries(S.docs)})); return true; }catch(e){ return false; } }

let localTimer=null;
function setSync(state){
  const el=$("#sync");
  const labels={local:"Gespeichert",saving:"Speichert…",memory:"Nicht gespeichert",error:"Fehler beim Speichern",loading:"Lädt…"};
  el.dataset.s=state==="saving"?"saving":state; el.textContent=labels[state]||"";
}
function persistLocal(){
  clearTimeout(localTimer);
  if(S.mode!=="local") return;
  setSync("saving");
  localTimer=setTimeout(()=>{
    if(writeLocal()) setSync("local");
    else { S.mode="memory"; setSync("memory"); toast("Speichern auf diesem Gerät nicht möglich – mach ein Backup"); }
  },250);
}
function put(id,body){
  if(body===null) S.docs.delete(id); else S.docs.set(id,body);
  persistLocal();
}
async function putMany(entries){
  for(const [id,body] of entries) S.docs.set(id,body);
  persistLocal();
}

async function init(){
  const local=readLocal();
  if(local===undefined){ S.mode="memory"; setSync("memory"); }
  else { S.mode="local"; setSync("local"); if(local&&local.docs) for(const [id,d] of Object.entries(local.docs)) S.docs.set(id,d); }
  S.ready=true; render();
  // Browser bitten, die Daten nicht automatisch zu löschen
  try{ if(navigator.storage&&navigator.storage.persist) S.persisted=await navigator.storage.persist(); }catch(e){}
}

/* ---------- Navigation ---------- */
function top(){ return S.stack[S.stack.length-1]||null; }
function push(screen){ leaveCurrent(); S.stack.push(screen); enter(screen); render(); window.scrollTo(0,0); }
function replace(screen){ leaveCurrent(); S.stack.pop(); S.stack.push(screen); enter(screen); render(); window.scrollTo(0,0); }
function pop(){ leaveCurrent(); S.stack.pop(); const t=top(); if(t) enter(t); render(); }
function setTab(tab){ leaveCurrent(); S.stack=[]; S.planOpen=false; S.typeForm=null; S.tab=tab; S.query=""; render(); window.scrollTo(0,0); }
function enter(screen){
  S.armedDelete=false;
  if(screen.type==="log") openDraft(screen.exId,screen.date);
  if(screen.type==="editEx") openExDraft(screen.exId);
  if(screen.type==="pick"||screen.type==="planPick") S.query="";
  if(screen.type==="day") S.typeForm=null;
  if(screen.type==="exercise") S.prog.sel=null;
  if(screen.type==="report") S.rep={range:"3m",exIds:screen.exId?new Set([screen.exId]):null,chart:true,table:true,result:null,busy:false};
}
function leaveCurrent(){ const t=top(); if(t&&t.type==="log") saveDraft(true); }

/* ---------- Logger-Entwurf ---------- */
let draftTimer=null;
function openDraft(exId,date){
  const existing=S.docs.get(logId(date,exId));
  const last=lastBefore(exId,date);
  let sets;
  if(existing&&existing.sets&&existing.sets.length) sets=existing.sets.map(s=>({w:inputVal(s.w),r:s.r==null?"":String(s.r)}));
  else { const tg=planTarget(date,exId); sets=Array.from({length:Math.max(tg&&tg.s?tg.s:last&&last.sets?last.sets.length:3,1)},()=>({w:"",r:""})); }
  S.draft={exId,date,sets,note:existing&&existing.note?existing.note:"",existed:!!existing};
}
function ghosts(){
  const d=S.draft, last=lastBefore(d.exId,d.date), lastSets=last?last.sets:[], tg=planTarget(d.date,d.exId);
  const out=[]; let prev=null;
  d.sets.forEach((s,i)=>{
    const own={w:parseNum(s.w),r:parseNum(s.r)};
    let g=lastSets[i]||prev||(lastSets.length?lastSets[lastSets.length-1]:null);
    if(tg&&(tg.w!=null||tg.r!=null)&&!(prev&&prev.own)) g={w:tg.w??(g?g.w:null),r:tg.r??(g?g.r:null)};
    out.push(g?{w:g.w,r:g.r}:{w:null,r:null});
    prev=(own.w!=null||own.r!=null)?{w:own.w??(g?g.w:null),r:own.r??(g?g.r:null),own:true}:(g||prev);
  });
  return out;
}
function draftSets(){ return S.draft.sets.map(s=>({w:parseNum(s.w),r:parseNum(s.r)})).filter(s=>s.w!=null||s.r!=null).map(s=>({w:s.w,r:s.r==null?null:Math.round(s.r)})); }
function scheduleSave(){ clearTimeout(draftTimer); draftTimer=setTimeout(()=>saveDraft(false),700); }
function saveDraft(final){
  clearTimeout(draftTimer);
  const d=S.draft; if(!d) return;
  const id=logId(d.date,d.exId), sets=draftSets(), note=d.note.trim();
  const cur=S.docs.get(id);
  if(!sets.length&&!note){ if(cur){ put(id,null); d.existed=false; } return; }
  const body={kind:"log",exId:d.exId,date:d.date,sets,note,updatedAt:Date.now()};
  if(cur&&JSON.stringify({s:cur.sets,n:cur.note||""})===JSON.stringify({s:sets,n:note})) return;
  put(id,body); d.existed=true;
}

/* ---------- Übungs-Editor ---------- */
function openExDraft(exId){
  const e=exId?ex(exId):null;
  S.exDraft=e?{id:e.id,name:e.name,groups:exGroups(e),settings:(e.settings||[]).map(s=>({k:s.k,v:s.v})),notes:e.notes||"",rest:e.rest}
            :{id:null,name:"",groups:[],settings:[],notes:""};
  S.exDraft.newGroup=null;
}
function createExercise(name,group,settings,notes){

function render(){

  if(t){
    if(t.type==="log"){ const e=ex(t.exId); title=e?e.name:"Übung"; html=viewLog(); }
    else if(t.type==="exercise"){ const e=ex(t.exId); title=e?e.name:"Übung"; html=viewExercise(t.exId); }

function exerciseList(list,act,sel){

  for(const e of filtered) for(const g of exGroups(e)){ if(!byGroup.has(g)) byGroup.set(g,[]); byGroup.get(g).push(e); }
  const ag=allGroups(), order=[...ag,...[...byGroup.keys()].filter(g=>!ag.includes(g))];
  const groups=order.filter(g=>byGroup.has(g)).map(g=>[g,byGroup.get(g)]);
  if(!q&&list.length>5&&act!=="openEx") groups.unshift(["Zuletzt verwendet oder angelegt",[...list].sort((a,b)=>recency(b)-recency(a)).slice(0,5)]);

    const l=logsFor(e.id)[0];

    const also=exGroups(e).filter(x=>x!==g);
    return `<button class="item" data-act="${act}" data-ex="${esc(e.id)}"${act==="planToggle"?` aria-pressed="${!!(sel&&sel.has(e.id))}"`:""}><div class="grow"><div class="name">${esc(e.name)}</div><div class="sub num">${esc(sub)}</div>${also.length?`<div class="sub">${allGroups().includes(g)?"Auch: ":""}${esc(also.join(" · "))}</div>`:""}${set?`<div class="sub">${esc(set)}</div>`:""}</div>${act==="planToggle"?(sel&&sel.has(e.id)?ICON.check.replace("<svg","<svg class=\"chk-on\""):ICON.plusItem):act==="pickEx"?ICON.plusItem:ICON.chev}</button>`;}).join("")}</div></div>`).join("");

function niceStep(range,count){ const raw=range/Math.max(1,count), mag=Math.pow(10,Math.floor(Math.log10(raw))), n=raw/mag; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*mag; }
function chartSvg(points,unit,label,sel){
  // points: [{date, v}] chronologisch
  const W=320,H=150,L=38,R=16,T=26,B=22;
  const vs=points.map(p=>p.v); let lo=Math.min(...vs), hi=Math.max(...vs);
  if(hi===lo){ hi+=unit==="kg"?5:2; lo=Math.max(0,lo-(unit==="kg"?5:2)); }
  if(unit!=="kg"&&hi-lo<3){ hi=Math.ceil(hi+1); lo=Math.max(0,Math.floor(lo-1)); }
  const step=unit==="kg"?niceStep(hi-lo,3):Math.max(1,Math.round(niceStep(hi-lo,3))); lo=Math.max(0,Math.floor(lo/step)*step); hi=Math.ceil(hi/step)*step;
  const x=i=>L+(points.length===1?(W-L-R)/2:(i*(W-L-R)/(points.length-1)));
  const y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  const pts=points.map((p,i)=>[x(i),y(p.v)]);
  const line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area=line+` L${pts[pts.length-1][0].toFixed(1)} ${H-B} L${pts[0][0].toFixed(1)} ${H-B} Z`;
  const ticks=[]; for(let v=lo; v<=hi+1e-9; v+=step) ticks.push(v);
  const si=sel!=null&&sel<points.length?sel:points.length-1;
  const sp=pts[si], sv=points[si];
  const tipText=`${fmtShort.format(toDate(sv.date))}  ${fmtNum(Math.round(sv.v*10)/10)}${unit?" "+unit:""}`;
  const tipW=tipText.length*6.2+14, tipX=Math.min(Math.max(sp[0]-tipW/2,L),W-R-tipW), tipY=Math.max(0,sp[1]-30);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}: Verlauf über ${points.length} Einheiten">
    ${ticks.map(t=>`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}"/><text x="${L-6}" y="${(y(t)+3).toFixed(1)}" text-anchor="end">${fmtNum(t)}</text>`).join("")}
    <path class="area" d="${area}"/><path class="line" d="${line}"/>
    ${pts.map((p,i)=>i===si?"":`<circle class="dot" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3"/>`).join("")}
    <circle class="sel" cx="${sp[0].toFixed(1)}" cy="${sp[1].toFixed(1)}" r="5.5"/>
    <rect class="tipbg" x="${tipX.toFixed(1)}" y="${tipY.toFixed(1)}" width="${tipW.toFixed(1)}" height="20" rx="6"/>
    <text class="tip" x="${(tipX+tipW/2).toFixed(1)}" y="${(tipY+14).toFixed(1)}" text-anchor="middle">${tipText}</text>
    <text x="${L}" y="${H-6}" text-anchor="start">${fmtShort.format(toDate(points[0].date))}</text>
    ${points.length>1?`<text x="${W-R}" y="${H-6}" text-anchor="end">${fmtShort.format(toDate(points[points.length-1].date))}</text>`:""}
    ${pts.map((p,i)=>`<circle class="hit" data-act="pt" data-i="${i}" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${Math.max(10,Math.min(18,(W-L-R)/Math.max(1,points.length-1)/2)).toFixed(1)}"><title>${fmtShort.format(toDate(points[i].date))}: ${fmtNum(Math.round(points[i].v*10)/10)} ${unit}</title></circle>`).join("")}
  </svg>`;
}
function logStats(l){
  const sets=l.sets||[]; let e=null, r=null;
  for(const s of sets){ const x=e1rm(s.w,s.r); if(x!=null&&(e==null||x>e)) e=x; if(s.r!=null&&(r==null||s.r>r)) r=s.r; }
  return {best:maxW(sets), e1rm:e, reps:r, volume:volume(sets)};
}
const METRICS={w:["Bestes Gewicht","kg","best"],e:["Geschätztes 1RM","kg","e1rm"],v:["Volumen","kg","volume"],r:["Beste Wiederholungen","Wdh.","reps"]};
function progressCard(hist){
  const hasW=hist.some(l=>maxW(l.sets||[])!=null);
  const P=S.prog; const metric=hasW?(P.metric==="r"?"w":P.metric):"r";
  const [label,unit,key]=METRICS[metric];
  const chrono=hist.slice(0,20).reverse().map(l=>({date:l.date,...logStats(l)}));
  const pts=chrono.filter(r=>r[key]!=null&&r[key]!==0).map(r=>({date:r.date,v:r[key]}));
  let h=`<div class="card chart"><div class="chart-top"><p class="eyebrow">Fortschritt</p>
    <div class="seg" role="group" aria-label="Ansicht"><button data-act="progView" data-v="chart" aria-pressed="${P.view==="chart"}">Grafik</button><button data-act="progView" data-v="table" aria-pressed="${P.view==="table"}">Tabelle</button></div></div>`;
  if(P.view==="chart"){
    if(hasW) h+=`<div class="chips small" style="margin-bottom:8px">${["w","e","v"].map(m=>`<button class="chip" data-act="progMetric" data-m="${m}" aria-pressed="${metric===m}">${METRICS[m][0]}</button>`).join("")}</div>`;
    if(pts.length>=2) h+=chartSvg(pts,unit,label,P.sel)+`<p class="hint" style="margin-top:4px">Tipp auf einen Punkt, um den Wert zu sehen.</p>`;
    else h+=`<p class="hint">Ab der zweiten Einheit siehst du hier deinen Fortschritt als Kurve.</p>`;
  } else {
    const rows=hist.slice(0,60).map(l=>({date:l.date,...logStats(l)}));
    h+=`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Datum</th>${hasW?`<th>Bestes Gew.</th><th>1RM</th><th>Volumen</th>`:`<th>Beste Wdh.</th>`}</tr></thead><tbody>${rows.map(r=>`<tr><td>${fmtShortY.format(toDate(r.date))}</td>${hasW?`<td class="b">${r.best!=null?fmtNum(r.best)+" kg":"–"}</td><td>${r.e1rm!=null?fmtNum(Math.round(r.e1rm))+" kg":"–"}</td><td>${r.volume?fmtNum(Math.round(r.volume))+" kg":"–"}</td>`:`<td class="b">${r.reps??"–"}</td>`}</tr>`).join("")}</tbody></table></div>`;
  }
  return h+`</div>`;
}

function viewExercise(exId){
  const e=ex(exId);
  if(!e) return `<p class="hint">Diese Übung wurde gelöscht.</p>`;
  const hist=logsFor(exId);

  const bestE=hist.reduce((m,l)=>{for(const s of l.sets||[]){const v=e1rm(s.w,s.r); if(v!=null&&(m==null||v>m)) m=v;} return m;},null);
  let h=`<div class="ex-head"><p class="eyebrow">${esc(groupsText(e))}</p>${settingsDl(e)}${e.notes?`<p class="muted" style="margin:0">${esc(e.notes)}</p>`:""}</div>

  <div class="stats">
    <div class="card stat"><b>${best!=null?fmtNum(best):"–"}</b><span>Bestes Gewicht (kg)</span></div>
    <div class="card stat"><b>${bestE!=null?fmtNum(Math.round(bestE)):"–"}</b><span>Geschätztes 1RM (kg)</span></div>
    <div class="card stat"><b>${hist.length}</b><span>Einheiten</span></div>
  </div>`;
  if(hist.length){
    h+=progressCard(hist);
    h+=`<button class="btn" data-act="report" data-ex="${esc(e.id)}">${ICON.doc}Fortschritt als PDF</button>`;
    h+=`<div class="group"><h3>Alle Einheiten</h3><div class="list hist">${hist.map(l=>`<button class="item" data-act="openLog" data-ex="${esc(e.id)}" data-date="${l.date}">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline"><span class="name">${relDay(l.date)}</span>${isPR(l)?'<span class="pr">Rekord</span>':`<span class="meta num">${volume(l.sets||[])?fmtNum(Math.round(volume(l.sets)))+" kg":""}</span>`}</div>
      ${setsLine(l.sets||[])}${l.note?`<div class="meta">${esc(l.note)}</div>`:""}</button>`).join("")}</div></div>`;
  } else h+=`<p class="hint">Noch keine Einheit eingetragen.</p>`;
  return h;
}

/* ---------- PDF-Bericht ---------- */
function rangeFrom(range){
  const d=toDate(todayStr());
  if(range==="4w") d.setDate(d.getDate()-27);
  else if(range==="3m") d.setMonth(d.getMonth()-3);
  else if(range==="6m") d.setMonth(d.getMonth()-6);
  else if(range==="12m") d.setFullYear(d.getFullYear()-1);
  else { const all=logs().map(l=>l.date).sort(); return all[0]||todayStr(); }
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
}
function reportSelection(){
  const R=S.rep, from=rangeFrom(R.range), to=todayStr();
  const exs=exercises().filter(e=>!R.exIds||R.exIds.has(e.id));
  const order=e=>{const i=allGroups().indexOf(exGroups(e)[0]);return i<0?99:i;};
  exs.sort((a,b)=>order(a)-order(b)||a.name.localeCompare(b.name,"de"));
  const items=exs.map(e=>({e,logs:logsFor(e.id).filter(l=>l.date>=from&&l.date<=to).reverse()})).filter(x=>x.logs.length);
  return {from,to,items};
}
function viewReport(){
  const R=S.rep;
  const withLogs=exercises().filter(e=>logsFor(e.id).length);
  const sel=reportSelection();

function logsByDate(){ const m=new Map(); for(const l of logs()){ if(!m.has(l.date)) m.set(l.date,[]); m.get(l.date).push(l); } return m; }
function calendarCard(byDate){
  if(!S.cal){ const n=new Date(); S.cal={y:n.getFullYear(),m:n.getMonth()}; }
  const {y,m}=S.cal, today=todayStr(), now=new Date();
  const first=new Date(y,m,1), days=new Date(y,m+1,0).getDate(), lead=(first.getDay()+6)%7;
  const atMax=(y*12+m)>=(now.getFullYear()*12+now.getMonth()+12);
  let cells="";
  for(let i=0;i<lead;i++) cells+=`<span class="cal-day out" aria-hidden="true"></span>`;
  let trained=0, planned=0; const mode=calMode(), used=new Map(); let noType=0;
  for(let d=1; d<=days; d++){
    const ds=y+"-"+pad(m+1)+"-"+pad(d), ls=byDate.get(ds), fut=ds>today, t=dayType(ds), doc=dayDoc(ds);
    if(!fut&&(ls||t)) trained++; if(fut&&doc) planned++;
    const cls=["cal-day"]; let inner=String(d);
    if(mode==="type"){
      if(t){ cls.push("ty","ty-"+t.c); inner=`${d}<small>${esc(t.a)}</small>`; used.set(t.k,(used.get(t.k)||0)+1); }
      else if(ls){ cls.push("none"); noType++; }
    } else if(ls) cls.push("l"+dayLevel(ls));
    if(ds===today) cls.push("today"); if(fut) cls.push(doc?"plan":"future");
    const label=`${d}. ${fmtMonth.format(first).split(" ")[0]}${t?`, ${t.n}`:""}${fut?(doc?", geplant":", noch nichts geplant"):ls?`, ${ls.length} ${ls.length===1?"Übung":"Übungen"}`:t?"":", kein Training"}`;
    cells+=`<button class="${cls.join(" ")}" data-act="day" data-date="${ds}" aria-label="${esc(label)}">${inner}</button>`;
  }
  const legend=mode==="type"
    ?`<span class="legend">${allTypes().filter(t=>used.has(t.k)).map(t=>`<span class="legend ty-${t.c}"><i class="ty"></i>${esc(t.n)} ${used.get(t.k)}×</span>`).join("")}${noType?`<span class="legend"><i class="none"></i>Ohne Art ${noType}×</span>`:""}${planned?`<span class="legend"><i class="plan"></i>Geplant ${planned}×</span>`:""}${!used.size&&!noType&&!planned?"Noch keine Trainingsart vergeben":""}</span>`
    :`<span class="legend">Sätze <i class="l1"></i>1–7 <i class="l2"></i>8–15 <i class="l3"></i>16+${planned?` <i class="plan"></i>Geplant`:""}</span>`;
  return `<div class="card cal">
    <div class="cal-head"><button class="cal-nav" data-act="calMove" data-d="-1" aria-label="Vorheriger Monat">${ICON_L}</button><h3>${esc(fmtMonth.format(first))}</h3><button class="cal-nav" data-act="calMove" data-d="1" aria-label="Nächster Monat" ${atMax?"disabled":""}>${ICON_R}</button></div>
    <div class="cal-grid">${["Mo","Di","Mi","Do","Fr","Sa","So"].map(w=>`<span class="wd">${w}</span>`).join("")}${cells}</div>
    <div class="cal-foot"><span class="num"><b>${trained}</b> ${trained===1?"Trainingstag":"Trainingstage"}</span>
      <div class="seg" role="group" aria-label="Farbe nach"><button data-act="calMode" data-v="type" aria-pressed="${mode==="type"}">Trainingsart</button><button data-act="calMode" data-v="sets" aria-pressed="${mode==="sets"}">Sätze</button></div></div>
    <div class="cal-foot" style="margin-top:8px">${legend}</div>
  </div>`;
}

function viewHistory(){
  const byDate=logsByDate();
  if(!byDate.size) return calendarCard(byDate)+`<div class="card empty"><h3>Noch kein Training</h3><p class="muted">Sobald du Sätze einträgst, werden deine Trainingstage im Kalender farbig markiert. Tipp auf einen Tag, um das Training zu sehen oder nachzutragen.</p><button class="btn primary" data-act="tab" data-tab="today">Zum Training</button></div>`;
  const {y,m}=S.cal||{y:new Date().getFullYear(),m:new Date().getMonth()};
  let h=calendarCard(byDate);
  const prefix=y+"-"+pad(m+1)+"-";
  const today=todayStr();
  const plans=[...S.docs.values()].filter(d=>d&&d.kind==="day"&&d.date>today&&d.date.startsWith(prefix)).sort((a,b)=>a.date.localeCompare(b.date));
  if(plans.length) h+=`<div class="group"><h3>Geplant</h3><div class="list">${plans.map(d=>{const names=planIds(d.date).map(id=>ex(id).name);
    return `<button class="item" data-act="day" data-date="${d.date}"><div class="grow"><div class="name" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${esc(relDay(d.date))}${dayDiff(d.date)>-7?` · ${esc(fmtShort.format(toDate(d.date)))}`:""} ${typeBadge(d.date)}</div><div class="sub">${names.length?esc(names.join(", ")):esc(d.note||"Noch keine Übungen eingeplant")}</div></div>${ICON.chev}</button>`;}).join("")}</div></div>`;

  if(!dates.length) return h+(plans.length?"":`<p class="hint">In diesem Monat gibt es keine Trainings. Tipp auf einen vergangenen Tag, um ein Training nachzutragen, oder auf einen kommenden Tag, um es zu planen.</p>`);
  return h+dates.map(date=>{
    const ls=byDate.get(date).sort((a,b)=>(a.updatedAt||0)-(b.updatedAt||0));
    const vol=ls.reduce((a,l)=>a+volume(l.sets||[]),0);
    const label=dayDiff(date)<7?relDay(date):fmtLong.format(toDate(date));
    return `<section class="day"><h3><span style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><button class="btn ghost" data-act="day" data-date="${date}" style="padding:0;min-height:0;font:inherit;color:inherit;text-transform:inherit">${esc(label)}</button>${typeBadge(date)}</span><small class="num">${ls.length} ${ls.length===1?"Übung":"Übungen"}${vol?` · ${fmtNum(Math.round(vol))} kg`:""}</small></h3>${dayList(date,ls)}</section>`;
  }).join("");
}
function viewDay(date){
  const ls=(logsByDate().get(date)||[]).sort((a,b)=>(a.updatedAt||0)-(b.updatedAt||0));
  const fut=date>todayStr(), doc=dayDoc(date);
  let h=`<div class="date-head"><p class="eyebrow">${esc(fut?"Planen · "+relDay(date):relDay(date))}</p><h2>${esc(fmtLong.format(toDate(date)))}</h2></div>`+typePicker(date);
  if(fut){
    h+=planEditor(date);
    if(doc) h+=`<div class="btn-row"><button class="btn" data-act="copyPlan" data-date="${date}">Eine Woche später wiederholen</button><button class="btn" data-act="clearPlan" data-date="${date}">Plan löschen</button></div>
      <p class="hint">Am Tag selbst siehst du den Plan im Reiter „Training“ und kannst die Übungen direkt eintragen.</p>`;
    else h+=`<p class="hint">Wähle eine Trainingsart und/oder Übungen. Der Tag erscheint dann im Kalender als geplant (gestrichelt).</p>`;
    return h;
  }
  const loggedIds=new Set(ls.map(l=>l.exId));
  const planned=plannedList(date,loggedIds);
  const editPlan=date===todayStr()?`<details class="plan-edit"${S.planOpen?" open":""}><summary>${planIds(date).length?"Plan bearbeiten":"Übungen für heute planen"}</summary><div class="stack">${planEditor(date)}</div></details>`:"";
  if(!ls.length) return h+planned+(planned?`<button class="btn" data-act="pickFor" data-date="${date}">${ICON.plus}Andere Übung eintragen</button>`:`<div class="card empty"><h3>Kein Training an diesem Tag</h3><p class="muted">Hast du trainiert und es nur nicht eingetragen? Dann kannst du es hier nachtragen.</p><button class="btn primary" data-act="pickFor" data-date="${date}">${ICON.plus}Training nachtragen</button></div>`)+editPlan;
  const sets=ls.reduce((a,l)=>a+(l.sets||[]).length,0), vol=ls.reduce((a,l)=>a+volume(l.sets||[]),0);
  h+=`<p class="meta num">${ls.length} ${ls.length===1?"Übung":"Übungen"} · ${sets} ${sets===1?"Satz":"Sätze"}${vol?` · ${fmtNum(Math.round(vol))} kg Volumen`:""}</p>`;
  h+=dayList(date,ls)+planned;
  h+=`<button class="btn primary big" data-act="dayPdf" data-date="${date}">${ICON.doc}Diesen Tag als PDF</button>
  <button class="btn" data-act="pickFor" data-date="${date}">${ICON.plus}Übung zu diesem Tag hinzufügen</button>`+editPlan;
  return h;
}
function makeDayPdf(date){
  const ls=(logsByDate().get(date)||[]).sort((a,b)=>(a.updatedAt||0)-(b.updatedAt||0));
  const t=dayType(date);
  const model={date,typeName:t?t.n:"",dateLong:new Intl.DateTimeFormat("de-DE",{weekday:"long",day:"numeric",month:"long",year:"numeric"}).format(toDate(date)),created:todayStr(),
    exercises:ls.map(l=>{const e=ex(l.exId)||{name:"Gelöschte Übung"}; return {name:e.name,group:e.kind?groupsText(e):"",settingsLine:(e.settings||[]).filter(x=>x.k||x.v).map(x=>`${x.k} ${x.v}`.trim()).join(" · "),note:l.note||"",sets:l.sets||[]};})};
  const bytes=window.GymReport.buildDay(model);
  return {blob:new Blob([bytes],{type:"application/pdf"}),name:`gym-logbuch-training-${date}.pdf`};
}

  const standalone=window.matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
  const install=standalone?"":`<div class="card panel"><h3>Als App installieren</h3>

  const restCard=`<div class="card panel"><h3>Pausentimer</h3>

    <div class="switch-row"><span>Standard-Pause</span><button class="pause-chip" data-act="restPick">${ICON.clock}${fmtClock(rc.def)}</button></div>
    ${sw("sound","Ton am Ende")}
    ${"vibrate" in navigator?sw("vib","Vibration am Ende"):""}
    <p class="hint">Pro Übung kannst du im Eintragen-Bildschirm über „Pause“ eine eigene Zeit wählen oder den Timer ausschalten.${/iPhone|iPad/.test(navigator.userAgent)?" Auf dem iPhone ist der Ton im Lautlos-Modus stumm, und Vibration gibt es leider nicht.":""}</p>
    <div><button class="btn" data-act="restTest">Ton testen</button></div></div>`;
  const pdfCard=lgCount?`<div class="card panel"><h3>Fortschritt als PDF</h3><p class="muted">Kurven und Tabellen für alle oder einzelne Übungen, zum Speichern, Ausdrucken oder Weiterschicken.</p><div><button class="btn primary" data-act="report">${ICON.doc}PDF-Bericht erstellen</button></div></div>`:"";
  const cts=customTypes();
  const ctCard=`<div class="card panel"><h3>Eigene Trainingsarten</h3>${cts.length?cts.map(t=>`<div class="ct-row"><div class="top"><input class="input" id="ct-${esc(t.k)}" data-field="ctname" data-k="${esc(t.k)}" value="${esc(t.n)}" maxlength="24" aria-label="Name"><button class="btn danger${S.armedCt===t.k?" armed":""}" data-act="ctDel" data-k="${esc(t.k)}">${S.armedCt===t.k?"Wirklich?":"Löschen"}</button></div><div class="swatches">${DAY_TYPES.map(d=>`<button class="swatch ty-${d.c}" data-act="ctColor" data-k="${esc(t.k)}" data-c="${d.c}" aria-pressed="${t.c===d.c}" aria-label="${COLOR_NAMES[d.c]}"></button>`).join("")}</div></div>`).join(""):`<p class="muted">Leg eigene Arten wie „Po“ oder „Arme“ direkt beim Auswählen der Trainingsart über „+ Eigene Art“ an. Hier kannst du sie danach umbenennen, umfärben oder löschen.</p>`}</div>`;
  return `${install}${restCard}${pdfCard}${ctCard}<div class="card panel"><h3>Speicherort</h3>${status}<p class="meta num">${exCount} Übungen · ${lgCount} eingetragene Einheiten</p></div>
  <div class="card panel"><h3>Backup</h3><p class="muted">Sichert alle Übungen, Einstellungen und Einheiten in einer Datei. Damit nimmst du dein Logbuch auf ein neues Handy mit. Ein Backup aus der Claude-Version kannst du hier auch importieren.</p>
    <div class="btn-row"><button class="btn" data-act="export">Backup exportieren</button><button class="btn" data-act="import">Backup importieren</button></div>
  </div>
  <p class="hint">Gym-Logbuch · Version ${APP_VERSION}</p>`;
}

document.addEventListener("click",ev=>{
  const b=ev.target.closest("[data-act]"); if(!b) return;
  const a=b.dataset.act;
  switch(a){
    case "tab": setTab(b.dataset.tab); break;
    case "back": pop(); break;
    case "pick": push({type:"pick"}); break;
    case "pickEx": replace({type:"log",exId:b.dataset.ex,date:top().date||todayStr()}); break;
    case "openLog": push({type:"log",exId:b.dataset.ex,date:b.dataset.date}); break;
    case "openEx": push({type:"exercise",exId:b.dataset.ex}); break;
    case "newEx": push({type:"editEx",exId:null,thenLog:S.tab==="today"}); break;
    case "newExLog": replace({type:"editEx",exId:null,thenLog:true,date:top().date||null}); break;
    case "editEx": push({type:"editEx",exId:b.dataset.ex}); break;
    case "preset": {
      const [n,g]=PRESETS[+b.dataset.i];
      const found=exercises().find(e=>e.name===n);
      const id=found?found.id:createExercise(n,g,[],"");
      if(top()&&top().type==="pick") replace({type:"log",exId:id,date:top().date||todayStr()}); else push({type:"log",exId:id,date:todayStr()});
      break;
    }
    case "fill": {
      const i=+b.dataset.i, s=S.draft.sets[i], g=ghosts()[i];
      if(parseNum(s.w)==null&&parseNum(s.r)==null){
        if(g.w==null&&g.r==null){ $("#w-"+i).focus(); return; }
        s.w=inputVal(g.w); s.r=g.r==null?"":String(g.r);
      } else { if(parseNum(s.w)==null&&g.w!=null) s.w=inputVal(g.w); if(parseNum(s.r)==null&&g.r!=null) s.r=String(g.r); }
      saveDraft(false); render();
      { const e=ex(S.draft.exId), secs=e?restFor(e):0; if(secs&&restCfg().auto){ const n=S.draft.sets.length; Rest.start(secs, i+1<n?`Weiter mit Satz ${i+2}`:"Weiter mit der nächsten Übung", e.name); } }
      break;
    }
    case "addSet": S.draft.sets.push({w:"",r:""}); render(); setTimeout(()=>{const el=$("#w-"+(S.draft.sets.length-1)); el&&el.scrollIntoView({block:"center",behavior:"smooth"});},30); break;
    case "rmSet": S.draft.sets.pop(); saveDraft(false); render(); break;
    case "doneLog": {
      saveDraft(true);
      const has=draftSets().length; pop(); if(has) toast("Gespeichert"); break;
    }
    case "group": { const G=S.exDraft.groups, g=b.dataset.g, i=G.indexOf(g); if(i>=0) G.splice(i,1); else G.push(g); render(); break; }
    case "groupNew": S.exDraft.newGroup=""; render(); setTimeout(()=>{const el=$("#newgroup"); el&&el.focus();},30); break;
    case "groupAdd": {
      const n=(S.exDraft.newGroup||"").trim(); if(!n){ $("#newgroup").focus(); return; }
      const hit=allGroups().find(g=>g.toLowerCase()===n.toLowerCase());
      if(!hit) saveCfg({groups:[...customGroups(),n]});
      const g=hit||n; if(!S.exDraft.groups.includes(g)) S.exDraft.groups.push(g);
      S.exDraft.newGroup=null; render(); break;
    }
    case "addSetting": S.exDraft.settings.push({k:b.dataset.k,v:""}); render(); setTimeout(()=>{const i=S.exDraft.settings.length-1; const el=$((b.dataset.k?"#sv-":"#sk-")+i); el&&el.focus();},30); break;
    case "rmSetting": S.exDraft.settings.splice(+b.dataset.i,1); render(); break;
    case "noop": break;
    case "restPick": openRestSheet(b.dataset.ex||null); break;
    case "sheetPick": S.sheet.val=+b.dataset.v; renderSheet(true); break;
    case "sheetCancel": closeSheet(); break;
    case "sheetOk": {
      const sh=S.sheet;
      if(sh.exId){ const cur=S.docs.get(sh.exId); if(cur) put(sh.exId,{...cur,rest:sh.val,updatedAt:Date.now()}); }
      else saveRestCfg({def:sh.val||90, on:sh.val>0||restCfg().on});
      closeSheet(); render(); toast(sh.val?`Pause ${fmtClock(sh.val)}`:"Pausentimer für diese Übung aus"); break;
    }
    case "sheetStart": { const sh=S.sheet; const e=sh.exId?ex(sh.exId):null; closeSheet(); if(sh.val) Rest.start(sh.val,"Pause vorbei",e?e.name:""); break; }
    case "restAdd": Rest.add(+b.dataset.s); break;
    case "restStop": Rest.stop(); break;
    case "restSet": { const k=b.dataset.k, c=restCfg(); saveRestCfg({[k]:!c[k]}); if(k==="sound"&&!c.sound) Rest.test(); render(); break; }
    case "restTest": Rest.test(); break;
    case "useExisting": finishWithExercise(b.dataset.ex,false); break;
    case "usePreset": { const [n,g]=PRESETS[+b.dataset.i]; finishWithExercise(createExercise(n,g,[],""),true); break; }
    case "saveEx": {
      const d=S.exDraft, name=d.name.trim();
      if(!name){ toast("Gib der Übung einen Namen"); $("#exname").focus(); return; }
      const settings=d.settings.map(s=>({k:s.k.trim(),v:s.v.trim()})).filter(s=>s.k||s.v);
      let id=d.id;
      const groups=d.groups.length?[...d.groups]:["Sonstiges"];
      if(id){ const cur=S.docs.get(id); put(id,{...cur,name,group:groups[0],groups,settings,notes:d.notes.trim(),updatedAt:Date.now()}); pop(); toast("Übung gespeichert"); break; }
      const dup=exercises().find(e=>e.name.trim().toLowerCase()===name.toLowerCase());
      if(dup){ toast(`„${dup.name}“ gibt es schon – wird verwendet`); finishWithExercise(dup.id,false); break; }
      id=createExercise(name,groups,settings,d.notes.trim());
      finishWithExercise(id,true);
      break;
    }
    case "delEx": {
      if(!S.armedDelete){ S.armedDelete=true; render(); return; }
      const id=S.exDraft.id;
      for(const l of logsFor(id)) put(l.id,null);
      put(id,null);
      S.stack=[]; S.tab="exercises"; render(); toast("Übung gelöscht"); break;
    }
    case "export": exportBackup(); break;
    case "pt": S.prog.sel=+b.dataset.i; render(); break;
    case "setType": setDayType(b.dataset.date,b.dataset.k); render(); break;
    case "planAdd": S.planOpen=true; push({type:"planPick",date:b.dataset.date}); break;
    case "planToggle": { const d=top().date, id=b.dataset.ex, items=planItems(d); const i=items.findIndex(x=>x.id===id); if(i>=0) items.splice(i,1); else items.push({id}); savePlan(d,items); render(); break; }
    case "planRm": { const d=b.dataset.date, items=planItems(d); items.splice(+b.dataset.i,1); savePlan(d,items); const open=!!document.querySelector("details.plan-edit[open]"); render(); if(open){ const dt=document.querySelector("details.plan-edit"); if(dt) dt.open=true; } break; }
    case "newExPlan": push({type:"editEx",exId:null,thenPlan:b.dataset.date}); break;
    case "presetPlan": { const [n,g]=PRESETS[+b.dataset.i]; const found=exercises().find(e=>e.name===n); const id=found?found.id:createExercise(n,g,[],""); addToPlan(b.dataset.date,id); render(); break; }
    case "typeNew": { const used=new Set(customTypes().map(t=>t.c)); S.typeForm={date:b.dataset.date,name:"",c:(DAY_TYPES.find(t=>!used.has(t.c))||DAY_TYPES[7]).c}; render(); setTimeout(()=>{const el=$("#tf-name"); el&&el.focus();},30); break; }
    case "tfColor": S.typeForm.c=b.dataset.c; render(); break;
    case "tfCancel": S.typeForm=null; render(); break;
    case "tfSave": {
      const F=S.typeForm, name=(F.name||"").trim();
      if(!name){ toast("Gib der Trainingsart einen Namen"); $("#tf-name").focus(); return; }
      const existing=allTypes().find(t=>t.n.toLowerCase()===name.toLowerCase());
      let k=existing?existing.k:"c_"+Date.now().toString(36);
      if(!existing) saveCfg({types:[...customTypes(),{k,n:name,a:abbr(name),c:F.c}]});
      S.typeForm=null; saveDay(b.dataset.date,{type:k}); toast(existing?`„${existing.n}“ gibt es schon – ausgewählt`:`„${name}“ angelegt`); render(); break;
    }
    case "ctColor": { const types=customTypes().map(t=>t.k===b.dataset.k?{...t,c:b.dataset.c}:t); saveCfg({types}); render(); break; }
    case "ctDel": {
      if(S.armedCt!==b.dataset.k){ S.armedCt=b.dataset.k; render(); return; }
      S.armedCt=null; saveCfg({types:customTypes().filter(t=>t.k!==b.dataset.k)}); toast("Trainingsart gelöscht"); render(); break;
    }
    case "copyPlan": { const d=b.dataset.date, src=dayDoc(d); if(!src) return; const n=addDays(d,7); saveDay(n,{type:src.type||null,note:src.note||""}); savePlan(n,planItems(d)); toast(`Für ${fmtWeekday.format(toDate(n))}, ${fmtShort.format(toDate(n))} übernommen`); break; }
    case "clearPlan": put("dy_"+b.dataset.date,null); toast("Plan gelöscht"); render(); break;
    case "calMode": { const c=S.docs.get("cfg")||{kind:"settings"}; put("cfg",{...c,kind:"settings",calMode:b.dataset.v,updatedAt:Date.now()}); render(); break; }
    case "calMove": { const c=S.cal, d=new Date(c.y,c.m+(+b.dataset.d),1); S.cal={y:d.getFullYear(),m:d.getMonth()}; render(); break; }
    case "day": push({type:"day",date:b.dataset.date}); break;
    case "pickFor": push({type:"pick",date:b.dataset.date}); break;
    case "dayPdf": {
      try{
        const r=makeDayPdf(b.dataset.date); saveBlob(r.blob,r.name); toast("PDF gespeichert");
      }catch(e){ console.error(e); toast("PDF konnte nicht erstellt werden"); }
      break;
    }
    case "progView": S.prog.view=b.dataset.v; render(); break;
    case "progMetric": S.prog.metric=b.dataset.m; S.prog.sel=null; render(); break;
    case "report": push({type:"report",exId:b.dataset.ex||null}); break;
    case "repRange": S.rep.range=b.dataset.k; S.rep.result=null; render(); break;
    case "repAll": S.rep.exIds=null; S.rep.result=null; render(); break;
    case "repEx": {
      const id=b.dataset.ex, R=S.rep;
      if(!R.exIds) R.exIds=new Set([id]); else if(R.exIds.has(id)){ R.exIds.delete(id); if(!R.exIds.size) R.exIds=null; } else R.exIds.add(id);
      R.result=null; render(); break;
    }
    case "repPart": { const R=S.rep, k=b.dataset.k, other=k==="chart"?"table":"chart"; if(R[k]&&!R[other]) { toast("Mindestens Grafik oder Tabelle"); return; } R[k]=!R[k]; R.result=null; render(); break; }
    case "repMake": {
      if(S.rep.busy) return;
      S.rep.busy=true; render();
      setTimeout(()=>{
        try{ const res=makeReport(); S.rep.result=res; saveBlob(res.blob,res.name); toast("PDF erstellt"); }
        catch(e){ console.error(e); toast("PDF konnte nicht erstellt werden"); }
        S.rep.busy=false; render();
      },30);
      break;
    }
    case "repSave": if(S.rep.result) saveBlob(S.rep.result.blob,S.rep.result.name); break;
    case "repShare": {
      const r=S.rep.result; if(!r) return;
      navigator.share({files:[new File([r.blob],r.name,{type:"application/pdf"})],title:"Fortschrittsbericht"}).catch(()=>{});
      break;
    }
    case "import": $("#importFile").click(); break;
    case "install": if(installPrompt){ installPrompt.prompt(); installPrompt.userChoice.finally(()=>{ installPrompt=null; render(); }); } break;
    case "update": if(waitingWorker) waitingWorker.postMessage("skipWaiting"); break;
  }
});

document.addEventListener("input",ev=>{
  const el=ev.target, f=el.dataset&&el.dataset.field; if(!f) return;
  if(f==="w"||f==="r"){
    const i=+el.dataset.i; S.draft.sets[i][f]=el.value;
    const s=S.draft.sets[i]; const row=el.closest(".set-row");
    row.classList.toggle("filled",parseNum(s.w)!=null||parseNum(s.r)!=null);
    // Vorschläge der folgenden Sätze aktualisieren
    const g=ghosts();
    for(let j=i+1;j<S.draft.sets.length;j++){ const w=$("#w-"+j), r=$("#r-"+j); if(w) w.placeholder=g[j].w!=null?inputVal(g[j].w):"–"; if(r) r.placeholder=g[j].r!=null?g[j].r:"–"; }
    scheduleSave();
  }
  else if(f==="note"){ S.draft.note=el.value; scheduleSave(); }
  else if(f==="query"){ S.query=el.value; const list=$("#exlist"); if(list){ const t=top(); list.innerHTML=t&&t.type==="planPick"?exerciseList(exercises(),"planToggle",new Set(planIds(t.date))):exerciseList(exercises(),t&&t.type==="pick"?"pickEx":"openEx"); } }
  else if(f==="plannote") saveDay(el.dataset.date,{note:el.value});
  else if(f==="pt"){ const items=planItems(el.dataset.date), it=items[+el.dataset.i]; if(it){ const k=el.dataset.k, v=parseNum(el.value); it[k]=v==null?null:(k==="w"?v:Math.max(0,Math.round(v))); savePlan(el.dataset.date,items); } }
  else if(f==="tfname"){ if(S.typeForm) S.typeForm.name=el.value; }
  else if(f==="ctname"){ const n=el.value.trim(); if(n){ saveCfg({types:customTypes().map(t=>t.k===el.dataset.k?{...t,n,a:abbr(n)}:t)}); } }
  else if(f==="newgroup"){ S.exDraft.newGroup=el.value; }
  else if(f==="exname"){ S.exDraft.name=el.value; const box=$("#nameSugg"); if(box) box.innerHTML=nameSuggestions(el.value); }
  else if(f==="exnotes") S.exDraft.notes=el.value;
  else if(f==="sk") S.exDraft.settings[+el.dataset.i].k=el.value;
  else if(f==="sv") S.exDraft.settings[+el.dataset.i].v=el.value;
});

// Enter im Gewichtsfeld springt zu Wiederholungen, dann zum nächsten Satz
document.addEventListener("keydown",ev=>{
  if(ev.key!=="Enter") return;
  const el=ev.target, f=el.dataset&&el.dataset.field;
  if(f==="newgroup"){ ev.preventDefault(); const b=document.querySelector('[data-act="groupAdd"]'); b&&b.click(); return; }
  if(f==="w"){ ev.preventDefault(); const r=$("#r-"+el.dataset.i); r&&r.focus(); }
  else if(f==="r"){ ev.preventDefault(); const n=$("#w-"+(+el.dataset.i+1)); n?n.focus():el.blur(); }
});
