      const a={id:D.id||Date.now().toString(36),k:D.k,v:D.v|0,min};
      const km=parseNum(D.km); if(km>0) a.km=Math.round(km*100)/100;
      const hr=parseNum(D.hr); if(hr>=40&&hr<=230) a.hr=Math.round(hr);
      if(D.k==="other"&&D.name&&D.name.trim()) a.name=D.name.trim().slice(0,30);
      if(ACT_BY[D.k].spm&&D.phone===false) a.phone=false;
      const L=[...dayActs(t.date)]; if(t.i!=null&&L[t.i]) L[t.i]=a; else L.push(a);
      saveDay(t.date,{acts:L}); S.actDraft=null; pop(); toast(`${actName(a)} gespeichert`); break;
    }
    case "actDel": { const t=top(); if(!S.armedAct){ S.armedAct=true; render(); return; } S.armedAct=false; const L=dayActs(t.date).filter((_,i)=>i!==t.i); saveDay(t.date,{acts:L}); S.actDraft=null; pop(); toast("Aktivität gelöscht"); break; }
    case "foodApp": { const v=b.dataset.v; saveCfg({foodApp:foodApp()===v?"":v}); render(); break; }
    case "foodImport": $("#foodFile").click(); break;
    case "kcalToggle": { const dEl=b.closest("details"); S.kcalOpen=dEl?!dEl.open:false; break; }
    case "bwSkip": saveCfg({bwSkip:todayStr()}); render(); break;
    case "stepsStart": Steps.start().then(ok=>{ if(ok){ toast("Schritte werden gezählt, solange die App offen ist"); render(); } }); break;
    case "stepsStop": Steps.stop(); toast("Schritte gespeichert"); render(); break;
    case "askWeight": saveCfg({askWeight:!askWeight()}); render(); break;
    case "applyOpen": push({type:"applyPick",date:b.dataset.date}); break;
    case "applyDay": case "applyTpl": {
      const d=top().date; let items, types;
      if(a==="applyDay"){ items=itemsFromDay(b.dataset.src); types=dayTypeKeys(dayDoc(b.dataset.src)); }
      else { const t=S.docs.get(b.dataset.id); if(!t) return; items=t.items||[]; types=t.types||[]; put(b.dataset.id,{...t,usedAt:Date.now()}); }
      const r=applyItems(d,items,types); pop();
      if(d===todayStr()&&top()==null) render();
      toast(`${r.total} ${r.total===1?"Übung":"Übungen"} übernommen`); break;
    }
    case "tplNew": S.tplForm={date:b.dataset.date,name:defaultTplName(b.dataset.date)}; render(); setTimeout(()=>{const el=$("#tpl-name"); if(el){ el.focus(); el.select(); }},30); break;
    case "tplCancel": S.tplForm=null; render(); break;
    case "tplSave": {

      if(!items.length){ toast("An diesem Tag gibt es keine Übungen"); return; }
      const existing=templates().find(t=>t.name.toLowerCase()===name.toLowerCase());
      const id=existing?existing.id:rid("tp");
      put(id,{kind:"tpl",name,types:dayTypeKeys(dayDoc(d)),items,createdAt:existing?existing.createdAt:Date.now(),updatedAt:Date.now()});
      S.tplForm=null; toast(existing?`„${name}“ aktualisiert`:`Einheit „${name}“ gespeichert`); render(); break;
    }
    case "tplDel": { if(S.armedTpl!==b.dataset.id){ S.armedTpl=b.dataset.id; render(); return; } S.armedTpl=null; put(b.dataset.id,null); toast("Einheit gelöscht"); render(); break; }
    case "planFlat": { const d=b.dataset.date, items=planItems(d), it=items[+b.dataset.i]; if(it&&it.sets){ const f=it.sets[0]||{}; it.s=it.sets.length; it.r=f.r??null; it.w=f.w??null; delete it.sets; savePlan(d,items); render(); } break; }
    case "finish": { const d=b.dataset.date; Rest.stop(); saveDay(d,{done:Date.now()}); S.bodyYaw=null; const t=top(); if(t&&t.type==="finish") render(); else push({type:"finish",date:d}); window.scrollTo(0,0);
      if(wxOn()) fetchWeather(d).then(w=>{ const tt=top(); if(w&&tt&&tt.type==="finish"&&tt.date===d) render(); }); break; }
    case "wxToggle": {
      const on=!wxOn(); saveCfg({weather:{on}}); S.wxError=null; render();
      if(on){ S.wxBusy=true; render(); fetchWeather(todayStr(),true).then(w=>{ S.wxBusy=false; S.wxTest=w; if(!w) toast(S.wxError==="denied"?"Standort nicht erlaubt":"Wetter gerade nicht abrufbar"); render(); }); }
      break;

    case "finishView": S.bodyYaw=null; push({type:"finish",date:b.dataset.date}); break;
    case "finishClose": setTab("today"); break;
    case "unfinish": { const d=b.dataset.date; saveDay(d,{done:null}); toast("Training läuft weiter"); const t=top(); if(t&&t.type==="finish"&&d===todayStr()) setTab("today"); else render(); break; }
    case "pfSex": { const v=b.dataset.v, p=profile(); saveProfile({sex:p.sex===v?null:v}); render(); break; }
    case "pfModel": saveProfile({model:b.dataset.v}); render(); break;
    case "ibNew": S.ibForm={src:b.dataset.src==="fh"?"fh":"ib",date:todayStr(),weight:"",smm:"",fatMass:"",pbf:"",bmr:"",ffm:"",visc:""}; render(); break;
    case "evalOpen": openEvalSheet(b.dataset.id); break;
    case "evalClose": closeEvalSheet(); break;
    case "goalPick": { const v=b.dataset.v, g=goal(), T=g?[...g.types]:[];
      if(T.includes(v)){ const L=T.filter(x=>x!==v); if(L.length) saveGoal({types:L}); else saveCfg({goal:null}); render(); break; }
      const off=T.filter(x=>(GOAL_CONFLICT[v]||[]).includes(x)); const L=[...T.filter(x=>!off.includes(x)),v];
      saveGoal({types:L,date:g?g.date:"",targets:g?g.targets:{}}); render(); if(off.length) toast(off.length===1&&["muscle","hold"].includes(v)&&["muscle","hold"].includes(off[0])?(v==="muscle"?"Muskelaufbau schließt den Muskelerhalt schon mit ein":"Statt Muskelaufbau jetzt: Muskeln erhalten"):`${GOAL_BY[v].n} passt nicht zu ${off.map(x=>GOAL_BY[x].n).join(" und ")}, das habe ich abgewählt`); break; }
    case "csvCancel": S.csvPending=null; render(); break;
    case "csvSrc": { const src=b.dataset.v, rows=S.csvPending||[]; S.csvPending=null; let last=null;
      for(const m of rows){ const id=(src==="fh"?"fh_":"ib_")+m.date, cur=S.docs.get(id); put(id,{...(cur||{}),...m,src,kind:"inbody",updatedAt:Date.now()}); if(!last||m.date>last.date) last={id,date:m.date}; }
      toast(`${rows.length} ${rows.length===1?"Messung":"Messungen"} importiert`); render(); if(last) openEvalSheet(last.id); break; }
    case "ibCancel": S.ibForm=null; render(); break;
    case "ibSave": {
      const F=S.ibForm, d=parseDateAny(F.date)||F.date;
      if(!/^\d{4}-\d{2}-\d{2}$/.test(d)){ toast("Datum bitte als TT.MM.JJJJ eingeben"); return; }
      const src=F.src==="fh"?"fh":"ib", m={kind:"inbody",src,date:d,updatedAt:Date.now()}; for(const k of ["weight","smm","fatMass","pbf","bmr","ffm","visc"]){ const v=parseNum(F[k]); if(v!=null&&v>0) m[k]=v; }
      if(Object.keys(m).length<=4){ toast("Trag mindestens einen Messwert ein"); return; }

    case "ibDel": { if(S.armedIb!==b.dataset.id){ S.armedIb=b.dataset.id; render(); return; } S.armedIb=null; put(b.dataset.id,null); toast("Messung gelöscht"); render(); break; }
    case "ibImport": $("#inbodyFile").click(); break;
    case "layoutPreset": saveCfg({layout:b.dataset.v.split(",")}); render(); toast("Layout gespeichert"); break;
    case "layAdd": { const L=[...layoutOrder()], k=b.dataset.k; if(!L.includes(k)){ const ci=L.indexOf("c"); if(fieldDef(k).kind!=="c"&&ci>=0&&ci===L.length-1) L.splice(ci,0,k); else L.push(k); } saveCfg({layout:L}); render(); break; }

    case "ffType": S.fieldForm.type=b.dataset.v; render(); break;
    case "ffCancel": S.fieldForm=null; render(); break;
    case "ffSave": {

    case "copyPlan": { const d=b.dataset.date, src=dayDoc(d); if(!src) return; const n=addDays(d,7); saveDay(n,{types:dayTypeKeys(src),note:src.note||""}); savePlan(n,planItems(d)); toast(`Für ${fmtWeekday.format(toDate(n))}, ${fmtShort.format(toDate(n))} übernommen`); break; }
    case "clearPlan": put("dy_"+b.dataset.date,null); toast("Plan gelöscht"); render(); break;
    case "calMode": { const c=S.docs.get("cfg")||{kind:"settings"}; put("cfg",{...c,kind:"settings",calMode:b.dataset.v,updatedAt:Date.now()}); render(); break; }
    case "calMove": { const c=S.cal, d=new Date(c.y,c.m+(+b.dataset.d),1); S.cal={y:d.getFullYear(),m:d.getMonth()}; render(); break; }
    case "day": push({type:"day",date:b.dataset.date}); break;
    case "pickFor": push({type:"pick",date:b.dataset.date}); break;
    case "dayPdf": {
      try{
        const r=makeDayPdf(b.dataset.date); saveBlob(r.blob,r.name); toast("PDF gespeichert");
      }catch(e){ console.error(e); toast("PDF konnte nicht erstellt werden"); }
      break;
    }
    case "progView": S.prog.view=b.dataset.v; render(); break;
    case "progMetric": S.prog.metric=b.dataset.m; S.prog.sel=null; render(); break;
    case "report": push({type:"report",exId:b.dataset.ex||null}); break;
    case "repRange": S.rep.range=b.dataset.k; S.rep.result=null; render(); break;
    case "repAll": S.rep.exIds=null; S.rep.result=null; render(); break;
    case "repEx": {
      const id=b.dataset.ex, R=S.rep;
      if(!R.exIds) R.exIds=new Set([id]); else if(R.exIds.has(id)){ R.exIds.delete(id); if(!R.exIds.size) R.exIds=null; } else R.exIds.add(id);
      R.result=null; render(); break;
    }
    case "repPart": { const R=S.rep, k=b.dataset.k, other=k==="chart"?"table":"chart"; if(R[k]&&!R[other]) { toast("Mindestens Grafik oder Tabelle"); return; } R[k]=!R[k]; R.result=null; render(); break; }
    case "repMake": {
      if(S.rep.busy) return;
      S.rep.busy=true; render();
      setTimeout(()=>{
        try{ const res=makeReport(); S.rep.result=res; saveBlob(res.blob,res.name); toast("PDF erstellt"); }
        catch(e){ console.error(e); toast("PDF konnte nicht erstellt werden"); }
        S.rep.busy=false; render();
      },30);
      break;
    }
    case "repSave": if(S.rep.result) saveBlob(S.rep.result.blob,S.rep.result.name); break;
    case "repShare": {
      const r=S.rep.result; if(!r) return;
      navigator.share({files:[new File([r.blob],r.name,{type:"application/pdf"})],title:"Fortschrittsbericht"}).catch(()=>{});
      break;
    }
    case "import": $("#importFile").click(); break;
    case "install": if(installPrompt){ installPrompt.prompt(); installPrompt.userChoice.finally(()=>{ installPrompt=null; render(); }); } break;
    case "update": if(waitingWorker) waitingWorker.postMessage("skipWaiting"); break;
  }
});

/* ---------- Reihenfolge per Gedrückthalten & Ziehen ---------- */
const Sorter=(()=>{
  let st=null, holdT=null, suppressUntil=0;
  const HOLD=380, SLOP=8;
  function begin(e,item,list,immediate){
    const items=[...list.querySelectorAll(":scope>[data-sort-id]")];
    if(items.length<2) return;
    const r=item.getBoundingClientRect();
    const gap=items.length>1?(items[1].getBoundingClientRect().top-items[0].getBoundingClientRect().bottom):0;
    const sy=window.scrollY, boxes=items.map(x=>x.getBoundingClientRect());
    st={list,item,items,startY:e.clientY,startX:e.clientX,startScroll:sy,lastY:e.clientY,pid:e.pointerId,from:items.indexOf(item),to:items.indexOf(item),h:r.height+Math.max(0,gap),
      mids:boxes.map(b=>b.top+sy+b.height/2),top:r.top+sy,bottom:r.bottom+sy,active:false,immediate};
    if(immediate) activate(); else holdT=setTimeout(activate,HOLD);
  }
  function activate(){
    if(!st) return;
    st.active=true; clearTimeout(holdT);
    document.body.classList.add("sorting");
    st.items.forEach(x=>{ if(x!==st.item) x.classList.add("sort-anim"); });
    st.item.classList.add("dragging");
    if(navigator.vibrate) try{ navigator.vibrate(15); }catch(e){}
    try{ window.getSelection().removeAllRanges(); }catch(e){}
  }
  function move(e){
    if(!st||e.pointerId!==st.pid) return;
    st.lastY=e.clientY;
    if(!st.active){ if(Math.abs(e.clientY-st.startY)>SLOP||Math.abs(e.clientX-st.startX)>SLOP) cancel(); return; }
    e.preventDefault();
    layout();
    // am Rand automatisch scrollen
    const vh=window.innerHeight; if(e.clientY<90) window.scrollBy(0,-10); else if(e.clientY>vh-150) window.scrollBy(0,10);
  }
  function layout(){
    if(!st||!st.active) return;
    const dy=(st.lastY+window.scrollY)-(st.startY+st.startScroll);
    st.item.style.transform=`translateY(${dy}px)`;
    // nach oben: Oberkante des gezogenen Elements entscheidet, nach unten: Unterkante
    const topY=st.top+dy, botY=st.bottom+dy;
    let t=st.from;
    for(let i=0;i<st.from;i++){ if(topY<st.mids[i]){ t=i; break; } }
    for(let i=st.mids.length-1;i>st.from;i--){ if(botY>st.mids[i]){ t=i; break; } }
    st.to=t;
    st.items.forEach((x,i)=>{ if(x===st.item) return; let off=0; if(st.from<st.to&&i>st.from&&i<=st.to) off=-st.h; if(st.from>st.to&&i<st.from&&i>=st.to) off=st.h; x.style.transform=off?`translateY(${off}px)`:""; });
  }
  function end(e){
    if(!st||(e&&e.pointerId!==st.pid)) return;
    clearTimeout(holdT);
    const s0=st; st=null; document.body.classList.remove("sorting");
    if(!s0.active) return;
    suppressUntil=Date.now()+350;
    const ids=s0.items.map(x=>x.dataset.sortId); const [m]=ids.splice(s0.from,1); ids.splice(s0.to,0,m);
    s0.items.forEach(x=>{ x.style.transform=""; x.classList.remove("sort-anim","dragging"); });
    if(s0.to!==s0.from){ applyOrder(s0.list.dataset.sort,s0.list.dataset.date,ids); const open=!!document.querySelector("details.plan-edit[open]"); render(); if(open){ const dt=document.querySelector("details.plan-edit"); if(dt) dt.open=true; } }
  }
  function cancel(){ clearTimeout(holdT); if(st&&st.active){ st.items.forEach(x=>{ x.style.transform=""; x.classList.remove("sort-anim","dragging"); }); } st=null; document.body.classList.remove("sorting"); }
  document.addEventListener("pointerdown",e=>{
    if(e.button>0) return;
    const item=e.target.closest(".sortable>[data-sort-id]"); if(!item) return;
    const handle=e.target.closest(".drag-handle");
    if(!handle&&e.target.closest("input,textarea,select,.icon-btn")) return;
    begin(e,item,item.parentElement,!!handle);
  });
  document.addEventListener("pointermove",move,{passive:false});
  document.addEventListener("pointerup",end);
  document.addEventListener("pointercancel",e=>{ if(st&&st.active){ end(e); } else cancel(); });
  document.addEventListener("touchmove",e=>{ if(st&&st.active) e.preventDefault(); },{passive:false});
  document.addEventListener("contextmenu",e=>{ if(e.target.closest(".sortable>[data-sort-id]")) e.preventDefault(); });
  document.addEventListener("click",e=>{ if(Date.now()<suppressUntil){ e.stopPropagation(); e.preventDefault(); } },true);
  window.addEventListener("scroll",()=>{ if(st&&!st.active) cancel(); else if(st) layout(); },{passive:true});
  return {};
})();

const MSRC={ib:"InBody",fh:"Fitnesshub"};

function inbodyList(){ const out=[]; for(const [id,d] of S.docs) if(d&&d.kind==="inbody") out.push({id,...d}); return out.sort((a,b)=>b.date.localeCompare(a.date)); }
function age(p){
  if(p.birthDate&&/^\d{4}-\d{2}-\d{2}$/.test(p.birthDate)){ const b=toDate(p.birthDate), n=new Date(); let a=n.getFullYear()-b.getFullYear(); if(n.getMonth()<b.getMonth()||(n.getMonth()===b.getMonth()&&n.getDate()<b.getDate())) a--; return a>0&&a<120?a:null; }
  const y=+p.birthYear; return y>1900?new Date().getFullYear()-y:null;
}
/* ---------- Körpergewicht & Schritte pro Tag ---------- */
function weightEntries(){ const out=[]; for(const [id,d] of S.docs){ if(d&&d.kind==="day"&&d.bw>0) out.push({date:d.date,w:d.bw,src:"day"}); else if(d&&d.kind==="inbody"&&d.weight>0) out.push({date:d.date,w:d.weight,src:"ib"}); }
  const by=new Map(); for(const e of out.sort((a,b)=>a.date.localeCompare(b.date)||(a.src==="day"?1:-1))) by.set(e.date,e); return [...by.values()]; }
function latestWeight(upTo){ const L=weightEntries().filter(e=>e.date<=(upTo||todayStr())); return L.length?L[L.length-1]:null; }
function askWeight(){ return cfg().askWeight!==false; }
function dailyCard(date){
  const d=dayDoc(date)||{}, prev=weightEntries().filter(e=>e.date<date).pop();
  const ask=askWeight()&&!d.bw&&cfg().bwSkip!==date&&date===todayStr();
  const delta=d.bw&&prev?d.bw-prev.w:null;
  const motion=typeof DeviceMotionEvent!=="undefined";
  const live=Steps.active()&&Steps.date()===date;
  return `<div class="card daily${ask?" ask":""}">
    <div class="daily-top"><b>${ask?"Wie viel wiegst du heute?":"Tageswerte"}</b>${ask?`<button class="btn ghost" data-act="bwSkip" style="min-height:32px;padding:0 6px">Nicht heute</button>`:""}</div>
    <div class="daily-row">

      <label class="dv"><span>Schritte</span><span class="in"><input id="st-${date}" data-field="steps" data-date="${date}" inputmode="numeric" placeholder="0" value="${d.steps?d.steps:""}" aria-label="Schritte an diesem Tag"></span></label>
    </div>
    <div class="meta num" id="bwDelta">${delta!=null?`${delta>0?"+":delta<0?"−":"±"}${fmtNum(Math.abs(Math.round(delta*10)/10))} kg seit ${esc(relDay(prev.date))}`:prev&&!d.bw?`Zuletzt ${fmtNum(prev.w)} kg (${esc(relDay(prev.date))})`:""}</div>
    ${kcalBlock(date)}
    ${foodBlock(date)}
    ${date===todayStr()&&motion?(live?`<div class="steps-live"><span class="dot"></span><b class="num" id="stLive">${fmtNum(Steps.count())}</b> Schritte gezählt <button class="btn" data-act="stepsStop">Stopp</button></div>`:`<button class="btn ghost" data-act="stepsStart" style="align-self:flex-start;min-height:34px;padding:0 4px">Schritte jetzt live zählen</button>`):""}
  </div>`;
}

function parseFoodCsv(text){

  const num=v=>{ const t=String(v||"").replace(/[^0-9,.-]/g,""); return t?parseNum(t.includes(",")&&t.includes(".")?t.replace(/\./g,""):t):null; };
  const by=new Map();
  for(const l of lines.slice(1)){ const c=split(l), d=parseDateAny(c[di]); if(!d) continue;
    const vals={kcal:ki>=0?num(c[ki]):null,p:pi>=0?num(c[pi]):null,c:ci>=0?num(c[ci]):null,f:fi>=0?num(c[fi]):null};
    if(!Object.values(vals).some(v=>v>0)) continue;
    const cur=by.get(d)||{}; for(const [k,v] of Object.entries(vals)) if(v>0) cur[k]=(cur[k]||0)+v; by.set(d,cur); }

// Vergleich der neuesten Messung mit der vorherigen, bevorzugt vom selben Gerät
function measureCompare(id){
  const L=inbodyList(); if(!L.length) return null;
  const i=id?Math.max(0,L.findIndex(m=>m.id===id)):0, M=L[i];
  const older=L.slice(i+1), P=older.find(m=>msrc(m)===msrc(M))||older[0]||null;
  if(!P) return {M,P:null};
  const d=k=>M[k]!=null&&P[k]!=null?M[k]-P[k]:null;
  const fM=fatKg(M), fP=fatKg(P), pM=pbfOf(M), pP=pbfOf(P);
  return {M,P,mixed:msrc(M)!==msrc(P),days:dayDiffBetween(P.date,M.date),
    dW:d("weight"), dSmm:d("smm"), dFat:fM!=null&&fP!=null?fM-fP:null, dPbf:pM!=null&&pP!=null?pM-pP:null};
}
// Gewichtstrend der letzten 5 Wochen als kg pro Woche (lineare Regression)
function weightTrend(){
  const t=todayStr(), E=weightEntries().filter(e=>dayDiffBetween(e.date,t)<=35);
  if(E.length<3||dayDiffBetween(E[0].date,E[E.length-1].date)<10) return null;
  const xs=E.map(e=>dayDiffBetween(E[0].date,e.date)), ys=E.map(e=>e.w), n=E.length;
  const mx=xs.reduce((a,b)=>a+b,0)/n, my=ys.reduce((a,b)=>a+b,0)/n;
  let num=0, den=0; xs.forEach((x,j)=>{ num+=(x-mx)*(ys[j]-my); den+=(x-mx)*(x-mx); });
  return den?{perWeek:num/den*7,days:xs[n-1],n}:null;
}
// Kraft: bestes geschätztes 1RM je Übung, letzte 4 Wochen gegen die 8 Wochen davor
function strengthTrend(){
  const t=todayStr(), now={}, before={};
  for(const l of logs()){ const age=dayDiffBetween(l.date,t); if(age<0||age>84) continue;
    let b=null; for(const s of statSets(l)){ const v=e1rm(s.w,s.r); if(v!=null&&(b==null||v>b)) b=v; }
    if(b==null) continue; const T=age<=28?now:before; T[l.exId]=Math.max(T[l.exId]||0,b); }
  let up=0, down=0, same=0, best=null;
  for(const k of Object.keys(now)){ if(!before[k]) continue; const r=now[k]/before[k]-1;
    if(r>0.01){ up++; if(!best||r>best.r) best={r,exId:k}; } else if(r<-0.01) down++; else same++; }
  return {up,down,same,n:up+down+same,best};
}
function sessionsPerWeek(){ const t=todayStr(); const actD=[...S.docs.values()].filter(d=>d&&d.kind==="day"&&d.acts&&d.acts.length).map(d=>d.date); const days=[...new Set([...logsByDate().keys(),...actD])].filter(d=>{ const a=dayDiffBetween(d,t); return a>=0&&a<28; }); return days.length/4; }

function goalReport(mid){

      if(sW!=null&&Math.abs(C.dW)>2&&!has("lose")) add("info",`${wTxt()}. Bei einer Rekomposition bleibt das Gewicht normalerweise ungefähr gleich.`);
    } else {

        else if(sSmm===-1) add("warn",`${smmTxt()}${since}. Du entfernst dich gerade von deinem Ziel Muskelaufbau. Achte auf genug Eiweiß (etwa 1,6–2,2 g pro kg Körpergewicht), einen leichten Kalorienüberschuss und steigere nach und nach die Gewichte.`);

        if(sFat===1&&C.dFat>1&&(C.dSmm==null||C.dFat>C.dSmm)) add("warn",`${fatTxt()}. Das Fett steigt stärker als die Muskeln, dein Kalorienüberschuss ist vermutlich etwas zu groß.`);

        else if(sFat===1) add("warn",`${fatTxt()}${since}. Du entfernst dich gerade von deinem Ziel Fettabbau. Hilfreich sind ein moderates Kaloriendefizit, viel Eiweiß und mehr Bewegung im Alltag, zum Beispiel mehr Schritte.`);
        else if(sFat===0) add("info",`${fatTxt()}${since}, also etwa gleich. Noch kein klarer Fortschritt, bleib dran.`);
        if(C.dFat==null) add("info","Für die Auswertung braucht die App in beiden Messungen das Körperfett (kg oder %).");

        if(sSmm===-1) add("warn",`${smmTxt()}${since}. Du verlierst gerade Muskeln. Schütze sie mit schwerem Krafttraining (2–3× pro Woche), etwa 1,6–2,2 g Eiweiß pro kg und einem nicht zu großen Defizit.`);

      }
      if(k==="lose"&&!has("hold")&&!recomp&&C.dW<-1&&C.dSmm!=null&&C.dSmm<0&&-C.dSmm>-C.dW*0.4) add("warn",`${smmTxt()}: Ein großer Teil des Verlusts ist Muskelmasse. Mehr Eiweiß, weiter Krafttraining und ein kleineres Defizit schützen die Muskeln.`);

    }

  } else if(C&&!C.P&&bodyGoal) add("info",`Deine erste Messung ist gespeichert (${MSRC[msrc(C.M)]}, ${fmtShortY.format(toDate(C.M.date))}). Ab der nächsten Messung zeigt dir die App, ob du in die richtige Richtung gehst.`);
  else if(!C&&bodyGoal) add("info","Trag unten eine InBody- oder Fitnesshub-Messung ein. Ab der zweiten Messung siehst du hier, ob du in die richtige Richtung gehst.");
  // Gewichtstrend aus den Tageswerten
  if(WT&&(has("lose")||has("gain")||has("keep")||has("fat"))){
    const r=WT.perWeek, txt=`Gewichtstrend der letzten ${Math.round(WT.days/7)||1} Wochen: ${signed(r,"kg",2)} pro Woche`;
    if(has("lose")) add(r<-0.1?"good":r>0.1?"warn":"info",txt+(r<-0.1?".":r>0.1?". Das Gewicht steigt gerade.":", also etwa stabil."));
    else if(has("gain")) add(r>0.1?"good":r<-0.1?"warn":"info",txt+(r>0.1?".":r<-0.1?". Das Gewicht sinkt gerade.":", also etwa stabil."));

  if(has("strength")){

    else { const st=T.up>T.down?"good":T.down>T.up?"warn":"info";
      add(st,`In den letzten 4 Wochen bist du bei ${T.up} von ${T.n} Übungen stärker geworden${T.down?`, bei ${T.down} schwächer`:""}.${T.best&&ex(T.best.exId)?` Größter Sprung: ${ex(T.best.exId).name} (+${fmtNum(Math.round(T.best.r*100))} %).`:""}${st==="warn"?" Du entfernst dich gerade von deinem Ziel. Prüfe Schlaf, Erholung und Ernährung oder plane eine leichtere Woche ein.":""}`); }

    const sd=[...Array(7)].map((_,i)=>(dayDoc(addDays(todayStr(),-i))||{}).steps||0).filter(Boolean);
    if(sd.length>=3){ const avg=sd.reduce((a,b)=>a+b,0)/sd.length; add(avg>=7000?"good":"info",`Im Schnitt ${fmtNum(Math.round(avg))} Schritte an den Tagen mit Eintrag.${avg>=7000?"":" Mehr als etwa 7.000 Schritte am Tag gelten als gesundheitlich deutlich günstiger."}`); }

function goalPace(g,key,mode,C,WT){
  const target=parseNum(g.targets[key]); if(target==null) return null;
  const days=g.date&&/^\d{4}-\d{2}-\d{2}$/.test(g.date)?dayDiffBetween(todayStr(),g.date):null, weeks=days!=null?days/7:null;

  const L=inbodyList(), lm=L.find(m=>key==="pbf"?pbfOf(m)!=null:m[key]!=null);
  const cur=key==="weight"?((latestWeight()||{}).w||(lm&&lm.weight)||parseNum(profile().weight)):lm?(key==="pbf"?pbfOf(lm):lm[key]):null;
  const [lbl,unit]=GOAL_TARGET[key];
  if(cur==null) return {s:"info",t:`${lbl}: ${fmtNum(target)} ${unit}. Für den Fortschritt fehlt noch ein aktueller Wert${key==="weight"?"":" aus einer Messung"}.`};
  const rest=target-cur, dir=Math.sign(rest), unitW=key==="pbf"?"Prozentpunkte":unit;
  if(mode==="hold"){ const ok=Math.abs(rest)<=1; return {s:ok?"good":"warn",t:`Zielgewicht ${fmtNum(target)} kg, aktuell ${fmtNum(Math.round(cur*10)/10)} kg (${signed(cur-target,"kg")}).`}; }
  const reached=Math.abs(rest)<(key==="pbf"?0.3:0.2)||(mode==="down"?rest>=0:rest<=0);
  if(reached) return {s:"good",t:`Ziel erreicht: ${lbl} ${fmtNum(target)} ${unit}, aktuell ${fmtNum(Math.round(cur*10)/10)} ${unit}. Stark! Setz dir gern ein neues Ziel.`};
  let rate=null; // pro Woche
  if(key==="weight"&&WT) rate=WT.perWeek;
  else if(C&&C.P&&C.days>=7){ const dv=key==="pbf"?C.dPbf:C.dSmm; if(dv!=null) rate=dv/C.days*7; }
  let t=`${lbl}: noch ${fmtNum(Math.round(Math.abs(rest)*10)/10)} ${unitW} bis ${fmtNum(target)} ${unit}`, s="info";
  const eta=r=>fmtShortY.format(toDate(addDays(todayStr(),Math.round(Math.abs(rest/r)*7))));
  if(weeks!=null&&weeks>0){
    const need=rest/weeks; t+=` in ${weeks<2?days+" Tagen":Math.round(weeks)+" Wochen"}, also etwa ${fmtNum(Math.round(Math.abs(need)*100)/100)} ${unitW} pro Woche.`;
    if(key==="weight"&&need<0&&-need>cur*0.01) t+=" Das ist sehr sportlich: Als gesund gelten etwa 0,5–1 % des Körpergewichts pro Woche.";
    if(key==="weight"&&need>0.5) t+=" Das ist sehr schnell: Sinnvoll sind etwa 0,25–0,5 kg pro Woche, sonst steigt vor allem das Fett.";
    if(key==="smm"&&need>0.25) t+=" Muskelaufbau ist langsam: Realistisch sind für Einsteiger grob 0,5–1 kg im Monat, später deutlich weniger.";
    if(rate!=null){ if(Math.sign(rate)===dir&&Math.abs(rate)>=Math.abs(need)*0.8){ s="good"; t+=" Mit deinem aktuellen Tempo schaffst du das."; }
      else if(Math.sign(rate)===dir&&Math.abs(rate)>0.01){ t+=` Im aktuellen Tempo (${signed(rate,unitW,2)} pro Woche) erreichst du es etwa am ${eta(rate)}.`; }
      else { s="warn"; t+=" Im Moment bewegst du dich nicht in Richtung Ziel."; } }
  } else if(weeks!=null&&weeks<=0){ t+=`. Dein Zieldatum (${dateTxt}) ist vorbei. Setz dir gern ein neues.`; }
  else { t+="."; if(rate!=null){ if(Math.sign(rate)===dir&&Math.abs(rate)>0.01){ s="good"; t+=` Im aktuellen Tempo (${signed(rate,unitW,2)} pro Woche) etwa am ${eta(rate)}.`; } else { s="warn"; t+=" Im Moment bewegst du dich nicht in Richtung Ziel."; } } }
  return {s,t};
}
const GOAL_HEAD={good:"Du bist auf dem richtigen Weg",warn:"Achtung: Du entfernst dich gerade von deinem Ziel",mixed:"Teils auf Kurs, teils nicht",info:"Zwischenstand",none:""};
function goalBox(mid){
  const R=goalReport(mid); if(!R.g) return "";
  const list=[...R.items,...R.pace];
  if(!list.length) return `<p class="hint">Noch keine Daten für eine Auswertung. Trag dein Gewicht im Reiter „Training“ ein oder eine Messung unter „Körpermessungen“.</p>`;
  const st=R.state==="none"?"info":R.state;
  const ic={good:"↗",warn:"!",info:"i"};
  return `<div class="goal-box ${st}"><b class="goal-head">${esc(GOAL_HEAD[st]||"Zwischenstand")}</b>
    <ul>${list.map(x=>`<li class="${x.s}"><span aria-hidden="true">${ic[x.s]}</span><p>${esc(x.t)}</p></li>`).join("")}</ul></div>`;
}
function compareTable(mid){
  const C=measureCompare(mid); if(!C) return "";
  const M=C.M, P=C.P, g=goal(), has=k=>goalHas(g,k), fatWant=g&&(has("fat")||has("lose")||has("keep")||has("fit")||has("hold")||has("strength"))?-1:0;
  const rows=[["Gewicht","kg",m=>m.weight,has("lose")?-1:has("gain")?1:0],["Muskelmasse","kg",m=>m.smm,g?1:0],["Körperfett","kg",fatKg,fatWant],["Körperfett","%",pbfOf,fatWant],["Viszeralfett","",m=>m.visc,g?-1:0],["Grundumsatz","kcal",m=>m.bmr,0]]
    .filter(r=>r[2](M)!=null||(P&&r[2](P)!=null));
  const f=v=>v==null?"–":fmtNum(Math.round(v*10)/10);
  return `<div class="tbl-wrap"><table class="tbl cmp"><thead><tr><th></th>${P?`<th>${esc(fmtShortY.format(toDate(P.date)))}</th>`:""}<th>${esc(fmtShortY.format(toDate(M.date)))}</th>${P?"<th>Änderung</th>":""}</tr></thead><tbody>${rows.map(([n,u,fn,want])=>{ const a=P?fn(P):null, b=fn(M), dv=a!=null&&b!=null?b-a:null; const th=u==="%"?0.5:u==="kcal"?20:0.3; const cls=dv==null||!want||Math.abs(dv)<th?"":Math.sign(dv)===want?"up":"down"; return `<tr><td>${n}${u?` <small>${u}</small>`:""}</td>${P?`<td class="num">${f(a)}</td>`:""}<td class="num">${f(b)}</td>${P?`<td class="num ${cls}">${dv==null?"–":signed(dv,"",1)}</td>`:""}</tr>`; }).join("")}</tbody></table></div>`;
}
function openEvalSheet(id){ S.evalId=id; renderEvalSheet(); }

function wxInfo(w){
  const c=w.code;
  let cat="cloud", label="Bewölkt";
  if(c===0){ cat=w.day?"sun":"moon"; label=w.day?"Sonnig":"Klar"; }
  else if(c===1){ cat=w.day?"sun":"moon"; label=w.day?"Überwiegend sonnig":"Überwiegend klar"; }
  else if(c===2){ cat="cloud"; label="Teils bewölkt"; }
  else if(c===3){ cat="cloud"; label="Bedeckt"; }
  else if(c===45||c===48){ cat="fog"; label="Nebel"; }
  else if(c>=51&&c<=57){ cat="rain"; label="Nieselregen"; }
  else if((c>=61&&c<=67)||(c>=80&&c<=82)){ cat="rain"; label=c===65||c===82?"Starkregen":"Regen"; }
  else if((c>=71&&c<=77)||c===85||c===86){ cat="snow"; label="Schnee"; }

  if(!wxOn()&&!force) return null;

  const d=dayDoc(date); if(d&&d.wx&&!force&&Date.now()-d.wx.at<3*3600e3) return d.wx;

    <div class="btn-row"><button class="btn primary" data-act="ffSave">Feld anlegen</button><button class="btn" data-act="ffCancel">Abbrechen</button></div></div>`;
  const cf=customFields().filter(f=>!L.includes(f.k));
  if(cf.length) h+=`<div class="field"><span>Ausgeblendete eigene Felder</span><div class="list">${cf.map(f=>`<div class="lay-item"><b style="flex:1">${esc(f.n)}</b><button class="btn ghost" data-act="layAdd" data-k="${esc(f.k)}">Einblenden</button><button class="btn danger${S.armedField===f.k?" armed":""}" data-act="fieldDel" data-k="${esc(f.k)}">${S.armedField===f.k?"Wirklich?":"Löschen"}</button></div>`).join("")}</div></div>`;
  h+=`<div class="field"><span>Schnellauswahl</span><div class="chips"><button class="chip" data-act="layoutPreset" data-v="n,w,r,c" aria-pressed="${L.join()==="n,w,r,c"}">Satz · kg · Wdh. · ✓</button><button class="chip" data-act="layoutPreset" data-v="n,r,w,c" aria-pressed="${L.join()==="n,r,w,c"}">Satz · Wdh. · kg · ✓</button></div></div>
    <p class="hint">Sätze werden überall als ${repsFirst()?"„12 × 80 kg“ (Wdh. × Gewicht)":"„80 × 12“ (Gewicht × Wdh.)"} angezeigt${extraKeys().length?", zusätzliche Felder dahinter, z. B. „· Sitzhöhe 4“":""}. Ausgeblendete Felder behalten ihre bisherigen Werte.</p></div>`;
  return h;
}

/* ---------- Live-Schrittzähler (Bewegungssensor, nur solange die App offen ist) ---------- */
const Steps=(()=>{
  let on=false, n=0, base=0, day="", avg=9.81, sm=9.81, armed=true, last=0, lock=null, saveT=null;
  function onMotion(e){
    const a=e.accelerationIncludingGravity; if(!a||a.x==null) return;
    const m=Math.sqrt(a.x*a.x+a.y*a.y+a.z*a.z), t=e.timeStamp||performance.now(); S._motionSeen=true;
    sm=sm*.75+m*.25; avg=avg*.98+m*.02;
    if(armed&&sm>avg+1.15&&t-last>280){ n++; last=t; armed=false; tick(); }
    else if(!armed&&sm<avg+.25) armed=true;
  }
  function tick(){ const el=document.getElementById("stLive"); if(el) el.textContent=fmtNum(n);
    clearTimeout(saveT); saveT=setTimeout(()=>{ saveDay(day,{steps:base+n}); const inp=document.getElementById("st-"+day); if(inp&&document.activeElement!==inp) inp.value=base+n; refreshKcal(day); },1500); }
  async function start(){
    if(typeof DeviceMotionEvent!=="undefined"&&typeof DeviceMotionEvent.requestPermission==="function"){
      try{ const r=await DeviceMotionEvent.requestPermission(); if(r!=="granted"){ toast("Zugriff auf den Bewegungssensor wurde nicht erlaubt"); return false; } }catch(e){ toast("Bewegungssensor nicht verfügbar"); return false; }
    }
    day=todayStr(); base=(dayDoc(day)||{}).steps||0; n=0; on=true; armed=true; last=0;
    window.addEventListener("devicemotion",onMotion);
    try{ if(navigator.wakeLock) navigator.wakeLock.request("screen").then(l=>{ if(on) lock=l; else l.release(); }).catch(()=>{}); }catch(e){}
    setTimeout(()=>{ if(on&&n===0&&!S._motionSeen) toast("Noch keine Bewegung erkannt. Trag das Handy in der Hosentasche oder Hand."); },8000);
    return true;
  }
  function stop(){ if(!on) return; on=false; window.removeEventListener("devicemotion",onMotion); clearTimeout(saveT); saveDay(day,{steps:base+n}); try{ lock&&lock.release(); }catch(e){} lock=null; }
  document.addEventListener("visibilitychange",async()=>{ if(on&&document.visibilityState==="visible"&&navigator.wakeLock&&!lock){ try{ lock=await navigator.wakeLock.request("screen"); }catch(e){} } if(document.visibilityState==="hidden") lock=null; });
  return {start,stop,active:()=>on,count:()=>n,date:()=>day};
})();

/* ---------- Pausentimer ---------- */
function restCfg(){ const r=cfg().rest||{}; return {auto:r.auto!==false, def:r.def>0?r.def:90, sound:r.sound!==false, vib:r.vib!==false}; }
function saveRestCfg(patch){ saveCfg({rest:{...restCfg(),...patch}}); }
function restFor(e){ if(e&&typeof e.rest==="number") return e.rest; return restCfg().def; }
function fmtClock(sec){ sec=Math.max(0,Math.round(sec)); return pad(Math.floor(sec/60))+":"+pad(sec%60); }
const REST_OPTIONS=(()=>{ const a=[0]; for(let v=5; v<=600; v+=5) a.push(v); return a; })();
function openRestSheet(exId){
  const e=exId?ex(exId):null;
  S.sheet={exId, val:e?restFor(e):restCfg().def};
  renderSheet(false);
}
function closeSheet(){ S.sheet=null; $("#sheetRoot").innerHTML=""; }
function renderSheet(keepScroll){
  const sh=S.sheet; if(!sh) return;
  const e=sh.exId?ex(sh.exId):null;
  const wheel=$("#wheel"), st=wheel?wheel.scrollTop:0;
  const opts=sh.exId?REST_OPTIONS:REST_OPTIONS.filter(v=>v>0);
  $("#sheetRoot").innerHTML=`<div class="sheet-bg" data-act="sheetCancel"><div class="sheet" role="dialog" aria-modal="true" aria-label="Pausenzeit" data-act="noop">
    <div class="sheet-head"><button class="btn ghost" data-act="sheetCancel">Abbrechen</button><b>${e?"Pause":"Standard-Pause"}</b><button class="btn ghost" data-act="sheetOk" style="font-weight:700">Bestätigen</button></div>
    <div class="wheel-wrap"><div class="wheel" id="wheel"><div class="pad"></div>${opts.map(v=>`<button data-act="sheetPick" data-v="${v}" aria-pressed="${sh.val===v}">${v?fmtClock(v):"Aus"}</button>`).join("")}<div class="pad"></div></div></div>
    <div class="sheet-foot">${e?`<p class="hint" style="margin:0">Gilt für ${esc(e.name)}. Die Standard-Pause stellst du unter „Mehr“ ein.</p>`:""}${sh.val&&e?`<button class="btn" data-act="sheetStart">${ICON.clock}Jetzt ${fmtClock(sh.val)} Pause starten</button>`:""}</div>
  </div></div>`;
  const w=$("#wheel");
  if(keepScroll) w.scrollTop=st;
  const idx=opts.indexOf(sh.val);
  const target=Math.max(0,idx)*44;
  if(keepScroll) w.scrollTo({top:target,behavior:"smooth"}); else w.scrollTop=target;
  let t=null;
  w.addEventListener("scroll",()=>{ clearTimeout(t); t=setTimeout(()=>{ const i=Math.round(w.scrollTop/44), v=opts[Math.min(opts.length-1,Math.max(0,i))]; if(v!==S.sheet?.val&&S.sheet){ S.sheet.val=v; w.querySelectorAll("button").forEach(bt=>bt.setAttribute("aria-pressed",String(+bt.dataset.v===v))); const f=$(".sheet-foot"); if(f){ const e2=S.sheet.exId?ex(S.sheet.exId):null; f.innerHTML=(e2?`<p class="hint" style="margin:0">Gilt für ${esc(e2.name)}. Die Standard-Pause stellst du unter „Mehr“ ein.</p>`:"")+(v&&e2?`<button class="btn" data-act="sheetStart">${ICON.clock}Jetzt ${fmtClock(v)} Pause starten</button>`:""); } } },90); },{passive:true});
}

const Rest=(()=>{
  let end=0,total=0,label="",name="",timer=null,doneAt=0,ctx=null,scheduled=[],lock=null,hideT=null;
  const bar=()=>$("#restbar");
  function audio(){
    try{
      if(!ctx){ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null; ctx=new AC(); }
      try{ if(navigator.audioSession) navigator.audioSession.type="ambient"; }catch(e){}
      if(ctx.state==="suspended") ctx.resume();
      return ctx;
    }catch(e){ return null; }
  }
  function clearBeeps(){ for(const o of scheduled){ try{ o.stop(); }catch(e){} } scheduled=[]; }
  function beepAt(t,freq,dur,vol){
    const c=ctx; const o=c.createOscillator(), g=c.createGain();
    o.type="sine"; o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.015); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+0.05); scheduled.push(o);
  }
  function schedule(){
    clearBeeps();
    if(!restCfg().sound) return;
    const c=audio(); if(!c) return;
    const left=(end-Date.now())/1000, t0=c.currentTime+Math.max(0,left);
    // kurze Vorwarnung bei 3, 2, 1 Sekunden, dann Signal
    for(let k=3;k>=1;k--) if(left-k>0.2) beepAt(t0-k,660,0.09,0.25);
    beepAt(t0,880,0.18,0.5); beepAt(t0+0.25,880,0.18,0.5); beepAt(t0+0.5,1175,0.35,0.55);
  }
  async function wake(on){
    try{
      if(on&&!lock&&navigator.wakeLock){ lock=await navigator.wakeLock.request("screen"); lock.addEventListener("release",()=>{lock=null;}); }
      if(!on&&lock){ await lock.release(); lock=null; }
    }catch(e){ lock=null; }
  }
  function draw(){
    const b=bar(); if(!b) return;
    const now=Date.now();
    if(!end){ b.hidden=true; document.body.classList.remove("has-rest"); return; }
    b.hidden=false; document.body.classList.add("has-rest");
    const left=Math.max(0,(end-now)/1000);
    if(left<=0&&!doneAt) finish();
    if(doneAt){
      b.className="restbar done";
      b.innerHTML=`<div class="in" role="alert"><div class="row"><div class="lbl"><small>${esc(name||"Pause")}</small><span class="time" style="font-size:1.5rem">${esc(label||"Pause vorbei")}</span></div><button class="main" data-act="restStop">OK</button></div></div>`;
      return;
    }
    b.className="restbar";
    const frac=total?left/total:0;
    if(!b.querySelector(".time")){
      b.innerHTML=`<div class="in" role="timer" aria-live="off"><div class="row"><div class="lbl"><small>Pause${name?" · "+esc(name):""}</small><span class="time"></span></div><button data-act="restAdd" data-s="-15" aria-label="15 Sekunden weniger">−15</button><button data-act="restAdd" data-s="15" aria-label="15 Sekunden mehr">+15</button><button class="main" data-act="restStop" aria-label="Pause beenden">${ICON.x.replace("<svg",'<svg style="width:18px;height:18px"')}</button></div><div class="prog"><i></i></div></div>`;
    }
    b.querySelector(".time").textContent=fmtClock(Math.ceil(left));
    b.querySelector(".prog i").style.transform=`scaleX(${frac.toFixed(4)})`;
  }
  function finish(){
    doneAt=Date.now();
    const c=restCfg();
    if(c.vib&&navigator.vibrate){ try{ navigator.vibrate([350,150,350,150,600]); }catch(e){} }
    wake(false);
    clearTimeout(hideT); hideT=setTimeout(()=>{ if(doneAt) stop(); },12000);
  }
  function loop(){ clearInterval(timer); timer=setInterval(draw,250); draw(); }
  function start(secs,lbl,exName){
    total=secs; end=Date.now()+secs*1000; label=lbl||""; name=exName||""; doneAt=0; clearTimeout(hideT);
    const b=bar(); if(b) b.innerHTML="";
    schedule(); wake(true); loop();
  }
  function add(s){
    if(!end||doneAt) return;
    end=Math.max(Date.now()+1000,end+s*1000); total=Math.max(total+s,(end-Date.now())/1000);
    schedule(); draw();
  }
  function stop(){ end=0; doneAt=0; clearBeeps(); clearInterval(timer); clearTimeout(hideT); wake(false); const b=bar(); if(b) b.innerHTML=""; draw(); }
  function test(){ const c=audio(); if(!c){ toast("Ton wird hier nicht unterstützt"); return; } clearBeeps(); const t=c.currentTime+0.05; beepAt(t,880,0.18,0.5); beepAt(t+0.25,880,0.18,0.5); beepAt(t+0.5,1175,0.35,0.55); if(restCfg().vib&&navigator.vibrate) try{ navigator.vibrate([200,100,200]); }catch(e){} }
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&end&&!doneAt){ wake(true); if(ctx&&ctx.state==="suspended") ctx.resume().then(schedule).catch(()=>{}); draw(); } });
  return {start,add,stop,test};
})();

/* ---------- Backup ---------- */
async function exportBackup(){
  const docs={}; for(const [id,d] of S.docs) docs[id]=d;
  const data=JSON.stringify({app:"gym-logbuch",version:1,exportedAt:new Date().toISOString(),docs},null,1);
  const name=`gym-logbuch-backup-${todayStr()}.json`;
  const blob=new Blob([data],{type:"application/json"});
  // Auf dem Handy: Teilen-Menü (z. B. in Google Drive speichern oder per Mail an dich selbst)
  try{
    const file=new File([blob],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:"Gym-Logbuch Backup"}); return; }
  }catch(e){ if(e&&e.name==="AbortError") return; }
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
  toast("Backup heruntergeladen");
}
$("#foodFile").addEventListener("change",ev=>{
  const file=ev.target.files&&ev.target.files[0]; ev.target.value=""; if(!file) return;
  const fr=new FileReader();
  fr.onload=()=>{ const rows=parseFoodCsv(String(fr.result||""));
    if(!rows.length){ toast("Keine Einträge erkannt. Die Datei braucht eine Datums- und eine Kalorien-Spalte."); return; }
    for(const r of rows){ const {date,...v}=r, F={...foodOf(date),...v}; if(v.kcal==null) delete F.kcal; saveDay(date,{food:F}); }
    toast(`${rows.length} ${rows.length===1?"Tag":"Tage"} importiert`); render(); };
  fr.readAsText(file);
});
$("#inbodyFile").addEventListener("change",ev=>{
  const file=ev.target.files&&ev.target.files[0]; ev.target.value=""; if(!file) return;
  const fr=new FileReader();
  fr.onload=()=>{
    const rows=parseInbodyCsv(String(fr.result||""));
    if(!rows.length){ toast("Keine Messungen erkannt. Die Datei braucht mindestens eine Datums-Spalte."); return; }
    S.csvPending=rows; render(); const c=document.querySelector('[data-act="csvSrc"]'); if(c) c.scrollIntoView({block:"center",behavior:"smooth"});
  };
  fr.readAsText(file);
});
$("#importFile").addEventListener("change",ev=>{
  const file=ev.target.files&&ev.target.files[0]; ev.target.value=""; if(!file) return;
  const fr=new FileReader();
  fr.onload=async()=>{
    let parsed; try{ parsed=JSON.parse(fr.result); }catch(e){ toast("Diese Datei ist kein Gym-Logbuch-Backup"); return; }
    if(!parsed||parsed.app!=="gym-logbuch"||!parsed.docs){ toast("Diese Datei ist kein Gym-Logbuch-Backup"); return; }
    if(parsed.docs.cfg&&parsed.docs.cfg.profile&&!Object.keys(profile()).length) saveCfg({profile:parsed.docs.cfg.profile});
    if(parsed.docs.cfg&&parsed.docs.cfg.goal&&!goal()) saveCfg({goal:parsed.docs.cfg.goal});
    if(parsed.docs.cfg&&parsed.docs.cfg.icon&&!cfg().icon){ saveCfg({icon:parsed.docs.cfg.icon}); applyIcon(); }
    if(parsed.docs.cfg&&Array.isArray(parsed.docs.cfg.types)){ const have=new Set(customTypes().map(t=>t.k)); const add=parsed.docs.cfg.types.filter(t=>t&&t.k&&t.n&&!have.has(t.k)); if(add.length) saveCfg({types:[...customTypes(),...add]}); }
    const entries=Object.entries(parsed.docs).filter(([id,d])=>d&&(d.kind==="exercise"||d.kind==="log"||d.kind==="day"||d.kind==="inbody"||d.kind==="tpl")&&/^[A-Za-z0-9_\-.~:@+]+$/.test(id))
      .filter(([id,d])=>{const cur=S.docs.get(id); return !cur||(d.updatedAt||0)>(cur.updatedAt||0);});
    if(!entries.length){ toast("Alles schon vorhanden – nichts Neues im Backup"); return; }
    toast("Importiere…");
    await putMany(entries); migrateGroups(true); render(); toast(`${entries.length} Einträge importiert`);
  };
  fr.readAsText(file);
});

/* ---------- App-Symbol ---------- */
// Das gewählte Symbol landet im Cache "gym-logbuch-prefs". Der Service Worker baut daraus das Manifest,
// sodass Chrome auf Android das Symbol auf dem Startbildschirm bei der nächsten Aktualisierung übernimmt.
const APP_ICONS=[["std","Standard"],["bear-1","Bär mit Stirnband"],["bear-2","Super-Bär"],["bear-3","Sprint-Bär"],["bear-4","Liegestütz-Bär"],["bear-5","Kreuzheben-Bär"],["bear-6","Kniebeugen-Bär"],["bear-7","Musik-Bär"]];
const ICON_PERIODS=[["day","Täglich"],["week","Wöchentlich"],["month","Monatlich"],["year","Jährlich"]];
function iconCfg(){ const c=cfg().icon||{}; return {pick:APP_ICONS.some(x=>x[0]===c.pick)?c.pick:"std", random:!!c.random, period:ICON_PERIODS.some(x=>x[0]===c.period)?c.period:"week"}; }
function iconThumb(id){ return id==="std"?"icons/icon-192.png":`icons/${id}-thumb.webp`; }
function periodKey(period,date){
  const d=toDate(date||todayStr());
  if(period==="day") return date||todayStr();
  if(period==="month") return d.getFullYear()+"-"+pad(d.getMonth()+1);
  if(period==="year") return String(d.getFullYear());
  const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())), wd=(t.getUTCDay()+6)%7; t.setUTCDate(t.getUTCDate()-wd+3);
  const y=t.getUTCFullYear(), w1=new Date(Date.UTC(y,0,4)); return y+"-W"+pad(1+Math.round(((t-w1)/86400000-3+((w1.getUTCDay()+6)%7))/7));
}
function hashStr(t){ let h=2166136261; for(const ch of t){ h^=ch.charCodeAt(0); h=Math.imul(h,16777619); } return h>>>0; }
function randomIconFor(period,date){
  const n=APP_ICONS.length, key=periodKey(period,date), i=hashStr("gl:"+key)%n;
  // nicht zweimal hintereinander dasselbe Symbol
  const prevDate=period==="day"?addDays(date||todayStr(),-1):period==="week"?addDays(date||todayStr(),-7):null;
  let prev=null;
  if(prevDate) prev=hashStr("gl:"+periodKey(period,prevDate))%n;
  else { const d=toDate(date||todayStr()); const pk=period==="month"?(d.getMonth()===0?(d.getFullYear()-1)+"-12":d.getFullYear()+"-"+pad(d.getMonth())):String(d.getFullYear()-1); prev=hashStr("gl:"+pk)%n; }
  return APP_ICONS[i===prev?(i+1)%n:i][0];
}
function currentIcon(){ const c=iconCfg(); return c.random?randomIconFor(c.period):c.pick; }
async function applyIcon(){
  const id=currentIcon();
  const fav=document.querySelector('link[rel="icon"]'), apple=document.querySelector('link[rel="apple-touch-icon"]');
  if(fav) fav.href=id==="std"?"icons/icon-192.png":`icons/${id}-192.png`;
  if(apple) apple.href=id==="std"?"icons/apple-touch-icon.png":`icons/${id}-180.png`;
  try{ if(!("caches" in window)) return; const c=await caches.open("gym-logbuch-prefs"), old=await c.match("./__icon"), cur=old?(await old.json()).icon:"std";
    if(cur!==id) await c.put("./__icon",new Response(JSON.stringify({icon:id}),{headers:{"Content-Type":"application/json"}})); }catch(e){}
}
function viewIconCard(){
  const c=iconCfg(), cur=currentIcon(), isIOS=/iPhone|iPad/.test(navigator.userAgent);
  return `<div class="card panel"><h3>App-Symbol</h3><p class="muted">Welches Symbol soll auf deinem Startbildschirm zu sehen sein?</p>
    <div class="icon-grid">${APP_ICONS.map(([id,n])=>`<button class="icon-pick" data-act="iconPick" data-v="${id}" aria-pressed="${!c.random&&c.pick===id}" aria-label="${esc(n)}"${c.random?" disabled":""}><img src="${iconThumb(id)}" alt="" loading="lazy">${c.random&&cur===id?`<em>gerade</em>`:""}</button>`).join("")}</div>
    <div class="switch-row"><span>Zufällig wechseln</span><button class="switch" role="switch" data-act="iconRandom" aria-checked="${c.random}" aria-label="Symbol zufällig wechseln"></button></div>
    ${c.random?`<div class="chips">${ICON_PERIODS.map(([k,l])=>`<button class="chip" data-act="iconPeriod" data-v="${k}" aria-pressed="${c.period===k}">${l}</button>`).join("")}</div><p class="meta">Aktuell: ${esc(APP_ICONS.find(x=>x[0]===cur)[1])}</p>`:""}
    <p class="hint">${isIOS?"Auf dem iPhone übernimmt Safari das Symbol nur beim Hinzufügen zum Home-Bildschirm. Wähle es also vorher aus. Zum späteren Wechseln müsstest du die App entfernen und neu hinzufügen. Achtung: Beim Entfernen löscht das iPhone deine Daten, mach vorher unbedingt ein Backup (unten).":"Auf Android übernimmt Chrome das neue Symbol nicht sofort: Chrome prüft beim Öffnen der App höchstens einmal am Tag, ob sich etwas geändert hat, und tauscht das Symbol dann aus, sobald die App geschlossen ist und das Handy im WLAN lädt. Bei einem neuen Bild fragt Chrome meist einmal nach, ob du das neue Symbol übernehmen willst (manchmal nur als Hinweis im Menü ⋮). Ein täglicher Wechsel kann deshalb hinterherhinken."}</p></div>`;
}

/* ---------- Installieren & Offline ---------- */
window.addEventListener("beforeinstallprompt",ev=>{ ev.preventDefault(); installPrompt=ev; if(S.tab==="more"&&!top()) render(); });
window.addEventListener("appinstalled",()=>{ installPrompt=null; toast("App installiert"); render(); });
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js").then(reg=>{
      const watch=w=>{ if(!w) return; w.addEventListener("statechange",()=>{ if(w.state==="installed"&&navigator.serviceWorker.controller){ waitingWorker=w; renderFromData(); } }); };
      if(reg.waiting&&navigator.serviceWorker.controller){ waitingWorker=reg.waiting; renderFromData(); }
      reg.addEventListener("updatefound",()=>watch(reg.installing));
      document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") reg.update().catch(()=>{}); });
    }).catch(()=>{});
    let reloading=false;
    navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(reloading) return; reloading=true; leaveCurrent(); location.reload(); });
  });
}

init();
applyIcon();
setInterval(()=>{ refreshKcal(todayStr()); },60000);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"){ applyIcon(); refreshKcal(todayStr()); } });
})();
